:"kz-bg3-chuze-vetrem","type":"kouzlo","name":"Chůze větrem","alias":["Wind Walk"],"tags":["kouzlo","6. úroveň","BG3","jiné povolání"],"short":"družina se změní v mlhu a letí (mimo boj)","body":"Družina se změní v mlhu a letí (mimo boj). **Kdo ho umí:** druid. Karibrk ho jako čaroděj připravit nemůže.","src":"kánon","mech":{"škola":"přeměňování","dosah":"9 m","trvání":"8 hodin","záchrana":"—","kostky":"—","soustředění":"ne","rituál":"ne","povolání":"druid","zdroj":"Baldur's Gate 3 (bg3.wiki)"},"lvl":6},{"id":"kz-bg3-prizrak-seelie-privolani-devy","type":"kouzlo","name":"Přízrak Seelie: Přivolání dévy","alias":["Sights of the Seelie: Summon Deva"],"tags":["kouzlo","6. úroveň","BG3","jiné povolání"],"short":"přivolá dévu jako spojence","body":"Přivolá dévu jako spojence. **BG3:** původní kouzlo BG3. **Kdo ho umí:** zvláštní (odměna z úkolu ve Feywildu). Karibrk ho jako čaroděj připravit nemůže.","src":"kánon","mech":{"škola":"vyvolávání","dosah":"18 m","trvání":"do dlouhého odpočinku","záchrana":"—","kostky":"—","soustředění":"ne","rituál":"ne","povolání":"zvláštní (odměna z úkolu ve Feywildu)","zdroj":"Baldur's Gate 3 (bg3.wiki)"},"lvl":6},{"id":"bg3-kouzla","type":"pravidlo","name":"Kouzla z Baldur's Gate 3","alias":["BG3 kouzla"],"tags":["pravidlo","kouzla"],"short":"Databáze doplněna o všechna hráčská kouzla BG3 (triky až 6. úroveň). Čaroděj = wizard, kouzelník = sorcerer.","body":"Zdroj: seznam kouzel BG3 (Fextralife blokuje strojové čtení, data z bg3.wiki, Patch 8 — stejný herní obsah). Kouzla, která Karibrk jako čaroděj umí, jsou v nabídce „vyměnit“; ostatní jsou jen v Lore se štítkem „jiné povolání“. Původní kouzla BG3: Praskající šlacha, Danse Macabre, Sesazení, Učební plán strategie. Opraveny úrovně podle kánonu: Evardova chapadla 4., Otilukeho odolná koule 4., Tvrdošíjná (kamenná) zeď 5., Kruh smrti 6., Otilukeho mrazivá koule 6.","src":"kánon","mech":{},"lvl":null},{"id":"dyka-jedu","type":"predmet","name":"Dýka jedu","alias":["Dagger of Venom"],"tags":["předmět","zbraň","vzácný","Železný trůn","Karibrk"],"short":"Dýka +1; 1x za úsvit jed: +2k10 jed, záchrana Odl SO 15 nebo otrávený","body":"Předmět z Průvodce pána jeskyně (Dagger of Venom). Z kultovní truhlice, zabalená v kůži s cejchem Železného trůnu. Železný trůn je obchodní spolek, který v BG1 stojí za železnou krizí na Mečovém pobřeží — a kult mu za něco platil.","src":"kánon","mech":{},"lvl":null},{"id":"kz-bg3-paprsky-ohne","type":"kouzlo","name":"Paprsky ohně","alias":["Rays of Fire"],"tags":["kouzlo","trik","BG3","předmětové"],"short":"tři ohnivé paprsky, dosah 18 m; propůjčují Rukavice pekelného soumraku","body":"Předmětový trik z Baldur's Gate 3. Propůjčují ho Rukavice pekelného soumraku (Helldusk Gloves); vyšle tři ohnivé paprsky na vzdálenost 18 m. Není veden jako běžně naučitelné kouzlo čaroděje, proto je zapsaný v Lore, ale není v nabídce výměny připravených kouzel.","src":"kánon","mech":{"dosah":"18 m","soustředění":"ne","rituál":"ne","zdroj":"Baldur's Gate 3 spell catalogue — item-source cantrip","předmět":"Helldusk Gloves / Rukavice pekelného soumraku"},"lvl":0},{"id":"rehor","type":"postava","name":"Řehoř","alias":[],"tags":["NPC","bývalý skladník","propuštěn"],"src":"hra","short":"Starší mlčenlivý skladník od mauzolea Malcherů; najatý člověk, ne fanatik.","body":"Čtvrtý den dvojité směny, pět stříbrných za noc. Karibrk ho varoval a nechal odejít; Řehoř mu za to dal klíč od spodní zástrčky.","mech":{},"lvl":null},{"id":"voleg","type":"postava","name":"Voleg","alias":[],"tags":["NPC","bývalý skladník","propuštěn"],"src":"hra","short":"Ukecanější z dvojice skladníků od mauzolea Malcherů; slyšel kroky pod podlahou.","body":"Čtvrtý den dvojité směny, pět stříbrných za noc. Nebyl fanatik a dolů do kanálů nesměl. Po Karibrkově varování odešel spolu s Řehořem.","mech":{},"lvl":null},{"id":"hulka-tajemnych-strel","type":"predmet","name":"Hůlka tajemných střel","alias":["Wand of Magic Missiles"],"tags":["magický","Karibrk","kořist"],"src":"kánon","short":"Hůlka se 7 náboji pro Magickou střelu.","body":"Za 1 náboj sesílá Magickou střelu se třemi střelami; další náboje přidávají střely. Za svítání obnovuje 1k6+1 nábojů. Při vyčerpání posledního náboje se na 1 na k20 rozpadne.","mech":{"náboje":"7","vzácnost":"neobvyklý"},"lvl":null},{"id":"plast-elfiho-druhu","type":"predmet","name":"Plášť elfího druhu","alias":["Cloak of Elvenkind"],"tags":["magický","Tina","kořist"],"src":"kánon","short":"Výhoda na plížení; pozorovatelé mají nevýhodu při hledání zrakem.","body":"Magický plášť nalezený v kultovní truhlici. Tina ho nosí místo původního tmavého pláště.","mech":{"sladění":"ano","vzácnost":"neobvyklý"},"lvl":null},{"id":"krouzkova-kosile-plus1","type":"predmet","name":"Kroužková košile +1","alias":["Chain Shirt +1"],"tags":["magický","Sandor","kořist"],"src":"kánon","short":"Magická kroužková košile, Zbroj 17 v Sandorově současné konfiguraci.","body":"Sandor po jejím získání předal starou kroužkovou košili Rockymu, který ji nosí jako zástěru.","mech":{"bonus":"Zbroj +1","vzácnost":"vzácný"},"lvl":null},{"id":"perla-moci","type":"predmet","name":"Perla moci","alias":["Pearl of Power"],"tags":["magický","Mer","kořist"],"src":"kánon","short":"Jednou denně obnoví vyčerpanou pozici 3. úrovně nebo nižší.","body":"Mer ji získala z kultovní truhlice. Vyžaduje sladění.","mech":{"náboje":"1 za den","sladění":"ano","vzácnost":"neobvyklý"},"lvl":null},{"id":"amulet-zelezneho-trunu","type":"predmet","name":"Amulet Železného trůnu (prasklý)","alias":["prasklý amulet Železného trůnu"],"tags":["Ula","Železný trůn","kořist"],"src":"hra","short":"Bezcenná prasklá relikvie, kterou Ula nosí, protože praskla a přesto drží.","body":"Nalezen v kultovní truhlici. Motiv Železného trůnu se opakuje i na Dýce jedu a v Seznamu plateb.","mech":{},"lvl":null},{"id":"calimport","type":"misto","name":"Calimport","alias":[],"tags":["Calimshan","nové dobrodružství"],"src":"kánon","short":"Obrovské město daleko na jih od Baldurovy brány; druhá dějová linka se tu poprvé ukázala v den 41.","body":"Karibrk o dění v Calimportu zatím nic neví. Hráč ale paralelní scénu viděl.","mech":{},"lvl":null},{"id":"pikk","type":"postava","name":"Pikk","alias":[],"tags":["NPC","kobold","dítě","Calimport"],"src":"hra","short":"Devítiletý kobold z Calimportu. V den svých narozenin zjistil, že jeho sestra Suri zmizela.","body":"Nese jen to, co hráč už viděl: žlutý šátek, jeden sandál, měďák od neznámého tieflinga a sestru, pro kterou nesl skořicovou placku. Po návratu našel byt prázdný a stejný znak jako na Karibrkově zásilce.","mech":{},"lvl":null},{"id":"suri","type":"postava","name":"Suri","alias":[],"tags":["NPC","kobold","dítě","Calimport","nezvěstná"],"src":"hra","short":"Pikkova třináctiletá sestra. V den 41 zmizela z jejich pokoje beze stop.","body":"Její sandály a modrá stuha zůstaly doma. Její stav je neznámý.","mech":{},"lvl":null},{"id":"anonymni-zasilka","type":"predmet","name":"Anonymní zásilka pro Karibrka","alias":["balíček","anonymní balík"],"tags":["nové dobrodružství","neotevřeno"],"src":"hra","short":"Balíček doručený U Tří vran bez odesílatele. Karibrk ho zkoumá; zatím neotevřen.","body":"Na štítku je drobný znak: kruh a dvě krátké čáry, jedna zleva a jedna zprava, které se nedotýkají. Uhlík od zásilky po očichání couvl. Rocky prohlásil, že věc uvnitř „nikdy nebyla v zemi“. Karibrk při opatrné prohlídce nenašel běžnou mechanickou past, jehlu, drát ani alchymistický únik; papír a provázek jsou obyčejné, ale zpod obalu nepřichází prakticky žádný pach. Balík zůstává neotevřený.","mech":{},"lvl":null},{"id":"znak-kruh-dve-cary","type":"predmet","name":"Znak kruhu a dvou čar","alias":["neznámý znak"],"tags":["symbol","nové dobrodružství"],"src":"hra","short":"Kruh se dvěma krátkými čarami, které se uvnitř nedotýkají.","body":"Hráč ho viděl na Karibrkově anonymní zásilce a v paralelní scéně v Calimportu. Význam je neznámý.","mech":{},"lvl":null},{"id":"hrobopis-aktivni-zakony","type":"pravidlo","name":"Hrobopisec — aktivní zákony","alias":["Šev","Zákon zápisu","Hřbitovní půda","Pečetě hrobopisce","Ossuárium"],"tags":["pravidlo","Hrobopis","Karibrk","aktivní"],"short":"Pečetě 1/12. Trvalí přetvořenci; vazební limit 3. Šev od 3, Zákon zápisu od 6, Hřbitovní půda + Ossuárium od 9, zrod Hrobopisce při 12.","body":"AKTIVOVÁNO HRÁČEM DEN 41. Pečetě se nedopočítávají zpětně a nikdy nejsou za zabíjení; PJ je udělí za dobrodružství, v němž Karibrk použije nekromancii způsobem, který je skutečně nový, ne jen silnější. ŠEV (od 3 Pečetí): po boji nebo na hřbitově 10 minut práce vyrobí z mrtvoly jeden díl — Kost, Šlachu, Oko, Kůži nebo Zub. Při seslání přetvořence lze vložit až INT modifikátor (5) dílů; Kost +1 Zbroj, Šlacha +3 m rychlosti, Oko temnozrak +18 m nebo vidění neviditelného na 1 minutu, Kůže +5 životů, Zub +1k4 ke zranění prvního zásahu za kolo. Díly se spotřebují. Díly z tvorů, které Karibrk sám zabil, stojí karmu −1 za každý kus nad tři na scénu. ZÁKON ZÁPISU (od 6): přetvořenci lze dát pravé jméno mrtvého, z něhož vznikl. Dostane +1 Zbroj, +1 k útoku a vydrží jedno kolo po ztrátě soustředění. Cena: jméno je nárok, mrtvý to vidí v Kelemvorově zápisu a Mer ztrácí 5 Důvěry za každé takové pojmenování. Tvor, kterému bylo za života jméno vzato, pojmenovat nejde. HŘBITOVNÍ PŮDA (od 9): hodinový rituál a pytel prsti ze tří hrobů vytvoří na 24 hodin kruh 9 m zasvěcený smrti; Karibrkovi přetvořenci v něm mají +2 životy za úroveň pozice, živí mají nevýhodu na záchrany proti smrti. Nelze na půdě zasvěcené jinému bohu. Při 9 Pečetích se zároveň otevírá první školní schopnost Ossuárium. Při 12 vzniká plná cesta/povolání Hrobopisec. **TRVALOST PŘETVOŘENCŮ:** hotový přetvořenec není udržované kouzlo. Bez koncentrace a bez doby trvání přetrvá do zničení, trvalého odvolání nebo rozvázání vazebního jádra. Karibrkův vazební limit = bonus zdatnosti (nyní 3). **KLIDOVÁ FORMA:** 1 minuta, dotyk, bez pozice; přetvořenec se fyzicky složí/rozloží do své logické neaktivní podoby, ale pořád zabírá jeden vazební zápis. Probuzení 1 minuta, bez pozice. **PROTIHRA:** Dispel Magic proti SO 10 + úroveň zápisu uspí na hodinu; antimagie uspí po dobu pole; Turn Undead funguje normálně; zničení kotvy končí vazbu. Přímé minutové posvěcení kotvy může vazbu přerušit po úspěšném ověření sesílací vlastnosti proti Karibrkovu SO kouzel.","src":"hráč + Kodex Hrobopisce","mech":{"pečetě":"1/12","aktivní":"ano","šv":"od 3","zápis":"od 6","půda":"od 9","povolání":"od 12"},"lvl":null},{"id":"prazdny-radek-cernooka","type":"pravidlo","name":"Prázdný řádek","alias":["pozvání Černooké"],"tags":["Černooká","kontakt","vedlejší linka"],"src":"hra","short":"Ilvosův starý způsob, jak dát Černooké možnost všimnout si pozvání; není to přivolání ani pouto.","body":"Používá se na místě, kde se Černooká už sama manifestovala. Na obyčejný list napíše odesílatel vlastní přesné jméno vlastní rukou, pod ním nechá jeden záměrně prázdný řádek a pod něj napíše jednu úplně pravdivou větu, která vysvětluje, proč s ní chce mluvit. Nic se nepíše do prázdného řádku, žádný titul ani náhradní jméno. List se nechá v místnosti a místnost se vyprázdní. Metoda nic nevynucuje, nesvazuje a nedává odpověď automaticky; pouze vytváří přesný zápis s vědomou absencí, kterou podle Ilvose Černooká někdy dokázala vnímat. Po čtvrté pravdě už Ilvosovi nefunguje, protože mu sama vzala vidění. U Karibrka výsledek neznámý.","mech":{},"lvl":null}],"BONDS":{"cernooka":{"name":"Karibrk a Černooká","kind":"romance","who":"karibrk","with":"Černooká","m":{"bliz":35,"duv":50,"zav":15,"cena":10},"note":"Jedna noc, tři pravdy, čtvrtá navíc a slovo dané do prázdného vzduchu. ČERNÁ NIT: dlouhodobá romantická vedlejší linka, která se může prolínat všemi taženími, ale nikdy není podmínkou hlavního dobrodružství, nedává povinnou stopu ani Deus ex machina řešení. POUTO se mění jen za skutečné milníky. Manifestace: podstata částečně pochopená; Černooká souhlasí s hledáním cesty do plnější formy, ale jen dobrovolně, s vlastním právem odejít a bez cizího hostitele; připouští živou schránku vytvořenou jen pro ni. Jméno chce pouze jako vlastní volbu, ne jako označení přidělené zvenčí. Kotva a přesná hranice zůstávají nevyřešené.","log":[{"d":35,"t":"Podkroví nad pekařstvím. Tři otázky, tři pravdy — a on se zeptal na slabost, pyramidu a způsob útoku místo na plán.","dx":{"bliz":10,"duv":20},"mile":"První setkání. Neuhnul pohledem a neprosil."},{"d":35,"t":"Řekl jí, že je krásná. Ona řekla, že by jí správně řekl prázdná — a že to přesto bere, protože to řekl navzdory tomu, co je.","dx":{"bliz":10,"duv":5},"mile":"Jediný kompliment, který za osmdesát let nebyl o tvaru."},{"d":35,"t":"Čtvrtá pravda z vlastní vůle: Elie a Ula přestávají být zajímavé. Zaplatila za to víc než za tři předchozí dohromady.","dx":{"duv":15,"cena":5},"mile":"Vzdala se osmdesáti let práce kvůli jedné větě o tom, že mu nejde o výhru."},{"d":35,"t":"Dal jí slovo do prázdna, že se pokusí najít způsob, jak ji dostat do plnější formy. Nevěděl, jestli ho slyší. Řekl to stejně.","dx":{"bliz":5,"zav":15,"cena":5},"mile":"Slib, který neumí splnit a nemá komu vrátit."},{"d":41,"t":"Karibrk použil Ilvosův prázdný řádek jako pozvání: napsal své jméno, ponechal místo pro ni a pravdivě požádal, aby přišla i tehdy, kdyby ho chtěla jen poslat do prdele. Černooká přišla z vlastní vůle.","dx":{"bliz":5},"mile":"Poprvé ji oslovil bez otázky, nátlaku nebo problému k řešení a ona se rozhodla přijít."},{"d":41,"t":"Karibrk jí vyložil Dědkovu teorii kotvy, hranice a jména a výslovně jí řekl, že případná manifestace nevytvoří žádný dluh ani nárok. Rozhodnutí nechal na ní. Černooká souhlasila s hledáním cesty, ale pouze pokud si zachová možnost sama odejít, nebude použito živé tělo a případné jméno bude její vlastní volba.","dx":{"bliz":5,"duv":10},"mile":"Poprvé jí nenabídl záchranu, ale volbu. Ona řekla ano pokusu, ne vlastnictví."},{"d":41,"t":"Karibrk upřesnil, že nechce použít živého hostitele, ale vytvořit pro Černookou vlastní živou schránku schopnou chuti, doteku a rozkoše, bez stárnutí, bez předchozího vlastníka a s jejím právem kdykoli odejít. Černooká tento směr připustila jako přijatelný, konečné ano ale dá až konkrétnímu plánu. Karibrk navrhl pracovní jména DéMonika, Živola a Bhaalónka.","dx":{},"mile":"Hranice mezi tělem a vězením byla poprvé formulována oběma stranami."}],"rules":{"side_story":true,"main_plot_dependency":false,"axes":["blízkost","důvěra","závislost","cena"],"manifestace":["podstata částečně pochopená","jméno: chce možnost zvolit si vlastní","schránka/kotva: může být živá, jen pokud byla vytvořena výhradně pro ni, nikdy nenesla cizí osobu a není zdrojem její existence","hranice: musí obsahovat její vlastní okamžitou cestu ven; zničení schránky pouze ukončí manifestaci","svobodný souhlas: ANO k pokusu, ne bianco souhlas k finálnímu rituálu"]}},"elie":{"name":"Karibrk a Elie","kind":"rodina","who":"karibrk","with":"Elie","m":{"bliz":85,"duv":95,"zav":30,"cena":40},"note":"Nejsilnější pouto v téhle partě a jediná brzda, kterou Karibrk má. Řekla mu tati dvakrát. Drží dřevěnou kravičku jako úkol dožít se návratu.","log":[{"d":30,"t":"Poprvé řekla tati. Neopravil ji.","dx":{"bliz":15,"duv":10},"mile":"Tati, poprvé."},{"d":33,"t":"Zhroutila se u večeře jako obyčejná devítiletá — ne kvůli nebezpečí, ale kvůli tomu, že poprvé má co ztratit.","dx":{"bliz":10,"zav":10,"cena":10},"mile":"Poprvé brečela kvůli tomu, co má, ne kvůli tomu, co jí vzali."},{"d":36,"t":"Kvůli myšlence na ni zastavil smrtící ránu půl vteřiny před dopadem.","dx":{"duv":5,"cena":5},"mile":"Nechal Vaelora žít."}]},"ula":{"name":"Karibrk a Ula","kind":"rodina","who":"karibrk","with":"Ula","m":{"bliz":60,"duv":70,"zav":20,"cena":35},"note":"Slovo tati nikdy nepoužije — měla jednoho a ten ji prodal. Řekla nahlas, že to není tím, že by jí za to nestál. Slyšela, co dělal Kessilovi, a neodpustila mu to.","log":[{"d":27,"t":"Slyšela z okna, co dělal svázanému zajatci. Ráno se zeptala, jestli by ublížil i jí. Neuměl odpovědět ne.","dx":{"duv":-15,"cena":15},"mile":"Rozhovor, který skončil bez odpuštění."},{"d":33,"t":"Odmítla roli náhradní matky. Řekl jí: nestarej se o ni, buď s ní.","dx":{"bliz":10,"duv":10},"mile":"Přestal po ní chtít, aby byla dospělá."}]}},"SOUDEK":["sutrostrom"],"FOES":["vaelor"]}</script>
<script id="STATE">window.__STATE__={"ver":2,"savedAt":"18:02:00","day":41,"sparks":10098,"sum":"Družina žije v Poštovní stanici U Tří vran, hodinu koňmo od Baldurovy brány. Domov používá v rodině i druhé jméno Útočiště; hospoda otevírá dva karavanní dny z tendeny. Rocky (dříve jen Šutrostrom) je plnohodnotný obyvatel domu a Uhlík je Elin pes.\n\nDOBRODRUŽSTVÍ VYHASLÁ ČÍŠE JE UZAVŘENO. Černooká stáhla zájem hereze o Elii a Ulu; Ilvos přežil bez moci pod jménem Malen Dorrick. Volo byl odhalen jako nevědomé „oko“, nikoli vědomý zrádce. Karibrk dal Černooké slovo, že se pokusí najít způsob, jak ji dostat z prázdného stavu do plnější formy. Mlazivoj Vaelor existuje jako budoucí arcinepřítel, ale je neaktivní, dokud hráč neurčí jeho přesná pravidla.\n\nKaribrk dosáhl 7. úrovně. Automatické změny platí: jedna pozice 4. úrovně, 12 připravených kouzel a Arkánové zotavení v součtu 4 úrovní pozic. Dvě nová kouzla zdarma do knihy a způsob navýšení maximálních životů ještě hráč nepotvrdil.\n\nDEN 41: po třech klidných dnech začalo nové dobrodružství nevinně anonymní zásilkou U Tří vran. Balíček nese znak kruhu se dvěma nedotýkajícími se čarami, Uhlík od něj couvl a Rocky tvrdí, že obsah nikdy nebyl v zemi. Ve stejné době v Calimportu zmizela třináctiletá koboldka Suri; její bratr Pikk našel stejný znak. Karibrk o calimportské lince zatím nic neví. Karibrk při průzkumu zásilky oddělil Elie a Ulu do bezpečí, použil jednu dávku kydajícího brka a seslal Detekci magie; balíček zatím neotevřel.\n\nDEN 41 — RUKA A HROBOPIS: Karibrk odmítl sledovat anonymní návnadu a předal překlad Dědkovi s příkazem nerušit ho, pokud nejde o kosmicky zásadní věc. S Dědkem otevřel vedlejší Černou nit kolem Černooké; další logický krok je zjistit od ní, zda vůbec chce jméno a plnější manifestaci. Poté v podzemí U Tří vran aktivoval Kodex Hrobopisce a poprvé prakticky uskutečnil svůj vlastní rukopis: z hrobové prsti vyvolal Hrobového červa. Hrobopisec je aktivní systém, Pečetě 1/12.\n\nDEN 41 — UJASNĚNÍ HROBOPISU: přetvořenci jsou od dokončení trvalé fyzické výtvory. Nevyžadují soustředění ani nemají časový limit. Karibrk má vazební limit 3 navázaných přetvořenců (bonus zdatnosti), spící i probuzení. Přetvořenec lze za 1 minutu dotykem uložit do logické klidové formy a za 1 minutu bez nové pozice probudit. Hrobový červ při spánku pustí vypůjčenou zeminu a zůstane jako kompaktní hrobní uzel. Skutečné univerzální skladování je až budoucí Ossuárium.","plot":"NOVÉ DOBRODRUŽSTVÍ — AKTIVNÍ PARAMETRY PRO PJ, BEZ DĚJOVÝCH SPOILERŮ\n\n- Hráč ovládá výhradně Karibrka de Vill; PJ ovládá svět, NPC a protivníky. Co Karibrk řekne nebo udělá, se nepřepisuje.\n- Dobrodružství má délku přibližně jako předchozí dvě. Skutečný vstup do problému nejpozději do 10 významných tahů; náznaky a výzvy mohou přijít dřív a hráč je může ignorovat.\n- Obtížnost boje i celková obtížnost nejméně dvojnásobná proti předchozím dobrodružstvím. Žádné podvádění ve prospěch scénáře; chytré řešení může připravenou část dobrodružství úplně obejít.\n- Nepřátelé jsou v drtivé většině jiné rasy než lidé.\n- Přibližně 70 % odkazů, atmosféry, lore, historických stop a easter eggů vychází z Planescape: Torment; zbytek Forgotten Realms/Baldur’s Gate podle situace. Morte je výslovně rezervovaný pro budoucí překvapení a v tomto období se nepoužívá ve významné roli.\n- Zatím se hraje na Materiální sféře / Torilu. Skutečné vzdálenosti lokalit se respektují, ale existuje alternativní způsob rychlé dopravy mezi vybranými místy, takže vzdálená cesta nemusí spotřebovat více herního času než cesta U Tří vran ↔ Baldurova brána. Pokud je návrat delší dobu nemožný, v cílové oblasti musí existovat rozumné základní zásobování, pokud situace sama není vězení či podobná výjimka.\n- Žádní bohové jako hlavní protivníci, žádná proroctví tisíce let stará, žádné kulty jako hlavní osa.\n- Začátek má být nevinný, klidně vtipný a nečekaný; postupně se má zvrtnout do osobní, odporné krutosti ve stylu „jak tohle může jedna bytost dělat druhé“. Hlavní protivnická energie se inspiruje psychologickou nepředvídatelností a charismatem typu Vaas, nikoli kosmickou všemocností.\n- Vyprávění má dvě paralelní dějové linky: Karibrkův všední život a vzdálené dění. Nejprve téměř nesouvisejí, potom se přibližují drobnými body a v několika okamžicích prudkými skoky, až se spojí.\n- Styl vyprávění: přibližně 70 % plné, pestré, dlouhé prózy pro klid, průzkum, vztahy a atmosféru; přibližně 30 % krátké a ostré věty pro akci, napětí a rychlé dialogy. Poměr se řídí scénou.\n- PJ aktivně připomíná relevantní zapomenutelné možnosti Karibrka (hobití vlastnosti, feat, Arkánové zotavení, předměty, reakce, rezistence apod.), když by otevřely reálnou možnost, kterou hráč zjevně přehlédl.","sec":21,"who":"karibrk","events":[{"d":1,"t":"Koupena Poštovní stanice U Tří vran od mnicha Dorndela za 1 zlatý — vydíráním nabídkou rubriky pro Candlekeep."},{"d":1,"t":"Podmínka koupě: rubrika musí doputovat do Candlekeepu do roka, jinak doplatek."},{"d":6,"t":"Oprava domu hotová. Truhlář Ossvin a malířka cedulí Seska pomohli zdarma."},{"d":6,"t":"Cedule zůstala stará — dvě vyřezané vrány přežily oheň, třetí vyřezal Sandor."},{"d":8,"t":"Elie si u farmáře Bertolda vybrala psa Uhlíka. Spíš on si vybral ji."},{"d":10,"t":"Otevírací večer. Volo se pozval sám jako kronikář, o pivu si zapsal nesmysly."},{"d":10,"t":"Stanoven provoz: hospoda jede jen dva karavanní dny z tendeny."},{"d":14,"t":"První sovy. Mlčky, neloví, sedí a dívají se k domu."},{"d":16,"t":"Sov přibývá. Vždycky koukají tam, kde zrovna je Elie nebo Ula."},{"d":20,"t":"Družina staví kolem domu hraniční zádrž — perimetr."},{"d":22,"t":"Test perimetru: Volo přešel linii uprostřed věty o drakobijci a na tři vteřiny znehybněl. Funguje."},{"d":23,"t":"Elminster se objevil v hospodě. Karibrk ho poznal a oslovil jménem — utajení padlo."},{"d":23,"t":"Elminsterova rada: neptat se JAK kult zastavit, ale PROČ se probudil zrovna teď."},{"d":26,"t":"Noc utoku odrazena. Sest Cisniku, tri mrtvi, tri zajati."},{"d":27,"t":"Vyslech zajatcu. Karibrk, Mer a Sandor jim zlomili mysl. Vysypali vsechno."},{"d":27,"t":"Zjisteno: Elie je pro kult prasklá nádoba, Ula prázdná. Ritual potrebuje obe."},{"d":27,"t":"Ziskano heslo ke vstupu do kultovniho sidla."},{"d":28,"t":"Sidlo kultu: mauzoleum vyhasleho rodu Malcherů, hrbitov Na spálence ve Vnějším městě."},{"d":28,"t":"V mauzoleu je skrys - vstup do starych kanalu. Kam vedou, nikdo ze zajatcu nevedel."},{"d":29,"t":"Mer zustava U Tří vran hlidat Elii a Ulu."},{"d":29,"t":"Karibrk, Sandor a Tina vyrazili k mauzoleu. Tina jde dovnitr maskovana jako clenka kultu."},{"d":28,"t":"Upresneno: mauzoleum neni hlavni stan. Je to prekladiste - sklad + tajny vchod do katakomb."},{"d":28,"t":"Hlavni lezeni kultu je v katakombach, kam vedou kanaly ze skryse pod podlahou hrobky."},{"d":29,"t":"Karibrk sel k mauzoleu sam, jako ztraceny opily hobit hledajici Sharessino pohlazeni."},{"d":29,"t":"Skladnici: starsi mlcenlivy + ukecany Voleg. Nudi se, pijou, povidaji."},{"d":29,"t":"Maji dvojitou smenu ctvrty den - tri kluci nepresli a NIKDO je nejde hledat."},{"d":29,"t":"Plat pet stribrnych za smenu - smesne moc za noseni beden. Plati se za mlceni."},{"d":29,"t":"TERMIN: do tri dnu musi byt vsechno DOLE. Pak prý bude klid a plat navic."},{"d":29,"t":"Skladnici dolu nechodi nikdy. Bedny se postavi u zdi ve sklepe a jde se nahoru."},{"d":29,"t":"Kdo si bedny odnasi, nevi. Berou se v noci."},{"d":29,"t":"Skrz podlahu je slyset, jak dole nekdo chodi. Starsi si zvykl, Voleg ne."},{"d":29,"t":"Karibrk varoval skladniky a nabidl jim, at odejdou hned - cizi lidi, kteri mu nic nedluzi."},{"d":29,"t":"Odmena: +100 jisker (CENA), karma +3."},{"d":29,"t":"Skladnici Řehoř a Voleg odesli. Řehoř dal Karibrkovi klic na spodni zastrcku."},{"d":29,"t":"PROHLIDKA MAUZOLEA: ukradene osobni veci obeti, tri nevylozene bedny, skryse pod podlahou."},{"d":29,"t":"ZJISTENI (Karibrk, nekromant): hrobova prst neni na nekromancii - je na ZALOZENI hrbitova tam, kde zadny neni. Kult dole vyrabi posvatnou pudu smrti."},{"d":29,"t":"Detske boty = symbolicke pohrby. Jeden par = jedno rezervovane misto v tom novem hrbitove."},{"d":29,"t":"NALEZ: Kámen štěstí, Boty elfí chůze, REGISTR (kniha s cisly a jmeny)."},{"d":29,"t":"Karibrk rozhodl mauzoleum spalit - jako vzkaz. Odmena +150 (ZJISTENI)."},{"d":29,"t":"OPRAVA: Karibrk ma INT 21 (ne 20) - talent Dotčený Fey dal +1 k INT. Modifikator INT zustava +5. Az pribude dalsi +1 (INT 22), modifikator stoupne na +6 - projevi se v SO kouzel a Utoku kouzlem."},{"d":29,"t":"Karibrk se rozhodl predat REGISTR (806 jmen) Elminsterovi vymenou za sdileni vsech jeho poznatku o veci."},{"d":29,"t":"Konec session - druzina miri domu U Tří vran. Elminster ma pri predani registru vysvetlit, proc se kult probudil prave ted - odpoved zatim nepadla, ceka na pristi scenu."},{"d":30,"t":"Navrat U Tří vran po mauzoleu. Vsichni zivi a v poradku - Mer, Ula i Elie v poradku."},{"d":30,"t":"Ula (53/vyhlizi 14) ceka na schodech, ptala se jestli bylo zle. Rekla Karibrkovi \"rada te vidim celyho\"."},{"d":30,"t":"Elie spi klidne s Uhlikem - teplo, bez mrazu/destu/strachu."},{"d":30,"t":"Rano na prahu ceka Elminster s odpovedi, proc se kult probudil prave ted."},{"d":30,"t":"ODHALENI (Elminster): kult se probudil kvuli TREM vecem - palivo (zoufali lide), vzduch (chaos po padu Baldurovy brány pred rokem), jiskra."},{"d":30,"t":"JISKRA = Elie a Ula POD JEDNOU STRECHOU. Kazda zvlast byla jen anomalie, spolu jsou REZONANCE - signal slysitelny daleko pres plan."},{"d":30,"t":"Registr sedi casove presne na den, kdy druzina privedla Ulu domu k Elie. Zadna vina - fyzika, ne volba."},{"d":30,"t":"Elminster zitra rekne, co kult potrebuje pro PRVNI RITUAL. Varoval: netahat Elie a Ulu z domu, perimetr U Tří vran drzi vic, nez tusi."},{"d":30,"t":"Doplneny chybejici featy: Sandor - Sekáč (Slasher, +1 Sila, 20->utok +8, poprava 1k12+6); Tina - Kušista expert (Crossbow Expert); Mer - Léčitel (Healer)."},{"d":30,"t":"Log ze scen u mauzolea a rana s Elminsterem prenesen do Kroniky jako dve nove kapitoly: Mauzoleum vyhasleho rodu Malcherů, Rezonance."},{"d":31,"t":"Karibrk se rozhodl rici cele druzine pravdu o Elminsterove odhaleni a chce jit hledat stribro/druida VSICHNI spolecne, ne sam."},{"d":31,"t":"UKOL: Ritual zadrze potrebuje 1) surove stribro ze severni zily (hlidane necim novym), 2) Karibrkovu krev, 3) bezmesicnou noc za 5 dni."},{"d":31,"t":"Elminster: stribro sezene i druid, pokud ho vezme s umyslem CHRANIT, ne prodat."},{"d":31,"t":"Rozhodnuto: jde CELA druzina + Elie + Ula, jako vylet. Mer ma holky pred sebou/za sebou, Uhlik jde taky. Karibrk, Sandor, Tina cisti cestu."},{"d":31,"t":"Karibrk trva na tom, ze holkam reknou pravdu o nebezpeci - radeji vedomy strach nez nevedomost, ktera muze zabit."},{"d":31,"t":"Pri priblizeni k severni zile Sandor uctil neco neznameho ve vzduchu. Karibrk poslal Mer a holky do bezpeci, sam s Sandorem a Tinou jde cistit cestu k zile."},{"d":31,"t":"STRAZCE ZILY: hlinita bytost bez tvare, vznikla z dluhu, ktery hora dluzila za nekdejsi tezbu bez navraceni. Nechce boj, chce pravdu o umyslu."},{"d":31,"t":"Karibrk zavolal Elie, Ulu a Mer, vysvetlil strazci celou situaci na rovinu a nabidl mu domov U Tří vran vymenou za pomoc se stribrem."},{"d":31,"t":"Ziskano surove stribro ze severni zily (vytezil Sandor, protoze Karibrk nechal krumpac doma naschval). Strazce zily jde s druzinou U Tří vran, zatim bez jmena."},{"d":31,"t":"Cesta zpet - Karibrk vypravel holkam pribeh."},{"d":31,"t":"Strazce zily se nastehoval U Tří vran, vybral si kout u okna. Karibrk ho pozadal o hlidani/blizkost k Elie a Ule (ne strazeni, jen dohled). Strazce souhlasil."},{"d":31,"t":"Strazce zatim nema jmeno - Elie slibila, ze mu ho holky behem par dni daji."},{"d":31,"t":"Karibrk rekl holkam pravidla ke strazci - jit na nej pomalu, nespechat."},{"d":31,"t":"Karibrk poveril Elie postavenim venkovniho pristresku pro Uhlika (stin v lete, misto na vegeteni)."},{"d":31,"t":"Karibrk s Elie mluvil o moznem druidskem nadani - jeji cistota, nevinnost a bezstrachost vuci strazci (prezdivka SUTROSTROM) na to podle nej sedi. Nechal to otevrene jako neco, co ji jednou muze zavolat, az dospeje - bez tlaku, s tim ze je OK to menit."},{"d":31,"t":"Pripitek na uvitanou Šutrostroma - cela druzina + Elie a Ula (symbolicka kapka). Šutrostrom ochutnal prvni pivo v zivote a rovnou si rekl o dalsi."},{"d":31,"t":"Vecer stravem v klidu a teple U Tří vran - Elie usnula u stolu. Ceka bezmesicna noc pro Ritual zadrze."},{"d":31,"t":"DOHODNUTO: od ted bezi soubezne dva systemy - jiskry (za hrani, rozhodnuti, reseni; nikdy za zabijeni) a klasicke 5e XP (za souboje a questy podle CR tabulky). Predchozi blesk/dabel byly z jine session, zpetne se nedopocitavaji."},{"d":31,"t":"Šutrostrom rozpracovan jako plnohodnotna postava - vlastnosti, schopnosti (Zemita odolnost, Splynuti s kamenem, Vaha dluhu, cit pro co lezi v zemi), ne jen mluvici sutr."},{"d":31,"t":"Karta domova (U Tří vran) doplnena: Šutrostrom pripsan mezi obyvatele, zalozen ukol - Elie ma navrhnout a postavit venkovni pristresek pro Uhlika."},{"d":31,"t":"Karibrk a Elie navstivili krám nekromantských potřeb v Dolním městě - odmítnuta formule \"Hlas z prázdna\" (cena: mizející vzpomínky), místo ní naučena formule \"Věrná hlína a kost\" zdarma za slib dodávek a protisluzbu. Koupena lebka na řetízku (55 zl, komponentní pomůcka)."},{"d":31,"t":"Objednáno modřínové dřevo u Ossvina na přístřešek pro Uhlíka (20 zl), přiveze zítra ráno. Elie dostala úkol postavit ho sama s pomocí Sandora a Tiny."},{"d":31,"t":"Klidný rodinný večer U Tří vran - Šutrostrom se sžívá s domácností, poznamenal si Uhlíkovo jméno a zkusil první vtip o vlastním. Zítra přijde Elminster s odpovědí ohledně kultu."},{"d":30,"t":"NOČNÍ STŘET U PERIMETRU (den 29→30): 3 kultisté vyřazeni/zabiti u domu (Roztříštění, jedovatý postřik, mrazivý dotyk), 1 poskok umlácen v lese po výslechu (jméno \"bratr Ilvos\" potvrzeno jako vůdce, zbytek kultu čeká pod městem). Klasické XP +175 (nyní 14175)."},{"d":30,"t":"Kult šel primárně po Rockym (stříbrná nádobka nalezená prázdná - past byla na \"bytost z dluhu\", ne na Elii/Ulu). Rocky zůstal doma dle dohody a ochránil Elii i Ulu schováním, útok se nezdařil."},{"d":30,"t":"Elie poprvé řekla Karibrkovi \"tati\" (+jiskry). Karibrk se rozhodl přejít od čekání k proaktivní eliminaci hrozeb vůči rodině - odpočine si a vyrazí se Sandorem, Tinou a Mer hlavním vchodem do katakomb za bratrem Ilvosem."},{"d":30,"t":"Karma Karibrk -6 (umlácení zajatého poskoka kamenem, vedeno vztekem/ochranným instinktem po ohrožení holek)."},{"d":30,"t":"Ráno: parta probrala možného \"krysu\" v okruhu (podezřelí: Volo, méně pravděpodobně Ossvin, neznámý host z karavanních dnů; zvážena i možnost měňavce). Nové pravidlo: cizí lidé nesmí nahoru, kde spí holky. Plán rozšířit Útočiště o pečlivě vybrané loajální hosty (\"VIP klub\")."},{"d":33,"t":"Tři dny příprav před výpravou. Každý člen party učil Elii a Ulu přežít po svém (Tina - mizení/převleky/útěk, Sandor - čtyři měkká místa + poutní nůž, Mer - znaky Kelemvora/Ilmatera/Tyra jako útočiště, Rocky - vykopaný úkryt pod stájí se vzduchovými rourami)."},{"d":33,"t":"Elie se u večeře poprvé zhroutila jako obyčejná devítiletá holka (ne kvůli nebezpečí, ale kvůli tomu, co má ztratit) a podruhé řekla Karibrkovi \"tati\". Dostala dřevěnou kravičku z mauzolea jako úkol: dožít se toho, aby mu ji mohla vrátit."},{"d":33,"t":"Ula v noci odmítla roli náhradní matky - Karibrk jí řekl \"nestarej se o ni, buď s ní\" a zakázal jí obětovat se. Ula mu řekla, že mu nikdy neřekne tati, ale že to není tím, že by jí nestál za to."},{"d":33,"t":"STOPA (Tina): staré propadlé sklepení pod bývalou koželužnou u západní zdi Vnějšího města - dvakrát za poslední měsíc se tam v noci svítilo. Pravděpodobný druhý vchod do katakomb."},{"d":33,"t":"DEN 33: parta (Karibrk, Sandor, Tina, Mer) prošla branou do Baldurovy brány a míří k západní zdi. Rocky zůstal doma s holkama. Povídka \"Než vyjdeme branou\" zapsána do Kroniky."},{"d":33,"t":"NOVÉ PRAVIDLO (natrvalo): klasické XP i za vyřešení připravené hrozby BEZ boje, srovnatelné s tím, jaký boj by to nahradilo - ne jen za zabíjení. První použití: obrácení devíti rituálních bodů kultu bez jediného souboje. XP +500 (nyní 14675)."},{"d":33,"t":"Rocky opraven po zásahu solí - ne řemeslem, ale hrou s Elii a celou partou (plácání hlíny, vodní bitva na dvoře). Vrátila se mu definice přes to, že mu někdo něco dal, ne přes opravu samotnou."},{"d":33,"t":"SYSTÉM DOKONČEN: (1) závěrečný XP fond za celé dobrodružství - PJ ho stanoví tajně na začátku podle šablony šesti os, vyplácí se na konci podle výsledku; (2) šablona obtížnosti: SMRTELNOST / SPLETITOST / SÁZKA / ORIGINALITA PJ (váha x2) / VYNALÉZAVOST HRÁČE / CENA, každá 1-5 bodů, sedm stupňů od \"Škrábanec\" po \"Zápis do kronik\"; (3) průběžné XP a jiskry běží dál nezávisle. Zpětně se nedopočítává nic - fond platí od Vyhaslé číše dál."},{"d":36,"t":"Cestou domů (den 36) narazil Karibrk náhodou v Soukenické uličce na samozvaného arcimága Mlazivoje Vaelora, veřejně terorizujícího švadlenu a její dvě děti kvůli dluhu 6 zl. Nabídl zaplatit - odmítnuto hrubě, Vaelor si nárokoval rodinu jako majetek."},{"d":36,"t":"Facka projela skrz Zrcadlový obraz. Vaelor zaútočil na zabití. Karibrk ho rozdrtil (Roztříštění + Mrazivý dotyk), v poslední chvíli před smrtící ranou se zastavil kvůli myšlence na Elii - místo zabití ho jen veřejně ponížil před celou ulicí jako \"amatéra\". Rodina zachráněna, dluh zaplacen."},{"d":36,"t":"NOVÝ TRVALÝ NEPŘÍTEL: Mlazivoj Vaelor - zahanbený, netuší Karibrkovo jméno, tichá touha po pomstě. Určen pro budoucí mini-dobrodružství. Karma Karibrk +3 (zásah pro cizí rodinu bez odměny, restraint na poslední chvíli kvůli Elii)."},{"d":36,"t":"OPRAVENO: Karibrkovy triky (Mrazivý dotyk, Jedovatý postřik) chybne davaly 1 kostku - na 6. urovni postavy maji davat 2 (skalovani triku je podle urovne POSTAVY, ne pozice). SPELLS databaze rozsirena o 32 kouzel 2. edice (Bigby, Melf, Otiluke, Mordenkainen, Tenser, Snillock, Rary, Drawmij, Serten, Nystul) napric urovnemi 1-5, celkem nyni 119 kouzel na vyber. Formalizovano pravidlo skalovani: pozicova kouzla podle urovne POZICE, triky podle urovne POSTAVY (2x kostky od 5. urovne, 3x od 11., 4x od 17.)."},{"d":36,"t":"PŘESTAVBA DENÍKU: záložka Postavy přeskládána podle důležitosti (atributy → kouzla od úrovně 0 barevně → výbava a peníze → efekty → verdikt svědomí a bio). Nová záložka LORE (registr entit: místa, frakce, bohové, NPC, předměty, rituály, události, pravidla a všech 119 kouzel). Zaveden společný bágl, osobní i společná pokladna a formulář pro položky. Doplněn protokol pro AI (co je kánon, co se smí přepisovat, v jakém pořadí)."},{"d":36,"t":"DENÍK_CORE_V1.1.1: pořadí záložek Hra → Postava → Domov → Kronika → Úkoly → Lore → Přenos. Tlačítko 💾 Uložit v horní liště i u každé editovatelné sekce. Výrazné nepřekrývající se barvy pro úrovně kouzel 0–9. Výbava, bágl a Lore roztříděné do kategorií se symboly. Legenda znaků nahoře v záložce Hra. Zavedeny znaky psaní: * „ “ ! ? & + − #. Soubor se ukládá jako DENÍK_CORE_VX.X.X, poslední index zvedá PJ automaticky."},{"d":36,"t":"DENÍK_CORE_V1.1.2: pořadí záložek Hra → Postava → Domov → Kronika → Úkoly → Lore → Přenos. Tlačítko 💾 Uložit v horní liště i u každé editovatelné sekce. Výrazné nepřekrývající se barvy pro úrovně kouzel 0–9. Výbava, bágl a Lore roztříděné do kategorií se symboly. Legenda znaků nahoře v záložce Hra. Zavedeny znaky psaní: * „ “ ! ? & + − #. Soubor se ukládá jako DENÍK_CORE_VX.X.X, poslední index zvedá PJ automaticky."},{"d":37,"t":"◆ DOBRODRUŽSTVÍ VYHASLÁ ČÍŠE DOKONČENO. Závěrečný XP fond podle šablony šesti os: SMRTELNOST 4 · SPLETITOST 5 · SÁZKA 5 · ORIGINALITA PJ 4 (x2 = 8) · VYNALÉZAVOST HRÁČE 5 · CENA 4 = 31 bodů → stupeň VII. Zápis do kronik. Vyplaceno v plné výši: +13 000 XP."},{"d":37,"t":"▪ XP 14 675 → 27 675. SEDMÁ ÚROVEŇ pro Karibrka, Tinu, Sandora i Mer. Karibrk: automaticky získal jednu pozici 4. úrovně, 12 připravených kouzel a Arkánové zotavení v součtu 4 úrovní pozic; dvě nová kouzla zdarma do knihy a navýšení maximálních životů zatím hráč NEVYBRAL. Tina: Vyhýbavost, Zleň 4k6, životy 45. Sandor: Pozoruhodný atlet, životy 61. Mer: kouzla 4. úrovně, životy 49."},{"d":37,"t":"⚑ KOŘIST z okované truhlice, kterou Tina vynesla z komory pod koželužnou a tři dny na ni všichni zapomněli. Peníze: 640 zl, 210 st, 80 md, 12 platinových. Drahokamy: 4 onyxy po 50, černá perla 100, jantar 250. Předměty: Rubrikář (Karibrk), Hůlka tajemných střel (Karibrk), pytlík 12 onyxů (Karibrk), Plášť elfího druhu (Tina), Kroužková košile +1 (Sandor), Perla moci (Mer), krabička korálků (Elie), prasklý amulet Železného trůnu (Ula). A Seznam plateb: sedm jmen, z toho tři z Horního města."},{"d":35,"t":"BEZEJMENNÁ: v podkroví nad pekařstvím U Tří klasů stála u okna žena s úplně černýma očima — zbytek Bhaalovy podstaty beze jména a beze schránky, z jeho PRVNÍ smrti. Dala Karibrkovi tři pravdivé odpovědi na tři otázky: (1) není bohyně, existuje z víry, nedá se zabít, dá se rozvěřit; (2) na vrcholu není nikdo, jen HLAD starší než bohové, a nad ním jediný Lord Ao; (3) nejúčinnější zbraň proti jejímu druhu je PŘESNÝ ZÁPIS — skutečná jména místo čísel."},{"d":35,"t":"ČTVRTÁ PRAVDA z vlastní vůle: Elie a Ula přestávají být pro herezi zajímavé. Stáhla ruku — žádná vidění pro Ilvose, žádná síla za jeho slovy, žádné sny o domě. Důvod: Karibrk je první mortal za osmdesát let, kterého nezajímalo, jestli vyhraje, ale jestli přežijí ony. Hrozba vůči Elie a Ule ZRUŠENA NATRVALO."},{"d":35,"t":"Karibrk jí místo čtvrté otázky řekl, že je krásná (odpověď: „řekl bys mi prázdná, a měl bys pravdu — ale bereš to navzdory tomu, co jsem\"), a pak dal do prázdného vzduchu SLOVO, že se pokusí najít způsob, jak ji dostat z prázdného stavu do plnější formy. Mrzí ho, že se nezeptal na jméno místo druhé otázky."},{"d":35,"t":"Ilvos ponechán naživu bez moci a bez cíle. Adresa známá (podkroví nad pekařstvím U Tří klasů, Vnější město u východní brány, krycí jméno Malen Dorrick, obchodník se lnem). Karibrk mu neodpověděl na otázku, co s ním bude, a věnoval mu pětivteřinový pohled místo odpovědi."},{"d":37,"t":"⌁ NOVÝ DLOUHODOBÝ EFEKT u Karibrka: ZAMILOVANOST. Tři výhody (strach, soustředění, mluvení) a tři nevýhody (Vhled a klam kolem ní, odhad rizika u čehokoliv, co by ho k ní přiblížilo, ztráta reakce při zmínce v boji). Nedá se sundat odpočinkem ani kouzlem."},{"d":37,"t":"◈ NOVÁ MECHANIKA: POUTA. Čtyři osy — BLÍZKOST, DŮVĚRA, ZÁVISLOST, CENA. Stav se odvozuje sám: ZÁVISLOST 60+ = toxické (nevýhoda proti okouzlení a sugesci od té osoby), BLÍZKOST − DŮVĚRA > 20 = nakřáplé, DŮVĚRA 10 a míň = zlomené. DŮVĚRA 80+ umí 1x za dobrodružství zlomit účinek, který by jinak zlomit nešel. CENA nikdy neklesá. Založena tři pouta: Černooká, Elie, Ula."},{"d":37,"t":"DENÍK_CORE_V0.1.2: číslování ujasněno — každá pozice 0–100, při 100 přenos do vyšší (V1.4.100 → V1.5.0). Oslovování Karibrka nově podle charakteru, inteligence a vztahu mluvčího, pevné tvary zrušeny. Seznam Nezmiňovat zrušen. Deník se po každé odpovědi publikuje jako karta artefaktu na stejné URL, i beze změny obsahu."},{"d":37,"t":"DENÍK_CORE_V1.2.98: sloučeny dvě rozdvojené větve deníku do jedné. Postavy rozděleny na družinu, zpřátelený soudek a nepřátele (červeně, bokem, bez editace). Mlazivoj Vaelor přesunut mezi nepřátele jako pouhý příběh — zatím nic neovlivňuje, vymyšlený seznam jeho kouzel smazán. Odstraněny mrtvé větve a neexistující odkazy. Přidáno grafické pozadí kroniky."},{"d":37,"t":"DENÍK_CORE_V1.1.6: nový systém CESTY pro Elii a Ulu (sklony 0–10, pět stupňů od Jiskry po Povolání, body za zážitek/učitele/Karibrka/vlastní volbu, vyhasínání, sousedé a protiklady, u Uly vazba na karmu, Imoenovo pravidlo pro změnu cesty). Do databáze kouzel přidán HROBOPIS — 12 Karibrkových vlastních kouzel přetvořenců (1.–7. úroveň), vše nekromancie, v Lore s plnými statistikami. Závažné mechaniky (Šev, Zákon zápisu, Pečeti hrobopisce, zrod povolání) leží bokem v Kodexu Hrobopisce, neaktivní do schválení hráčem. Opraveny drobné kulisy: 12 připravených kouzel, Karibrk 7. úroveň ve Škálování, Kamenná kůže je připravená, Elie 64 slov."},{"d":37,"t":"DENÍK_CORE_V1.1.7: talenty srovnány s realitou — Karibrk Dotčený Fey, Tina Kušista-expert, Sandor Sekáč, Mer Léčitel, každý jeden (sedmá úroveň). Sandorův Mistr velké zbraně a Tinin Ostrostřelec a Merina Odolnost odstraněny jako omyl. Nemrtví poddaní (+6/+5) a Odolná mrtvola zůstávají jako vysloužená domácí pravidla. Zpustošení sjednoceno na 8k8. Sandor Zbroj 17 (kroužková +1)."},{"d":37,"t":"DENÍK_CORE_V1.2.90: (1) Obrázky podle AI_IMAGE_GUIDE — deník sám načítá portréty, společníky, předměty a mapy ze složky denik-media/, a když soubor chybí, nic neukáže a nic se nerozbije. (2) Databáze doplněna o všechna hráčská kouzla Baldur's Gate 3 od triků po 6. úroveň; kouzla čaroděje jsou v nabídce výměny, ostatní v Lore. Opraveny úrovně pěti kouzel podle kánonu. (3) Triky jdou vyměňovat stejně jako připravená kouzla. (4) Hrobopis aktivní: sledování přetvořenců a nemrtvých na Karibrkově kartě (životy, Zbroj, útok, hlídání soustředění), materiál na zkoušku ve výbavě. (5) Kořist z okované truhlice dořešena: společná kasa 854 zl, 216 st, 92 md, 12 pp se znovu propíše i do starého uloženého stavu; Karibrk dostal zbraň — Dýku jedu (+1) s cejchem Železného trůnu."},{"d":37,"t":"DENÍK_CORE_V1.2.91: „Klidodým (brko)“ přejmenováno natrvalo na „Karibrkův kydající brk“ všude v databázi (Lore, schopnosti, výbava, stav postavy) i v příběhovém textu. Deník dostal pevné pozadí — obrázek Karibrka a Elie vložený napřímo do kódu jako podklad celé aplikace, se stejným tmavým překryvem jako dosud kvůli čitelnosti; tlačítko „obraz“ dole ho dál umí vypnout. Opravena a ověřena ruční editace položky výbavy: uložení teď funguje spolehlivě odkudkoli v deníku."},{"d":37,"t":"DENÍK_CORE_V1.2.92: opravena skrytá chyba v ukládání — když prohlížeč odmítl uložit stav (plný localStorage, soukromé prohlížení), deník to sice interně zaznamenal, ale hned poté přepsal varování falešným „Uloženo“ u ruční editace výbavy, peněz, poznámek, výměny kouzel, verdiktů svědomí i tlačítek 💾 Uložit kartu/výbavu/kouzla. Uživatel tak neměl šanci poznat, že se úprava ve skutečnosti neuložila. Teď se úspěšná hláška zobrazí, jen když se uložení opravdu povedlo; jinak zůstane viditelné jen skutečné varování s odkazem na Přenos → Stáhnout deník."},{"d":37,"t":"DENÍK_CORE_V1.2.93: odstraněn banner #hero (kreslená siluetová ilustrace postav), který ležel hned pod pevným pozadím a na každé záložce ho překrýval. Fotka Karibrka a Elie teď zůstává na svém místě nezakrytá, obličeje jsou vidět."},{"d":41,"t":"NOVÉ DOBRODRUŽSTVÍ: U Tří vran dorazila anonymní zásilka adresovaná Karibrkovi, bez odesílatele. Na štítku je znak kruhu a dvou nedotýkajících se čar. Uhlík od ní po očichání couvl; Rocky řekl, že věc uvnitř „nikdy nebyla v zemi“. Balíček je stále neotevřený."},{"d":41,"t":"PARALELNÍ LINKA (hráč ji viděl, Karibrk ne): v Calimportu zmizela třináctiletá koboldka Suri. Její devítiletý bratr Pikk našel doma stejný znak jako na Karibrkově zásilce; krátce nato v domě vypukl požár."},{"d":41,"t":"DENÍK_CORE_V1.2.98: úplný audit identity a návazností. Sloučeny duplicity (Ilvos, kydající brk, log událostí), rozděleni Řehoř/Voleg, opraveny Rockyho a Uhlíkovy zastaralé stavy, výbava Sandora/Tiny, prošlé krátkodobé efekty, Feign Death rituál, Tina 4k6, Sandorův Pozoruhodný atlet a Karibrkův level 7 bez vnucených voleb. Aktivní plot přepsán z dokončené Vyhaslé číše na nespoilerové parametry nového dobrodružství. Den posunut na 41 a zapsána anonymní zásilka i paralelní Calimport."},{"d":41,"t":"DENÍK_CORE_V1.2.98: hráč potvrdil, že 10 lektvarů léčení jsou zvláštní silnější lektvary (3k4+3) a že Sandorova Poprava je obouruční sekera, nikoli meč. Seed i živý stav sjednoceny."},{"d":41,"t":"Anonymní zásilka: Karibrk si všiml Uhlíkova neobvyklého chování, balík metodicky prohlédl z odstupu i zblízka, poslal Elie a Ulu do bezpečné vzdálenosti a zapálil jednu dávku svého kydajícího brka. Běžnou mechanickou past ani únik látky zatím nenašel; balíček zůstává neotevřený."},{"d":41,"t":"ANONYMNÍ RUKA: Karibrk odmítl následovat návnadu. Dědek dostal úkol přečíst cizí nápis a informace z ruky, ale Karibrka nerušit, pokud nejde o věc kosmického významu. Ruka je zabezpečena mimo běžný provoz domu."},{"d":41,"t":"ČERNÁ NIT: Karibrk požádal Dědka o informace k Černooké. Dědek vysvětlil, že není duše, nemrtvá, démon ani avatar; bezpečná cesta k dočasné plnější manifestaci by vyžadovala neživou kotvu, hranici a její svobodný souhlas. První otázka není její jméno, ale zda jméno vůbec chce. Vedlejší romantická linka nikdy mechanicky neřídí hlavní dobrodružství."},{"d":41,"t":"HROBOPISEC AKTIVOVÁN: hráč schválil celý Kodex Hrobopisce. Systém Pečetí běží odteď, bez zpětného dopočtu. První živé použití vlastního rukopisu: Hrobový červ na pozici 4. úrovně. Udělena 1. Pečeť z 12. Spotřebován jeden pytel hrobové prsti ze tří hrobů."},{"d":41,"t":"HROBOPIS — trvalost přetvořenců potvrzena hráčem. Hotové výtvory nemají časový limit ani koncentraci. Vazební limit = bonus zdatnosti (Karibrk nyní 3). Zavedena klidová forma: 1 minuta uspat / 1 minuta probudit bez nové pozice; protiopatření míří na vazební kotvu."},{"d":41,"t":"Karibrk předvedl Hrobového červa rodině na zahradě, vysvětlil holkám, že jde o řemeslný pokrok, a po ukázce jej uložil do klidové formy. Poté vyrazil do Baldurovy brány za Ilvosem kvůli možnosti kontaktovat Černookou; chce být zpět do večera."},{"d":41,"t":"Karibrk dorazil odpoledne za Ilvosem alias Malenem Dorrickem do podkroví nad pekařstvím U tří klasů. Ilvos potvrdil, že Černookou nikdy nedokázal skutečně přivolat; pouze jí nechával „prázdný řádek“, přesný zápis s vědomou absencí, který jí mohl dát možnost všimnout si pozvání. Metoda nic nevynucuje a po odebrání Ilvosových vidění už jemu nefunguje."},{"d":41,"t":"ČERNÁ NIT: v podkroví U tří klasů Karibrk použil Ilvosovu metodu prázdného řádku. Napsal své jméno, ponechal druhý řádek prázdný a jako jedinou pravdivou větu napsal: „Asi jsem na něco přišel, ale žádám tě, aby ses objevila i v případě, že ti to je jedno — pošli mě kdyžtak do prdele, ať neztrácím čas.“ Černooká pozvání přijala z vlastní vůle."},{"d":41,"t":"ČERNÁ NIT: Karibrk Černooké vysvětlil Dědkovu teorii dočasné manifestace a výslovně odmítl jakýkoli dluh či nárok vůči ní. Černooká souhlasila, že chce hledání cesty zkusit, ale jen s právem sama spojení ukončit, bez živého hostitele a s tím, že případné jméno si zvolí sama. Blízkost 35, důvěra 50, závislost 15, cena 10."},{"d":41,"t":"ČERNÁ NIT: Karibrk upřesnil návrh schránky. Nechce cizí živé tělo, ale tělo vytvořené výhradně pro Černookou, schopné plných smyslových prožitků, bez běžného stárnutí a s naprostou svobodou odchodu. Černooká přijala tento směr jako možný, nikoli jako konečný souhlas; konkrétní plán chce vidět před realizací. Jméno zůstává její volbou. Pracovní návrhy DéMonika, Živola a Bhaalónka neuspěly."},{"d":41,"t":"Karibrk se po návštěvě Černooké vrátil večer U Tří vran. Dědek dodržel instrukci k anonymní ruce: překlad uchoval jako pojistku a nevyrušil ho, protože v něm nebylo nic kosmického významu."},{"d":41,"t":"ČERNOOKÁ — Karibrk vysvětlil družině, že kontakt byl úspěšný; shrnul vlastní úvahu, že i božské bytosti mohou navzdory nesmírné moci nést potřeby a neduhy připomínající společenskost smrtelníků. Přiznal také neúspěšné návrhy jmen DéMonika a Bhaalónka."},{"d":41,"t":"ANONYMNÍ RUKA: Karibrk ji okázale ignoruje. Dokud nezačne předávat smysluplné varování nebo nevznikne konkrétní důvod tušit bezprostřední problém, její ťukání a škrábání není pro něj důvod měnit vlastní plán."}],"rolls":["k100 → <b class=\"\">19</b>","k20 (8/10) → <b class=\"\">10</b>","k20 → <b class=\"\">3</b>","k12 → <b class=\"\">8</b>","k10 → <b class=\"\">7</b>"],"chron":[],"pfacts":{"karibrk":[{"src":"Noc útoku","t":"Identifikoval označovací předmět jako přetvořený úlomek zádržného skla — stejná technologie jako v Ostružně."},{"src":"Noc útoku","t":"Zabil svázaného, bezmocného Kessila pomalu a záměrně krutě, už po získání všech potřebných informací — z vlastního hněvu, ne z nutnosti. Přiznal to Ule i sobě."},{"src":"Dřívější tažení","t":"Ukázal půlku medailonu poprvé za čtyřicet let — Tině, Sandorovi a Mer."},{"src":"Dřívější tažení","t":"Podepsal se do rubriky jako ručitel výdeje tří set jedné duše."},{"src":"Mezihra","t":"Naučil Elii číst a psát. První slovo bylo její jméno."},{"src":"Mezihra","t":"V Dagerově brodu se nechal zajmout, aby holky neviděly, jak vypadá Ohnivá koule zevnitř."}],"sandor":[{"src":"Noc útoku","t":"Na Karibrkův příkaz zlomil kosti prchajícímu kultistovi, ale nechal ho naživu."},{"src":"Dřívější tažení","t":"Před Elií přiznal, že tři dny vařil o porci víc pro Ulu."},{"src":"Mezihra","t":"Vynesl obě holky ze skladiště se zavřenýma očima a řekl jim, že to není jejich vina."},{"src":"Mezihra","t":"Koupil Ule kuchařský nůž. První dárek jejího života."}],"ula":[{"src":"Noc útoku","t":"Částečně viděla a celé slyšela Kessilovu popravu z okna. Konfrontovala Karibrka přímo, použila poprvé za dlouho jeho celé jméno."},{"src":"Dřívější tažení","t":"Řekla své jméno místo čísla partie."},{"src":"Mezihra","t":"Poprvé v životě se najedla do syta. Bylo jí z toho špatně a stálo to za to."},{"src":"Mezihra","t":"Naučila se rozbíjet nos loktem správně. Cvičí to každý večer se Sandorem."},{"src":"Mezihra","t":"Má od gnóma Tiaxe listinu, na které stojí PRVNÍ MINISTRYNĚ."}],"tina":[{"src":"Dřívější tažení","t":"Vymyslela přehazovanou s knihou, na které se vyhrál boj v márnici."},{"src":"Mezihra","t":"Naučila Elii řezat měšce a pak sama přiznala, že to bylo blbě."}],"mer":[{"src":"Dřívější tažení","t":"Řekla větu, na které stálo celé řešení: zápis není lež ani pravda, zápis je nárok."},{"src":"Mezihra","t":"Vysvětlila Ule Kelemvora a to, že její účet není její."}],"dedek":[{"src":"Dřívější tažení","t":"Přizna function loreImport(txt){
 txt=String(txt||"").trim(); if(!txt){msg("Nic k načtení.");return;}
 var n=0;
 if(txt.charAt(0)==="["||txt.charAt(0)==="{"){
  var o; try{o=JSON.parse(txt);}catch(err){msg("Tohle není platný JSON.");return;}
  var arr=Array.isArray(o)?o:(o.lore||[]);
  arr.forEach(function(e){ if(!e.name)return;
   if(!e.id)e.id="u-"+String(e.name).toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,28)+"-"+Math.random().toString(36).slice(2,5);
   e.src=e.src||"hráč"; e.alias=e.alias||[]; e.tags=e.tags||[]; e.mech=e.mech||{};
   var dup=false; allLore().forEach(function(x){if(x.id===e.id)dup=true;});
   if(!dup){S.lore.push(e);n++;}});
 } else {
  var cur=null;
  txt.replace(/\r/g,"").split("\n").forEach(function(ln){
   var mh=ln.match(/^##\s*(.+)$/);
   if(mh){ if(cur){S.lore.push(cur);n++;}
    var parts=mh[1].split("|").map(function(x){return x.trim();});
    cur={id:"u-"+parts[0].toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,28)+"-"+Math.random().toString(36).slice(2,5),
      name:parts[0],type:"predmet",alias:[],tags:[],src:"hráč",short:"",body:"",mech:{},lvl:null};
    parts.slice(1).forEach(function(p){
     var lp=p.toLowerCase();
     if(lp.indexOf("alias")===0) cur.alias=p.split(":")[1].split(",").map(function(x){return x.trim();});
     else if(lp.indexOf("tag")===0||lp.indexOf("štítk")===0) cur.tags=p.split(":")[1].split(",").map(function(x){return x.trim();});
     else if(lp.indexOf("úroveň")===0||lp.indexOf("uroven")===0) cur.lvl=parseInt(p.split(":")[1],10);
     else { var ok=false; LTYPES.forEach(function(t){if(t[0]===lp||t[1]===lp){cur.type=t[0];ok=true;}});
            if(!ok&&p)cur.tags.push(p); }
    });
    return;}
   if(cur){ if(!cur.short&&ln.trim()) cur.short=ln.trim();
            else if(ln.trim()) cur.body+=(cur.body?"\n":"")+ln.trim(); }
  });
  if(cur){S.lore.push(cur);n++;}
 }
 save(); drawLore();
 var col=loreAudit(true);
 msg("Načteno "+n+" záznamů."+(col.length?" KOLIZE: "+col.length+" — viz Zkontrolovat kolize.":""));
}
function loreAudit(quiet){

 A.forEach(function(e){ var k=String(e.name).toLowerCase();
  if(byName[k]&&byName[k].id!==e.id) col.push('Dvě různé věci se jmenují stejně: "'+e.name+'" ('+byName[k].type+' vs '+e.type+')');
  byName[k]=e;
  (e.alias||[]).forEach(function(a){ var ak=String(a).toLowerCase();
   if(byName[ak]&&byName[ak].id!==e.id&&byName[ak].name.toLowerCase()!==ak)
    col.push('Alias "'+a+'" u záznamu '+e.name+' se tluče s '+byName[ak].name); });});
 SPELLS.forEach(function(sp){ var e=byName[String(sp[1]).toLowerCase()];
  if(e&&e.type==="kouzlo"&&e.lvl!==null&&e.lvl!==sp[0])
   col.push('Kouzlo "'+sp[1]+'" má v Lore úroveň '+e.lvl+', v databázi kouzel '+sp[0]);});
 ORDER.concat(["pes"]).forEach(function(cid){ var c=CHARS[cid]; if(!c)return;
  var e=byName[String(c.name).toLowerCase()];
  if(e&&e.type!=="postava") col.push('"'+c.name+'" je postava v družině, ale v Lore je vedená jako '+e.type);});
 if(!quiet){
  show(col.length?("KOLIZE ("+col.length+"):\n\n"+col.join("\n")):"Žádné kolize. Jména, aliasy, úrovně kouzel a postavy sedí.","Kontrola kolizí");
 }
 return col;
}

function allChron(){return CHRON.concat(S.chron||[]);}
function drawK(){
 var A=allChron();
 var h='<div class="row" style="margin-bottom:10px">'+
  '<input type="text" id="qK" placeholder="Hledat v kronice…"><button class="sm" data-a="find">Najít</button>'+
  '<button class="go sm" data-a="newchap">+ zapsat kapitolu</button></div>';
 h+='<div class="tocgrid">';
 for(var i=0;i<A.length;i++) h+='<button class="'+(i===S.sec?"on":"")+'" data-a="sec" data-v="'+i+'">'+esc(A[i].title)+'</button>';
 h+='</div><div id="kRead"></div>'+
  '<div class="row" style="margin-top:16px"><button data-a="secmv" data-v="-1">← předchozí</button>'+
  '<button data-a="secmv" data-v="1">další →</button>'+
  (S.sec>=CHRON.length?'<button class="sm" data-a="chapdel" data-v="'+(S.sec-CHRON.length)+'">smazat tuhle kapitolu</button>':'')+'</div>';
 $("#cKron").innerHTML=h;

}
function renderSec(q){
 var A=allChron(), s=A[S.sec];
 if(!s){$("#kRead").innerHTML="";return;}
 var r='<h2 style="margin-bottom:12px">'+esc(s.title)+'</h2>';
 s.blocks.forEach(function(b){
  if(b.k==="hr"){r+='<div class="blk hr"></div>';return;}
  var t=b.t;
  if(q){var re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"); t=t.replace(re,"<mark>$1</mark>");}
  r+='<div class="blk '+esc(b.k)+'"><p>'+t+'</p></div>';});
 $("#kRead").innerHTML=r;
}
function findK(){
 var q=($("#qK").value||"").trim(); if(!q){renderSec();return;}
 var A=allChron(), lo=q.toLowerCase(), hits=[];
 A.forEach(function(s,i){ var n=0;
  s.blocks.forEach(function(b){ if(strip(b.t).toLowerCase().indexOf(lo)>=0)n++; });
  if(n)hits.push([i,n,s.title]); });
 if(!hits.length){renderSec();msg('Nenalezeno: "'+q+'"');return;}
 S.sec=hits[0][0]; save(); drawK();
 var el=$("#qK"); if(el)el.value=q;
 renderSec(q);
 msg("Nalezeno v "+hits.length+" kapitolách. První: "+hits[0][2]);
}

function chapSave(){
 var T=($("#fT").value||"").trim();
 if(!T){msg("Kapitola potřebuje název.");return;}
 var story=$("#fS").value||"";
 var blocks=[];
 story.split(/\n\s*\n/).forEach(function(p){p=p.trim(); if(p)blocks.push({k:"p",t:esc(p).replace(/\n/g," ")});});
 if(!blocks.length)blocks.push({k:"p",t:"(bez textu)"});
 S.chron.push({title:T,blocks:blocks});

 ($("#fF").value||"").split("\n").forEach(function(ln){
  var m=ln.match(/^\s*([a-z]+)\s*:\s*(.+)$/i); if(!m)return;
  var id=m[1].toLowerCase(); if(!CHARS[id])return;
  if(!S.pfacts[id])S.pfacts[id]=[];
  S.pfacts[id].push({t:m[2].trim(),src:T});});

 ($("#fE").value||"").split("\n").forEach(function(ln){
  var p=ln.split("|"); if(p.length<3)return;
  var id=p[0].trim().toLowerCase(); if(!CHARS[id])return;
  var kd=p[1].trim().toLowerCase();
  var key=kd.indexOf("dlouh")===0?"dlouhodoby":(kd.indexOf("kr")===0?"kratkodoby":"chovani");
  if(!S.effects[id])S.effects[id]=[];
  S.effects[id].push({n:p[2].trim(),k:key,t:(p[3]||"").trim(),src:T,day:S.day});});

 ($("#fI").value||"").split("\n").forEach(function(ln){
  var m=ln.match(/^\s*([a-z]+)\s*:\s*(.+)$/i); if(!m)return;
  var id=m[1].toLowerCase(); if(!CHARS[id])return;
  if(!S.inventory[id])S.inventory[id]=[];
  S.inventory[id].push({item:m[2].trim(),src:T,day:S.day});});

 var el=($("#fEl").value||"").trim(), w=parseInt($("#fW").value,10)||0, mi=($("#fM").value||"").trim();
 if(el||w||mi){S.elie.log.push({t:el||mi,mile:mi,words:w,src:T,day:S.day}); S.elie.words+=w;}

 var first=story.trim().split(/\n/)[0]||T;
 var era="Kronika: "+T, f=null;
 S.grouplog.forEach(function(g){if(g.era===era)f=g;});
 if(!f){f={era:era,items:[]};S.grouplog.push(f);}
 f.items.push({w:"skupina",t:first.slice(0,400)});

 S.sec=allChron().length-1;
 save(); drawAll(); msg("Zapsáno: "+T);
}

  o.push("  [Nasledujici uroven] "+c.next.map(strip).join(" "));
  o.push("");});

 GROUP.concat(S.grouplog||[]).forEach(function(g){o.push("== "+g.era+" ==");

   " st "+(PP.common?PP.common.st:0)+" md "+(PP.common?PP.common.md:0));
 for(var pid in (PP.ids||{})){var pv=PP.ids[pid];
   o.push("kasa "+pid+" | pp "+pv.pp+" zl "+pv.zl+" st "+pv.st+" md "+pv.md);}
 o.push("\n### 17. POUTA\n");
 var BB=bonds(); for(var bk in BB){ var bb=BB[bk], bm=bb.m||{}, bs=bstate(bm);
  o.push(bb.name+" ["+bs[1]+"] blizkost "+(bm.bliz||0)+" duvera "+(bm.duv||0)+" zavislost "+(bm.zav||0)+" cena "+(bm.cena||0));
  (bb.log||[]).forEach(function(x){o.push("   den "+(x.d||"?")+" | "+strip(x.t||"")+(x.mile?" || MEZNIK: "+strip(x.mile):""));});}
 o.push("\n### 18. CURRENT HANDOFF - PRESNY BOD POKRACOVANI\n");

 o.push("\n### 19. CANONICAL_STATE_JSON - ZDROJ PRAVDY PRO BEZZTRATOVY IMPORT\n");

 o.push("<<<END_STATE_JSON>>>");

 return o.join("\n");
}

/* ===================== IMPORT ===================== */
function snapshotFromTransfer(txt){
 var m=String(txt||"").match(/<<<STATE_JSON>>>\s*([\s\S]*?)\s*<<<END_STATE_JSON>>>/);
 return m?m[1].trim():"";
}
function looksLikeFullState(o){
 return isObj(o)&&(o.campaignId!==undefined||o.schemaVersion!==undefined||o.revision!==undefined||
   (o.ver!==undefined&&o.events!==undefined&&o.inventory!==undefined&&o.tasks!==undefined));
}
function importAny(txt){
 txt=String(txt||"").trim();
 if(!txt){msg("Nic k načtení.");return;}
 var cs=snapshotFromTransfer(txt); if(cs)return importSnapshotJSON(cs,"plný přenos");
 if(txt.charAt(0)==="{")return importJSON(txt);
 return importDump(txt);
}
function importSnapshotObject(o,source,ask){
 if(!isObj(o)){msg("Snapshot nemá platný objekt stavu.");return;}
 if(ask!==false&&!confirm("Tohle je kompletní snapshot. Nahradit jím CELÝ aktuální stav? Současný stav se nejdřív uloží jako lokální záloha."))return;
 try{backupLocal(JSON.stringify(S),"preimport");}catch(e){}
 var prevRev=revOf(S), incoming=normalizeState(o);
 if(incoming.campaignId&&incoming.campaignId!==CAMPAIGN_ID){
  if(!confirm("Snapshot patří kampani '"+incoming.campaignId+"', zatímco tento deník je '"+CAMPAIGN_ID+"'. Opravdu pokračovat?"))return;
 }
 incoming.campaignId=CAMPAIGN_ID; incoming.schemaVersion=SCHEMA_VERSION; incoming.build=BUILD;
 incoming.revision=Math.max(revOf(incoming),prevRev)+1; incoming.stateSavedAt=nowIso();
 S=incoming; postInit(); persistState(false); drawAll();
 msg("Snapshot načten bezeztrátově z "+(source||"JSON")+". Celý předchozí stav je v lokální záloze.");
}
function importSnapshotJSON(txt,source,ask){
 var o; try{o=JSON.parse(txt);}catch(e){msg("Snapshot obsahuje neplatný JSON.");return;}
 importSnapshotObject(o,source,ask);
}
function importJSON(txt){
 var o; try{o=JSON.parse(txt);}catch(e){msg("Tohle není platný JSON.");return;}
 if(looksLikeFullState(o))return importSnapshotObject(o,"JSON",true);
 return importJSONPatchObject(o);
}
/* Staré neúplné JSONy se nadále umějí bezpečně sloučit jako patch. */
function importJSONPatchObject(o){
 var n=0;
 ["day","sparks","xp","sum"].forEach(function(k){if(o[k]!==undefined&&o[k]!==S[k]){S[k]=o[k];n++;}});
 if(o.events)o.events.forEach(function(e){var dup=false;
  S.events.forEach(function(x){if(x.t===e.t)dup=true;});
  if(!dup){S.events.push(e);n++;}});
 if(o.chron)o.chron.forEach(function(c){var dup=false;
  allChron().forEach(function(x){if(x.title===c.title)dup=true;});
  if(!dup){S.chron.push(c);n++;}});
 ["pfacts","effects","inventory"].forEach(function(K){ if(!o[K])return;
  for(var id in o[K]){ if(!S[K][id])S[K][id]=[];
   o[K][id].forEach(function(it){var key=it.t||it.n||it.item, dup=false;
    S[K][id].forEach(function(x){if((x.t||x.n||x.item)===key)dup=true;});
    if(!dup){S[K][id].push(it);n++;}});}});
 if(o.karma)for(var id in o.karma){S.karma[id]=o.karma[id];}
 if(o.verdict)for(var vid in o.verdict){ if(!S.verdict[vid])S.verdict[vid]=[];
  o.verdict[vid].forEach(function(x){var dup=false;
   verdicts(vid).forEach(function(y){if(String(y.t)===String(x.t))dup=true;});
   if(!dup){S.verdict[vid].push(x);n++;}});}
 if(o.lore)o.lore.forEach(function(e){var dup=false;
  allLore().forEach(function(x){if(x.id===e.id||String(x.name)===String(e.name))dup=true;});
  if(!dup){S.lore.push(e);n++;}});
 if(o.bag)o.bag.forEach(function(it){var dup=false;
  (S.bag||[]).forEach(function(x){if(x.item===it.item)dup=true;});
  if(!dup){S.bag.push(it);n++;}});
 if(o.purse)S.purse=deepClone(o.purse);
 if(o.bonds)for(var bid in o.bonds){ if(!S.bonds[bid])S.bonds[bid]={};
  if(o.bonds[bid].m)S.bonds[bid].m=deepClone(o.bonds[bid].m);
  if(o.bonds[bid].log){ if(!S.bonds[bid].log)S.bonds[bid].log=[];
   o.bonds[bid].log.forEach(function(x){var dup=false;
    (bonds()[bid]&&bonds()[bid].log||[]).forEach(function(y){if(String(y.t)===String(x.t))dup=true;});
    if(!dup){S.bonds[bid].log.push(x);n++;}});}
  S.bonds[bid].who=(bonds()[bid]||{}).who; S.bonds[bid].name=(bonds()[bid]||{}).name;}
 if(o.home)S.home=deepClone(o.home);
 if(o.tasks)S.tasks=deepClone(o.tasks);
 if(o.handoff)S.handoff=deepClone(o.handoff);
 if(o.levelup)S.levelup=deepClone(o.levelup);
 if(o.resources)S.resources=deepClone(o.resources);
 if(o.cond)S.cond=deepClone(o.cond);
 if(o.swap)S.swap=deepClone(o.swap);
 if(o.grouplog)S.grouplog=deepClone(o.grouplog);
 if(o.minions)S.minions=deepClone(o.minions);
 if(o.loreDel)S.loreDel=deepClone(o.loreDel);
 if(o.quiet)S.quiet=deepClone(o.quiet);
 if(o.elie&&o.elie.log){o.elie.log.forEach(function(x){var dup=false;
  S.elie.log.forEach(function(y){if(String(y.t)===String(x.t))dup=true;});
  if(!dup){S.elie.log.push(x);n++;}});
  S.elie.words=Math.max(S.elie.words,o.elie.words||0);}
 save(); drawAll(); msg("Legacy patch: načteno "+n+" nových položek.");
}
function importDump(txt){
 var lines=txt.replace(/\r/g,"").split("\n");
 var mode="", era="", ctitle="", cbuf=[], inSum=false, sumBuf=[], n=0;
 var known={}; allChron().forEach(function(c){known[String(c.title).trim()]=1;});
 var haveEv={}; S.events.forEach(function(e){haveEv[String(e.t).trim()]=1;});
 var haveG={}; GROUP.concat(S.grouplog).forEach(function(g){g.items.forEach(function(i){haveG[String(i.t).trim()]=1;});});
 function flushChron(){
  if(!ctitle){cbuf=[];return;}
  if(known[ctitle.trim()]){ctitle="";cbuf=[];return;}
  known[ctitle.trim()]=1;
  var blocks=[];
  cbuf.join("\n").split(/\n\s*\n/).forEach(function(p){p=p.trim();
   if(p==="---"){blocks.push({k:"hr"});return;}
   if(p)blocks.push({k:"p",t:esc(p).replace(/\n/g," ")});});
  if(blocks.length){S.chron.push({title:ctitle,blocks:blocks}); n++;}
  ctitle=""; cbuf=[];
 }
 for(var i=0;i<lines.length;i++){
  var ln=lines[i], t=ln.trim();
  var mh=t.match(/^###\s*(\d+)\./);
  if(mh){ if(mode==="chron")flushChron();
   var num=+mh[1];
   mode = num===3?"grp": num===4?"tasks": num===5?"chron": num===6?"log": num===7?"state":
          num===8?"eff": num===9?"elie": num===10?"karma": num===11?"inv": num===12?"home": num===13?"plot":"";
   era=""; continue;}
  if(/^###\s/.test(t)){ if(mode==="chron")flushChron(); mode=""; continue;}
  if(mode!=="chron"&&(/^={4,}/.test(t)||/^=== KONEC/.test(t)))continue;

  if(mode==="grp"){
   var me=t.match(/^==\s*(.+?)\s*==$/); if(me){era=me[1];continue;}
   var mi=t.match(/^\[(.+?)\]\s*(.+)$/);
   if(mi){var body=mi[2].trim(); if(!haveG[body]){haveG[body]=1;
    var f=null; S.grouplog.forEach(function(g){if(g.era===era)f=g;});
    if(!f){f={era:era||"Převzato",items:[]};S.grouplog.push(f);}
    f.items.push({w:mi[1],t:body}); n++;}}
   continue;}
  if(mode==="chron"){
   var mc=t.match(/^=====\s*(.+?)\s*=====$/);
   if(mc){flushChron(); ctitle=mc[1]; cbuf=[]; continue;}
   if(ctitle)cbuf.push(ln);
   continue;}
  if(mode==="log"){
   if(/^\[Shrnuti deje\]/.test(t)){inSum=true;sumBuf=[];continue;}
   if(inSum){ if(/^\[den/.test(t)||/^###/.test(t)||/^={4,}/.test(t)){inSum=false;
     var sm=sumBuf.join("\n").replace(/\n{3,}/g,"\n\n").trim();
     if(sm&&S.sum.indexOf(sm)<0){S.sum=(S.sum?S.sum+"\n\n":"")+sm; n++;}
     } else {sumBuf.push(ln); continue;} }
   var ml=t.match(/^\[den\s*(\d+|\?)\]\s*(.+)$/);
   if(ml){var b=ml[2].trim(); if(!haveEv[b]){haveEv[b]=1;
    S.events.push({d:parseInt(ml[1],10)||S.day,t:b}); n++;}}
   continue;}
  if(mode==="state"){
   var ms=t.match(/Jiskry:\s*(\d+)/); if(ms){S.sparks=+ms[1];}
   var md2=t.match(/Den:\s*(\d+)/); if(md2){S.day=+md2[1];}
   continue;}
  if(mode==="karma"){
   var pk=t.split("|"); if(pk.length<2)continue;
   var kid=pk[0].trim(); if(!CHARS[kid])continue;
   S.karma[kid]=parseInt(pk[1].trim(),10)||0; continue;}
  if(mode==="eff"){
   var pe=t.split("|"); if(pe.length<3)continue;
   var eid=pe[0].trim(); if(!CHARS[eid])continue;
   if(!S.effects[eid])S.effects[eid]=[];
   var nm=pe[2].trim(), dup=false;
   S.effects[eid].forEach(function(x){if(x.n===nm)dup=true;});
   if(dup)continue;
   S.effects[eid].push({n:nm,k:pe[1].trim(),t:(pe[3]||"").trim(),src:(pe[4]||"převzato").trim(),
    day:parseInt((pe[5]||"").replace(/\D/g,""),10)||S.day}); n++; continue;}
  if(mode==="inv"){
   var pi=t.split("|"); if(pi.length<2)continue;
   var iid=pi[0].trim(); if(!CHARS[iid])continue;
   var itn=pi[1].trim(); if(!itn)continue;
   if(!S.inventory[iid])S.inventory[iid]=[];
   var idup=false; S.inventory[iid].forEach(function(x){if(x.item===itn)idup=true;});
   if(!idup){S.inventory[iid].push({item:itn,src:(pi[2]||"převzato").trim(),
     day:parseInt((pi[3]||"").replace(/\D/g,""),10)||S.day}); n++;}
   continue;}
  if(mode==="elie"){
   var mw=t.match(/^Slova navic celkem:\s*(\d+)/); if(mw){S.elie.words=Math.max(S.elie.words,+mw[1]);continue;}
   var mel=t.match(/^\[(.*?)\]\s*slova:(\d+)\s*\|\s*meznik:(.*?)\s*\|\s*(.+)$/);
   if(mel){var eb=mel[4].trim(), ex=false;
    S.elie.log.forEach(function(x){if(String(x.t).trim()===eb)ex=true;});
    if(!ex){S.elie.log.push({src:mel[1],words:+mel[2],mile:(mel[3]==="-"?"":mel[3]),t:eb,day:S.day}); n++;}}
   continue;}
  if(mode==="tasks"){
   var mt=t.match(/^-\s*(.+)$/); if(!mt)continue;
   var tk=mt[1].trim(), list=null;
   for(var j=i;j>=0;j--){var pt=lines[j].trim();
    if(/^Otevrene:/i.test(pt)){list="open";break;} if(/^Hotovo:/i.test(pt)){list="done";break;}}
   if(!list)continue;
   if(S.tasks[list].map(strip).indexOf(tk)<0){S.tasks[list].push(tk); n++;}
   continue;}
  if(mode==="plot"){
   if(t&&t!=="(nevyplneno)"){ if(S.plot.indexOf(t)<0) S.plot=(S.plot?S.plot+"\n":"")+ln; n++; }
   continue;}
  if(mode==="home"){
   var ph=t.split("|");
   if(ph.length>=2&&ph[0].trim()==="udalost"){
    var ht=ph[1].trim(), hd=false;
    if(!S.home.log)S.home.log=[];
    S.home.log.forEach(function(x){if(String(x.t).trim()===ht)hd=true;});
    if(!hd){S.home.log.push({t:ht,src:(ph[2]||"převzato").trim(),
      day:parseInt((ph[3]||"").replace(/\D/g,""),10)||S.day}); n++;}}
   continue;}
  /* fakta mohou být kdekoli v sekci 2 */
  var mf=t.match(/^\[Fakta\]\s*([a-z]+)\s*\|\s*(.*?)\s*\|\s*(.+)$/i);
  if(mf&&CHARS[mf[1].toLowerCase()]){
   var fid=mf[1].toLowerCase(); if(!S.pfacts[fid])S.pfacts[fid]=[];
   var ft=mf[3].trim(), fdup=false;

 }
 if(mode==="chron")flushChron();
 if(inSum){var sm2=sumBuf.join("\n").replace(/\n{3,}/g,"\n\n").trim();

 save(); drawAll();

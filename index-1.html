<!DOCTYPE html>
<html lang="cs" data-theme="dark" style="color-scheme: dark;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENÍK_CORE_V1.2.110</title>
<!-- PRO AI: blok s id=STATE je ZIVY STAV a plati jako pravda; blok s id=DATA jsou seedy a prameny.
     Poradi kanonu: hracovy repliky > CHRON > events > LORE(hrac/hra) > LORE(kanon) > LORE(PJ) > sum.
     Cely protokol vrati funkce protokol() nebo tlacitko "Protokol pro AI" v zalozce Hra. -->
<style>
:root{--ink:#080B0F;--slate:#10151C;--slate2:#161D26;--frost:#DEE7EA;--fm:#B3C0C6;
--fd:#7C8B93;--glass:#63AFA4;--glassd:#3C6E68;--furn:#E0872C;--furnd:#8E5518;
--blood:#C85A52;--line:#232E39;--serif:"Palatino Linotype",Palatino,Georgia,serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--frost);font-family:var(--serif);-webkit-text-size-adjust:100%;padding-bottom:60px}
.wrap{max-width:860px;margin:0 auto;padding:0 12px}
header{border-bottom:1px solid var(--line);background:var(--slate);padding:9px 0}
header h1{font-size:18px;letter-spacing:.05em}
header p{font-size:11px;color:var(--fd);font-family:var(--mono);margin-top:2px}
button,select,input,textarea{font-family:var(--serif);font-size:14px;color:var(--fm);
background:var(--slate2);border:1px solid var(--line);border-radius:2px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--glassd);color:var(--frost)}
button.on{border-color:var(--glass);color:var(--frost);background:#17262A}
button.go{border-color:var(--furnd);color:var(--furn)}
button.sm{font-size:12.5px;padding:5px 9px}
button.x{padding:2px 7px;font-size:11px;color:var(--fd)}
.chip{font-family:var(--mono);font-size:11px;color:var(--fd);border:1px solid var(--line);
border-radius:2px;padding:4px 8px;display:inline-block}
nav{border-bottom:1px solid var(--line);background:var(--slate);position:sticky;top:0;z-index:9}
nav .wrap{display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 13px;
white-space:nowrap;color:var(--fd)}
nav button.on{color:var(--frost);border-bottom-color:var(--furn)}
#dice{position:sticky;top:41px;z-index:8;background:var(--slate2);border-bottom:1px solid var(--line);padding:7px 0}
#dice .wrap{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
#dice button{padding:5px 9px;font-family:var(--mono);font-size:12.5px}
#dmod{width:52px;padding:5px 6px;text-align:center;font-family:var(--mono);flex:none}
#dlog{font-family:var(--mono);font-size:11px;color:var(--fd);flex:1 1 100%;
white-space:nowrap;overflow-x:auto;padding-top:3px}
#dlog b{color:var(--furn)}#dlog .crit{color:var(--glass)}#dlog .fail{color:var(--blood)}
section.screen{display:none;padding-top:14px}section.screen.on{display:block}
.who{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.box{border:1px solid var(--line);border-radius:2px;background:var(--slate2);padding:11px;margin-bottom:12px}
.box.hi{border-color:var(--glassd)}
h3.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
color:var(--fd);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
h2{font-size:20px}.role{font-family:var(--mono);font-size:11.5px;color:var(--glass);margin:3px 0 12px}
p{font-size:14.5px;line-height:1.7;color:var(--fm);margin-bottom:10px}
p strong,li strong{color:var(--frost)}p em{color:var(--glass);font-style:italic}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.stat{border:1px solid var(--line);border-radius:2px;padding:7px 9px;background:var(--slate)}
.stat i{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
color:var(--fd);font-style:normal;margin-bottom:2px}
.stat b{font-family:var(--mono);font-size:16px;color:var(--frost)}
.pline{display:flex;justify-content:space-between;gap:9px;font-size:13.5px;padding:5px 0;
border-bottom:1px solid #1B242D;color:var(--fm)}
.pline b{color:var(--frost)}.pline span{font-family:var(--mono);font-size:11px;color:var(--fd);text-align:right}
details.opt{border:1px solid var(--line);border-radius:2px;margin-bottom:5px;background:var(--slate2)}
details.opt summary{cursor:pointer;padding:9px 11px;font-size:14px;color:var(--frost)}
details.opt .tag{font-family:var(--mono);font-size:9.5px;color:var(--fd);border:1px solid var(--line);
border-radius:2px;padding:1px 5px;margin-left:6px}
.tag.prep{color:var(--glass);border-color:var(--glassd)}
details.opt .gist{display:block;font-size:12px;color:var(--fd);margin-top:3px}
details.opt .det{padding:0 11px 11px;border-top:1px solid var(--line)}
details.opt .det p{font-size:13.5px;margin-top:9px}
.blk{margin-bottom:13px}.blk p{font-size:15.5px;line-height:1.8}
.blk.h1 p{font-size:22px;color:var(--frost)}
.blk.h2 p{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--furn);margin-top:20px}
.blk.hr{border-top:1px solid var(--line);margin:18px 0}
.blk.q p{border-left:2px solid var(--glassd);padding-left:12px;font-style:italic;color:var(--frost)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row+.row{margin-top:7px}
textarea{width:100%;min-height:80px;background:var(--ink);color:var(--frost);padding:9px;line-height:1.6;margin:6px 0;cursor:text}
input[type=text]{background:var(--ink);flex:1 1 150px;min-width:0;cursor:text}
#msg{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#17262A;border-top:1px solid var(--glassd);
color:var(--glass);font-size:13px;padding:9px 14px;text-align:center;display:none}
.hint{font-size:11.5px;color:#5D6970;font-style:italic}
ul{margin:0 0 10px 18px}li{font-size:14.5px;line-height:1.65;color:var(--fm);margin-bottom:4px}
.done{color:#4E5A63;text-decoration:line-through}
mark{background:rgba(224,135,44,.32);color:var(--frost)}
#ovl{position:fixed;inset:0;background:rgba(4,6,9,.94);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
#ovl .ovbox{max-width:800px;width:100%;background:var(--slate);border:1px solid var(--line);border-radius:3px;padding:14px}
.gitem{border-left:2px solid var(--line);padding:6px 0 6px 11px;margin-bottom:9px}
.gitem b{color:var(--frost);font-size:13.5px}
.gitem .gt{font-size:13.5px;line-height:1.65;color:var(--fm)}
.gitem .gw{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--glass);display:block;margin-bottom:2px}
.eff{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #1B242D}
.eff .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
border:1px solid var(--line);border-radius:2px;padding:2px 6px;white-space:nowrap;margin-top:2px}
.eff .k.dlouhodoby{color:#C85A52;border-color:#C85A5266}
.eff .k.kratkodoby{color:#E0872C;border-color:#E0872C66}
.eff .k.chovani{color:#63AFA4;border-color:#63AFA466}
.eff .b{flex:1}.eff .b b{color:var(--frost);font-size:13.5px}
.eff .b span{display:block;font-size:13px;color:var(--fm);line-height:1.6}
.karma{position:relative;height:8px;background:#1B242D;border-radius:4px;overflow:hidden;margin:8px 0 3px}
.karma i{display:block;height:100%}
.krow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
letter-spacing:.1em;text-transform:uppercase;color:#4E5A63}
.bar{height:6px;background:#1B242D;border-radius:3px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3C6E68,#63AFA4)}
.mile{border-left:2px solid var(--glassd);padding:5px 0 5px 11px;margin-bottom:8px}
.mile .d{font-family:var(--mono);font-size:9.5px;color:var(--fd);display:block}
.ev{border-left:2px solid var(--furnd);padding:6px 0 6px 11px;margin-bottom:7px;display:flex;gap:8px;align-items:flex-start}
.ev .b{flex:1}
.ev .d{font-family:var(--mono);font-size:9.5px;color:var(--fd);display:block;margin-bottom:2px}
.ev .t{font-size:14px;line-height:1.6;color:var(--fm)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:12px}
.big button{padding:13px 11px;text-align:left;line-height:1.35}
.big button b{display:block;color:var(--frost);font-size:14px}
.big button span{display:block;font-size:11.5px;color:var(--fd);margin-top:2px}
.warn{border:1px solid var(--blood);background:#1C1214;color:#E5A9A4;padding:9px 11px;border-radius:2px;
font-size:13px;margin-bottom:12px;line-height:1.55}
.tocgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px;margin-bottom:14px}
.tocgrid button{text-align:left;font-size:13px;padding:8px 10px}
.swapbox{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:2px;margin:4px 0 10px;background:var(--ink)}
.swapbox .pk{padding:9px 11px;border-bottom:1px solid #1B242D;cursor:pointer;border-left:3px solid transparent}
.swapbox .pk:hover{background:var(--slate2)}
.swapbox .pk b{display:block;color:var(--frost);font-size:13.5px}
.swapbox .pk .d{display:block;font-size:12px;color:var(--fd);margin-top:2px}
.swapbox .pk.nec{border-left-color:#8C7AC8;background:#160F1A}
.swapbox .pk.sel{border-left-color:var(--glass);background:#17262A}
.tag.nec{color:#8C7AC8;border-color:#8C7AC855;font-family:var(--mono);font-size:9px;
border:1px solid;border-radius:2px;padding:1px 5px;margin-left:6px}
.tag.swapd{color:var(--furn);border-color:var(--furnd);font-family:var(--mono);font-size:9px;
border:1px solid;border-radius:2px;padding:1px 5px;margin-left:6px;font-weight:normal}
button.x.on{border-color:var(--glass);color:var(--frost)}

/* ---- v3: uroven kouzel, verdikt, ascii panely, lore ---- */
.lvbadge{font-family:var(--mono);font-size:9px;letter-spacing:.06em;border:1px solid;border-radius:2px;
padding:1px 5px;margin-right:6px;display:inline-block;min-width:26px;text-align:center}
.lv0{color:#9FB0BA;border-color:#9FB0BA;background:#9FB0BA1A}
.lv1{color:#35D0C0;border-color:#35D0C0;background:#35D0C01A}
.lv2{color:#7BD938;border-color:#7BD938;background:#7BD9381A}
.lv3{color:#E8D021;border-color:#E8D021;background:#E8D0211A}
.lv4{color:#F59218;border-color:#F59218;background:#F592181A}
.lv5{color:#E8453C;border-color:#E8453C;background:#E8453C1A}
.lv6{color:#F25CC1;border-color:#F25CC1;background:#F25CC11A}
.lv7{color:#A265F5;border-color:#A265F5;background:#A265F51A}
.lv8{color:#3D7BFF;border-color:#3D7BFF;background:#3D7BFF1A}
.lv9{color:#FFFFFF;border-color:#FFFFFF;background:#FFFFFF1F;font-weight:bold}
.slot{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin-bottom:4px}
.slot.s0{border-left-color:#9FB0BA}.slot.s1{border-left-color:#35D0C0}.slot.s2{border-left-color:#7BD938}
.slot.s3{border-left-color:#E8D021}.slot.s4{border-left-color:#F59218}.slot.s5{border-left-color:#E8453C}
.slot.s6{border-left-color:#F25CC1}.slot.s7{border-left-color:#A265F5}.slot.s8{border-left-color:#3D7BFF}
.slot.s9{border-left-color:#FFFFFF}
.spname{font-size:15px;color:var(--frost)}
.spgist{font-family:var(--mono);font-size:11px;color:var(--fd);display:block;margin-top:1px}
.verdict{border-left:3px solid var(--furn);background:#191410;padding:10px 12px;margin:0 0 14px;border-radius:2px}
.verdict q{font-size:16.5px;line-height:1.6;color:var(--frost);font-style:italic;quotes:none}
.verdict .vm{font-family:var(--mono);font-size:10px;color:var(--fd);display:block;margin-top:6px}
.vold{font-family:var(--mono);font-size:11px;color:#5D6970;padding:4px 0 4px 10px;border-left:1px solid var(--line);margin-bottom:4px}
.vold b{color:var(--fm);font-family:var(--serif);font-size:13px;font-weight:normal;font-style:italic}
pre.ascii{font-family:var(--mono);font-size:11.5px;line-height:1.45;color:var(--fm);background:var(--ink);
border:1px solid var(--line);border-radius:2px;padding:10px;overflow-x:auto;white-space:pre;margin-bottom:10px}
pre.ascii b{color:var(--furn);font-weight:normal}
.coin{font-family:var(--mono);font-size:13px;color:var(--frost);background:var(--ink);border:1px solid var(--line);
border-radius:2px;padding:8px 10px;margin-bottom:6px;overflow-x:auto;white-space:nowrap}
.coin i{color:var(--fd);font-style:normal}
.ffield{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center;margin-bottom:5px}
.ffield label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fd)}
.ffield input,.ffield select,.ffield textarea{width:100%;min-height:0;margin:0}
.ffield textarea{min-height:52px}
.mimg{display:none;max-width:100%;box-sizing:border-box}.mimg.ok{display:block}
/* MEDIA SAFE LAYOUT: obrázek nesmí překrýt text ani rozbít kartu. */
.charhead{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px;align-items:start;min-width:0;margin-bottom:4px}
.charhead:has(.mimg.por.ok){grid-template-columns:minmax(0,1fr) auto}
.charheadtxt{min-width:0;grid-column:1;grid-row:1}.charheadtxt h2{overflow-wrap:anywhere}
.mimg.por{grid-column:2;grid-row:1;width:clamp(88px,20vw,128px);height:auto;aspect-ratio:1/1;object-fit:cover;object-position:center 24%;margin:0;border:1px solid var(--line);border-radius:4px;background:#0B0F14;box-shadow:0 8px 22px #0006}
.mimg.comp{width:64px;height:64px;object-fit:cover;float:left;margin:0 10px 6px 0;border:1px solid var(--line);border-radius:3px;background:#0B0F14}
.mimg.itm{width:42px;height:42px;object-fit:contain;flex:0 0 42px;border:1px solid var(--line);border-radius:3px;background:#0B0F14;padding:2px}
.mimg.lim{width:min(160px,38vw);height:auto;max-height:160px;object-fit:contain;float:right;margin:0 0 8px 12px;border-radius:3px}
.mimg.map{width:100%;height:auto;max-height:420px;aspect-ratio:16/9;object-fit:cover;object-position:center;border:1px solid var(--line);border-radius:4px;margin:0 0 12px;background:#0B0F14}
@media(max-width:560px){
 .charhead{gap:0 10px}.mimg.por{width:86px}.mimg.lim{width:min(120px,36vw);max-height:120px;margin-left:9px}
 .itrow{flex-wrap:wrap}.itrow>.b{min-width:calc(100% - 54px)}.itrow>span:last-child{margin-left:50px;white-space:normal!important}
}
@media(max-width:390px){.mimg.por{width:76px}.charheadtxt .role{font-size:10px}.mimg.itm{width:36px;height:36px;flex-basis:36px}.itrow>span:last-child{margin-left:44px}}

.mnrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #1B242D}
.mnrow b{color:var(--frost);flex:1 1 150px}.mnrow .hp{font-family:var(--mono);color:var(--glass);min-width:64px}
.mnrow .sub{flex:1 1 100%;font-family:var(--mono);font-size:10.5px;color:var(--fd)}
.itrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #1B242D}
.itrow .b{flex:1;min-width:0}
.itrow .b b{color:var(--frost);font-size:13.5px}
.itrow .b span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--fd);margin-top:2px;
white-space:normal;line-height:1.5}
.itrow .w{font-family:var(--mono);font-size:9px;color:var(--furn);border:1px solid var(--furnd);
border-radius:2px;padding:1px 4px;margin-left:5px}
.lrow{border-left:2px solid var(--line);padding:7px 0 7px 10px;margin-bottom:5px;cursor:pointer}
.lrow:hover{border-left-color:var(--glass)}
.lrow b{color:var(--frost);font-size:14px}
.lrow .ls{display:block;font-size:12.5px;color:var(--fm);line-height:1.55;margin-top:2px}
.ltype{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--fd);
border:1px solid var(--line);border-radius:2px;padding:1px 5px;margin-left:6px}
.lsrc{font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:2px;margin-left:4px}
.lsrc.hra{color:#7FD4C4;border:1px solid #7FD4C455}
.lsrc.kanon{color:#8C7AC8;border:1px solid #8C7AC855}
.lsrc.PJ{color:#E0872C;border:1px solid #E0872C55}
.lsrc.hrac{color:#63AFA4;border:1px solid #63AFA455}
.mechgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:5px;margin:8px 0}
.mechgrid div{border:1px solid var(--line);border-radius:2px;padding:5px 7px;background:var(--slate)}
.mechgrid i{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
color:var(--fd);font-style:normal}
.mechgrid b{font-family:var(--mono);font-size:12px;color:var(--frost)}
.filt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:2px 14px}
.leg div{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid #161E26}
.leg u{font-family:var(--mono);font-size:15px;color:var(--furn);text-decoration:none;min-width:20px;text-align:center}
.leg b{color:var(--frost);font-size:13px;font-weight:normal;min-width:74px}
.leg span{font-size:12.5px;color:var(--fd);line-height:1.5;flex:1}
.cat{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--furn);
margin:12px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--furnd)}
.cat u{text-decoration:none;font-size:13px;margin-right:5px}
.cat i{color:var(--fd);font-style:normal;float:right;letter-spacing:0;text-transform:none}
#bSave{border-color:var(--furn);color:var(--furn)}
#bSave.ok{border-color:var(--glass);color:var(--glass)}
.bond{border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-bottom:10px;background:var(--ink)}
.bond h4{font-family:var(--serif);font-size:16px;color:var(--frost);font-weight:normal;margin-bottom:2px}
.bstate{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;
border-radius:2px;margin-left:7px;vertical-align:middle}
.bstate.zdrave{color:#7BD938;border:1px solid #7BD93866;background:#7BD93812}
.bstate.nakrapl{color:#E8D021;border:1px solid #E8D02166;background:#E8D02112}
.bstate.toxick{color:#F25CC1;border:1px solid #F25CC166;background:#F25CC112}
.bstate.zlomen{color:#E8453C;border:1px solid #E8453C66;background:#E8453C12}
.bm{display:grid;grid-template-columns:86px 1fr 40px;gap:7px;align-items:center;margin:5px 0;
font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fd)}
.bm em{font-style:normal;text-align:right;color:var(--frost);font-size:12px}
.bm pre{font-family:var(--mono);font-size:12px;letter-spacing:-1px;margin:0;white-space:pre;overflow:hidden}
.bm.bliz pre{color:#35D0C0}.bm.duv pre{color:#7BD938}.bm.zav pre{color:#F25CC1}.bm.cena pre{color:#F59218}
.gap{color:#5D6970;font-family:var(--mono);font-size:11px;padding:3px 0 3px 11px;border-left:1px dashed var(--line);margin-bottom:6px}


/* ===== SAMOSTATNÁ ZÁLOŽKA KOUZLA ===== */
.spellgrid{display:grid;grid-template-columns:1fr;gap:7px;margin-bottom:12px}
.spelllevel{border:1px solid var(--line);border-radius:3px;background:var(--slate2);overflow:hidden}
.spelllevel>summary{cursor:pointer;padding:10px 11px;display:flex;align-items:center;gap:7px;color:var(--frost);list-style:none}
.spelllevel>summary::-webkit-details-marker{display:none}.spelllevel>summary:after{content:"▾";margin-left:auto;color:var(--fd)}
.spelllevel:not([open])>summary:after{content:"▸"}.spelllevel.locked{opacity:.52;background:#0D1117}
.spelllevel.locked>summary{color:var(--fd)}.spelllevelbody{padding:4px 10px 10px;border-top:1px solid var(--line)}
.smeta{font-family:var(--mono);font-size:10px;color:var(--fd);margin-left:auto;margin-right:8px}
.spellsub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--fd);margin:10px 0 5px;text-transform:uppercase}
.tag.book{color:var(--furn);border-color:var(--furnd);font-family:var(--mono);font-size:9px;border:1px solid;border-radius:2px;padding:1px 5px;margin-left:6px}
.spelllevelbody .slot{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;min-width:0}
.spelllevelbody .spname{min-width:0;overflow-wrap:anywhere}
.spelllevelbody .spgist{flex:1 0 100%;margin-left:0}
.spellctl{margin-left:auto;display:inline-flex;gap:4px;flex-wrap:wrap}
.spellctl button.x{display:inline-block!important;visibility:visible!important;opacity:1!important;color:var(--fm);background:#101820;border-color:#34434F;min-height:27px;padding:3px 8px}
.spellctl button.x:hover,.spellctl button.x.on{color:var(--frost);border-color:var(--glass);background:#17262A}
@media(max-width:420px){.spellctl{flex:1 0 100%;margin-left:0}.spellctl button.x{flex:1 1 auto}}
@media(min-width:760px){.spellgrid{grid-template-columns:1fr 1fr}.spelllevel.unlocked[open]{grid-column:span 2}}

#bgscrim{position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(180deg,rgba(8,11,15,.62) 0%,rgba(8,11,15,.80) 38%,rgba(8,11,15,.88) 100%)}
body{background:transparent}
body.nobg #bgart,body.nobg #bgscrim{display:none}
body.nobg{background:var(--ink)}

#heroT b{display:block;font-size:19px;letter-spacing:.09em;color:#EAF3F1;text-shadow:0 2px 14px #000}
#heroT span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
 text-transform:uppercase;color:#C9A468;margin-top:3px;text-shadow:0 2px 10px #000}
#bgBtn{position:absolute;right:10px;top:8px;z-index:3;padding:3px 8px;font-size:11px;
 background:rgba(16,21,28,.7);border:1px solid var(--line);color:var(--fd)}
header{position:relative;background:rgba(16,21,28,.80);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
nav{background:rgba(16,21,28,.88);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
#dice{background:rgba(22,29,38,.88);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.box{background:rgba(22,29,38,.84);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}

/* ===== ŠUPLÍKY POSTAV ===== */
.who{display:block;margin-bottom:14px}
.wgrp{margin-bottom:9px}
.wlbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.07em;
 text-transform:uppercase;color:var(--fd);font-style:normal;margin:0 0 4px 1px}
.wlbl.sub{margin-top:6px;opacity:.72}
.wrow{display:flex;gap:4px;flex-wrap:wrap}
.wrow button.gst{border-color:#2F4A47;color:#9DBDB6}
.wrow button.gst.on{border-color:var(--glass);background:#17262A;color:var(--frost)}
.foegrp{border-top:1px dashed #5A2A26;margin-top:14px;padding-top:11px}
.foegrp .wlbl{color:#C85A52}
.wrow button.foe{border-color:#6E2B25;color:#E08078;background:#1E1112}
.wrow button.foe.on{border-color:#C85A52;color:#FFD3CD;background:#2C1615}
.wrow button.foe.gone{opacity:.52}
.foecard h2{color:#E08078}
.foecard .role{color:#C85A52}
.foecard .box{border-color:#5A2A26;background:rgba(32,17,18,.86)}
.foecard .lbl{color:#C07068}
.foecard .box.hi{border-color:#8E3830;box-shadow:inset 3px 0 0 #C85A52}
#bLevel{font-weight:700;white-space:nowrap}
#bLevel.pending{box-shadow:0 0 0 1px rgba(224,135,44,.18),0 0 14px rgba(224,135,44,.12)}
.lupick{display:grid;grid-template-columns:145px 1fr;gap:8px;align-items:center;margin:8px 0}
.lupick label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fd)}
.lupick select{width:100%;min-width:0;background:var(--ink)}
.lusum{border-left:3px solid var(--glassd);padding:9px 11px;background:#0C1418;margin:10px 0}
.lusum b{color:var(--frost)}
.lupending{border:1px solid var(--furnd);background:#191410;padding:9px 11px;border-radius:2px;margin:8px 0;color:var(--fm)}
.foenote{border-style:dashed !important}
.gstcard .box.hi{box-shadow:inset 3px 0 0 var(--glassd)}
.gstnote{border-style:dashed !important}
</style>

<script id="DATA">window.DATA={"VERSION":"1.2.110","CHARS":{"karibrk":{"name":"Karibrk","attrs":{"sila":8,"obr":14,"odol":14,"int":21,"moudr":12,"char":11},"full":"Karibrk de Vill","role":"hobit · čaroděj 7 · nekromant · HRÁČ","stats":[["Životy","43 / 43"],["Zbroj","16"],["SO kouzel","16"],["Útok kouzlem","+8"],["INT","21"],["Pas. vnímání","12"]],"bio":["**Nejstarší vzpomínka.** Leze z hořící skříně a šlápne na mrtvé dítě se stejnýma očima a s **druhou polovinou jeho medailonu** na krku.","**Medailon je úpis.** Jedna půlka dluh, druhá splátka — smrt se nevyfoukne pryč, přehodí se. Proto Karibrk nemůže umřít: za něj už bylo zaplaceno.","**Čtyřicet let řemesla.** Nekromancie je práce, ne obřad.","Oslovení: nic pevného — každý mu říká podle svého charakteru, inteligence a toho, jak dobře ho zná. Cizí neosobně, nasraní sprostě a s narážkami na výšku, blízcí důvěrně: přezdívky, křestní jméno, zdrobněliny.","**Den 27.** Zabil svázaného Kessila pomalu a už zbytečně. Ula to slyšela z okna a ráno se ho zeptala, jestli by ublížil i jí. Neuměl odpovědět ne.","**Den 29.** Zapálil mauzoleum jako vzkaz. Kult přišel o cestu dolů — a družina taky.","**Den 36.** V Soukenické uličce zastavil smrtící ránu půl vteřiny před dopadem, protože si vzpomněl, komu se bude večer dívat do očí."],"abil":[{"g":"Triky (bez pozice, neomezeně)","items":[{"n":"Mrazivý dotyk","gist":"2k8 nekrotické, dosah 36 m","d":"Cíl nemůže léčit do začátku tvého dalšího tahu. Nemrtvý má navíc nevýhodu na útoky proti tobě. (Trik roste s úrovní postavy: 2 kostky od 5. úrovně - opraveno, dřív chybně 1.)"},{"n":"Jedovatý postřik","gist":"2k12 jed","d":"Záchrana na Odolnost, jinak plné zranění. Nejtvrdší trik, co má. (2 kostky od 5. úrovně postavy - opraveno, dřív chybně 1.)"},{"n":"Kouzelná ruka","gist":"neviditelná ruka, 9 m","d":"Unese 5 kg, otevře dveře, sebere klíč. Nalít umí taky."},{"n":"Drobná iluze","gist":"zvuk nebo obraz, 1 minuta","d":"Krychle 1,5 m. Stojí akci."},{"n":"Mistrovská ruka","gist":"drobné triky","d":"Zapálí svíčku, zavře zámek na knize, očistí, ochutí, obarví."}]},{"g":"Čaroděj — co umí bez kouzlení","items":[{"n":"Rituální sesílání","gist":"zdarma z knihy","d":"Rituály sesílá přímo z knihy, bez přípravy a bez pozice. Trvá to o deset minut dýl."},{"n":"Arkánové zotavení","gist":"1x denně, krátký odpočinek","d":"Vrátí pozice v souhrnné hodnotě 4 — například jednu 4. úrovně, nebo 3+1, 2+2 či jinou kombinaci do součtu čtyř."},{"n":"Kouzelná kniha","gist":"opisování","d":"Nové kouzlo do knihy: dvě hodiny a 50 zl za úroveň. Nekromantická poloviční — má na to savanta."},{"n":"Příprava kouzel","gist":"12 připravených","d":"INT 21 (+5) a sedmá úroveň. Mění se dlouhým odpočinkem."}]},{"g":"Nekromant — škola","items":[{"n":"Nemrtví poddaní","gist":"6. úroveň — NOVÉ","d":"Animace mrtvých oživí o jednoho navíc. Každý tvůj nemrtvý má +6 životů a přičítá +5 ke zranění."},{"n":"Ponurá sklizeň","gist":"2. úroveň","d":"Když kouzlem někoho zabiješ, vyléčíš si dvojnásobek úrovně kouzla. Nekromantické kouzlo trojnásobek."},{"n":"Nekromantický savant","gist":"2. úroveň","d":"Opis nekromantického kouzla stojí polovinu času i peněz."},{"n":"Odolná mrtvola","gist":"trvale","d":"Nemrtví, které vytvoří, jsou tužší než norma."}]},{"g":"Hobit — co má v krvi","items":[{"n":"Šťastný","gist":"při 1 na kostce","d":"Když hodí 1 na útok, ověření nebo záchranu, hodí znovu a musí vzít nový výsledek. Tohle mu zachránilo život víckrát, než přizná."},{"n":"Statečný","gist":"trvale","d":"Výhoda na záchrany proti vystrašení."},{"n":"Hobití hbitost","gist":"trvale","d":"Projde prostorem tvora o kategorii většího."},{"n":"Skrytí za většího","gist":"akce","d":"Může se skrýt i za tvora o kategorii většího. Za Sandorem je prakticky neviditelný."},{"n":"Metr dvacet","gist":"rychlost 7,5 m","d":"Kratší krok. Kompenzuje to Mlžným krokem a jedovatostí."}]},{"g":"Osobní","items":[{"n":"Karibrkův kydající brk","gist":"zbývají 4 dávky","d":"Deset minut hoření: výhoda na příští záchranu na soustředění a na příští Vhled. Po dobu účinku nevýhoda na iniciativu při překvapení. Recept zná jenom on."},{"n":"Úpis","gist":"půlka medailonu","d":"Za něj už bylo zaplaceno. Nemůže umřít, dokud úpis platí — a nikdo neví, co ho zruší."},{"n":"Podpis v rubrice","gist":"z dřívějšího tažení","d":"Na posledním řádku rubriky stojí jeho jméno jako ručitel výdeje tří set jedné duše. Zatím nikdo neřekl, co to znamená."},{"n":"Tři prázdné schrány","gist":"sklo, které umí držet","d":"Neporušené. Karibrk zatím nikomu neřekl, co ho k tomu napadlo."}]},{"g":"7. úroveň (nové)","items":[{"n":"Pozice 4. úrovně","gist":"1 pozice za dlouhý odpočinek","d":"Sedmá úroveň automaticky přidává jednu pozici 4. úrovně. Lze ji použít i k seslání známého kouzla nižší úrovně ve vyšší pozici."},{"n":"Volby 7. úrovně","gist":"čekají na hráče","d":"Dvě nová kouzla zdarma do knihy zatím NEJSOU vybraná. Navýšení maximálních životů pro 7. úroveň také čeká na potvrzení způsobu (pevná hodnota / hod)."}]},{"g":"Hrobopis — vlastní rukopis (nové)","items":[{"n":"Přetvořenci","gist":"12 kouzel, 1.–7. úroveň","d":"Vyvolání těl přetvořených do nových tvarů: Strážná lebka, Kostěný pavouk, Tři mrtvé vrány, Šitý pes, Srostlík, Mršinový oř, Kráčející rakev, Hrobový červ, Kostnicový kolos, Písař z márnice, Márnicový rytíř, Bárka bez převozníka. Jsou v knize a v nabídce „vyměnit“ u připravených kouzel. Plné statistiky v Lore."},{"n":"Hrobopisec — Pečetě","gist":"1 / 12 · systém AKTIVNÍ","d":"Kodex Hrobopisce je od dne 41 schválený a aktivní. Pečetě 1/12. Přetvořenci jsou od vytvoření skutečné výtvory, ne dočasná kouzla: po dokončení nevyžadují soustředění a nemají časový limit. Vazební limit je roven bonusu zdatnosti (teď 3 navázaní přetvořenci celkem, spící i probuzení). 3 Pečetě: Šev. 6: Zákon zápisu. 9: Hřbitovní půda + Ossuárium. 12: Hrobopisec vznikne jako plnohodnotná cesta/povolání."}]},{"g":"Přetvořenci — jak se to hraje (aktivní)","items":[{"n":"Trvalý zápis do hmoty","gist":"bez koncentrace · bez časového limitu","d":"Seslání a pozice jsou potřeba jen k vytvoření nového přetvořence. Jakmile je zápis dokončen, tvor trvá, dokud neklesne na 0 životů, Karibrk ho trvale neodvolá nebo mu někdo nerozbije či nevymaže vazební jádro. Ztráta soustředění ho neruší."},{"n":"Vazební limit","gist":"bonus zdatnosti · teď 3","d":"Karibrk může mít najednou navázané nejvýš tolik přetvořenců, kolik činí jeho bonus zdatnosti. Počítají se probuzení i spící. Vytvoření dalšího vyžaduje nejdřív trvale odvolat jeden starý zápis."},{"n":"Klidová forma","gist":"1 minuta · dotyk · bez pozice","d":"Karibrk může přetvořence uspat: výtvor se rozloží do své fyzické klidové formy a zůstane navázaný. Probuzení trvá 1 minutu a nestojí pozici. Nic se neteleportuje ani nezmenšuje bez logiky: Hrobový červ pustí vypůjčenou okolní zem a zůstane po něm kompaktní hrobní uzel; vrány jsou tři mrtvá těla, Srostlík zůstane svazkem těl, Kráčející rakev zůstane rakví. Skutečné pohodlné skladování všeho je až budoucí Ossuárium."},{"n":"Protiopatření","gist":"kotva je slabé místo","d":"0 životů nebo zničená kotva přetvořence definitivně ukončí. Rozptýlení magie proti SO 10 + úroveň zápisu ho při úspěchu uspí na hodinu; antimagie ho uspí po dobu působení. Odvracení nemrtvých funguje normálně, ale zápis nemaže. Přímé posvěcení vazebního jádra (svěcená voda/modlitba po 1 minutu) může vazbu přerušit po úspěšném ověření sesílací vlastnosti proti Karibrkovu SO kouzel. Obyčejné Požehnání na někoho vedle nestačí."}]}],"prepby":{"1":["Magické brnění","Štít","Magická střela","Očarování osoby"],"2":["Roztříštění","Spalující paprsek","Sugesce","Zrcadlový obraz"],"3":["Ohnivá koule","Animace mrtvých","Mluvení s mrtvými"],"4":["Hrobový červ"]},"maxlv":4,"featsBy":{"4":"Dotčený Fey (+1 INT → 21; Mlžný krok a Detekce magie každý 1x za dlouhý odpočinek zdarma bez pozice; potom je může sesílat i z vlastních pozic)"},"stav":[["Únava","žádná"],["Kletby","žádné"],["Úpis","aktivní — nemůže umřít, dokud platí"],["Brko","4 dávky"],["Odpočinek","dlouhý, pl ina)","gist":"1/10 · Jiskra","d":"Otvírá se jen při karmě −4 a níž, každé dva body berou karmu o 1. Protiklad: Prázdná miska. Na 10: vrahyně nebo stínová tulačka. Tady se láme, jestli bude mrcha."},{"n":"Prázdná miska (Ilmater, dávat jídlo)","gist":"0/10 · spí","d":"Otvírá se jen při karmě +4 a výš. Třicet devět let brala jídlo, které nesnědla — tady ho začne dávat. Každé dva body karmu o 1 nahoru. Protiklad: Stín. Na 10: mniška nebo kněžka Ilmatera, Zlomení."}]}],"prep":[],"stav":[["Zastavení","zrušeno"],["Skořápka","živá a otravná"]],"next":["Zjišťuje, co znamená jíst a usínat. Nikdo neví, jak rychle začne stárnout.","Postupně přibývají další dovednosti podle toho, co ji naučí kdo z party.","**Cesty:** Ula stojí na zlomu — cesty Stín a Prázdná miska se otvírají podle karmy a navzájem se vylučují. Která se probudí první, rozhodne víc než kostky."],"aliases":["číslo partie"],"side":"druzina"},"pes":{"name":"Uhlík","attrs":{"sila":10,"obr":15,"odol":12,"int":3,"moudr":12,"char":6},"full":"Uhlík","role":"ovčácký pes · Elčin, vybral si ji sám","stats":[["Životy","9 / 9"],["Zbroj","12"],["Věk","pár týdnů"],["Váha","poroste"],["Čich","výborný"],["Sluch","slyší dřív než Sandor"]],"bio":["Narodil se na farmě dvě míle od Poštovní stanice U Tří vran, pár týdnů předtím, než ho Elie našla.","Ze šesti štěňat jediný přiběhl rovnou k ní a srazil ji do slámy. Farmář: „Von si ji vybral hned, jak vešla dovnitř.\"","Jméno mu dala Elie: **Uhlík** — tmavý, narozený kousek od vyhořelého domu, který přesto znovu hoří teplem, ne ohněm.","**PRAVIDLO STOLU:** Uhlík do boje nejde nikdy, dokud nevyroste a nikdo to nerozhodne jinak. Zatím hlídá a varuje, nebojuje."],"abil":[{"g":"Co umí","items":[{"n":"Zavrčí na cizí","gist":"první noc to potvrdila liška","d":"Nemá ani deset týdnů a už dává najevo, když je něco za dveřmi."},{"n":"Jde k Elii jako první","gist":"vždycky","d":"Ze všech lidí v domě si vybral ji. Spí u ní, jí u ní, čeká u dveří, až se vrátí."}]},{"g":"Co se učí","items":[{"n":"Základní povely","gist":"začíná se","d":"Sandor slíbil výcvik — sedni, k noze, hlídej. Zatím žádný pokrok k zaznamenání."},{"n":"Život v domě","gist":"první týdny","d":"Učí se, kde smí spát, kde ne, a že husa Skořápka není hračka, i když si to nemyslí."}]}],"prep":[],"stav":[["Zdraví","výborné"],["Nálada","vždycky nadšený"],["Vazba na Elii","od první minuty"]],"next":["Poroste. Až bude starší, přibudou výcvikové schopnosti podle toho, co ho kdo naučí."],"aliases":["pes","štěně","ovčácký pes"],"side":"druzina"},"sutrostrom":{"name":"Rocky","full":"Rocky, zvaný Šutrostrom","role":"hlínitá bytost · strážce dluhu · spojenec U Tří vran","attrs":{"sila":18,"obr":8,"odol":18,"int":10,"moudr":14,"char":9},"stats":[["Životy","68 / 68"],["Zbroj","17 (přirozená)"],["Rychlost","6 m (kráčí pomalu, mechanicky)"],["Útok pěstí","1k10+4 tupé"],["Odolnosti","jed, nekrotické"],["Imunity","otrávení, vyčerpání"]],"bio":["**Vznikl z dluhu.** Hora kdysi dlužila za těžbu bez navrácení — je to, co z toho vracení zbylo. Sto let hlídal žílu surového stříbra na severu.","**Nikdo ho neprosil.** Brali, nebo utíkali. Karibrk je první, kdo ho o něco požádal místo aby si to vzal.","**Nemá jméno.** Sto let se ho nikdo neptal. Elie mu slíbila, že jedno dostane od holek.","**První pivo v životě** vypil U Tří vran v den, kdy se nastěhoval, a rovnou chtěl druhé.","**Dostal jméno Rocky.** Přezdívku Šutrostrom si nechal, protože obě dávají smysl.","**Den 30.** Past v bezměsíčné noci byla na něj, ne na holky. Dodržel dohodu a schoval je."],"abil":[{"g":"Podstata z hlíny a dluhu","items":[{"n":"Zemitá odolnost","gist":"trvale","d":"Odolnost proti jedu a nekrotickému zranění, imunita vůči otrávení a vyčerpání. Nemusí dýchat, jíst ani spát v obvyklém smyslu."},{"n":"Splynutí s kamenem","gist":"akce, 1x za dlouhý odpočinek","d":"Vnoří se do přirozeného kamene nebo zeminy a zůstane tam ukrytý, dokud se sám nerozhodne vylézt. Nevidí ven, ale cítí otřesy a kroky v okolí 9 m."},{"n":"Váha dluhu","gist":"reakce, dotyk","d":"Když se ho někdo dotkne se zlým úmyslem (útok, krádež, násilí), cíl musí uspět v záchraně na Sílu, jinak je na 1 kolo zpomalen na polovinu — jako by na něm najednou ležela tíha, kterou si nezasloužil unést."}]},{"g":"Co umí, protože sto let poslouchal skálu","items":[{"n":"Cítí, co leží v zemi","gist":"pasivně, dosah 18 m","d":"Pozná staré hroby, zazděné věci, kov v kameni, tělo pod povrchem — cokoli, co země 'drží'. Nepozná co přesně, jen že tam něco je a jak dlouho."},{"n":"Nikdy se neztratí pod zemí","gist":"trvale","d":"V jeskyních, katakombách, sklepech vždy ví, kudy nahoru na nejkratší cestě."},{"n":"Trpělivost, co nemá konec","gist":"trvale","d":"Výhoda na záchrany proti strachu, iluzím a čemukoli, co spoléhá na netrpělivost nebo spěch cíle."}]},{"g":"Osobní (nové, ne bojové)","items":[{"n":"Poprvé ochutnává svět","gist":"probíhá","d":"Pivo, jídlo, počasí, zvuky — všechno je pro něj nové po sto letech nehybnosti. Reaguje na malé věci s upřímným, nefalšovaným úžasem."},{"n":"Nezná meze s dětmi","gist":"vědomě dodržuje","d":"Karibrk ho požádal o dohled nad Elie a Ulou — bere to vážně a doslovně. Nikdy by nepřekročil hranici, kterou sám nezná, protože se radši zeptá."}]}],"prep":[],"stav":[["Domov","U Tří vran, kout u okna"],["Vztah k Elie a Ule","dohled, ne stráž"],["Jméno","Rocky (přezdívka Šutrostrom)"]],"next":["Možný růst: časem se může naučit víc o světě nahoře, nebo najít vlastní důvod zůstat, ne jen slib domova."],"aliases":["Šutrostrom","Rocky","sutr"],"side":"soudek"},"vaelor":{"name":"Mlazivoj Vaelor","full":"Mlazivoj Vaelor, samozvaný arcimág Horního města","role":"⚠ TRVALÝ NEPŘÍTEL — samolibý kouzelník, vydává se za člena Zahalených mágů","attrs":{},"stats":[["Postavení","poražen a veřejně ponížen, naživu"],["Zranění","zmrzlá ruka, zlomená pýcha"],["Co po něm Karibrk viděl","zrcadlový obraz (iluze dvojníků), mrazivý útok odražen pozdě, žádný štít včas"],["Odznak","stříbrný kruh s okem — nejisté, zda pravý člen Zahalených mágů, nebo koupený či ukradený"]],"bio":["Potkán náhodou v Soukenické uličce v Dolním městě (den ~37, tři dny po noci s Ilvosem) - veřejně terorizoval švadlenu a její dvě děti kvůli dluhu 6 zlatých, hrozil sebráním syna do 'práce'.","Karibrk nejdřív nabídl zaplatit dluh a odejít v klidu - odmítnuto co nejhrubějším způsobem, Vaelor si nárokoval 'právo' na rodinu jako majetek.","Fyzický zákrok (facka/úder) prošel skrz Zrcadlový obraz - Vaelor pak zaútočil doopravdy na zabití. Karibrk ho v souboji rozdrtil (Roztříštění rozbilo iluze, Mrazivý dotyk ochromil ruku), v poslední milivteřině před smrtící ranou se zastavil kvůli myšlence na Elii.","Veřejně ponížen před celou ulicí - Karibrk mu nadiktoval, že je 'amatér', ne skutečný mág, a nechal ho žít se zlomenou pýchou místo mrtvého těla.","Rodina švadleny zachráněna a dluh zaplacen z Karibrkovy kapsy."],"abil":[],"stav":[["Vztah ke Karibrkovi","zahanbený, zraněná pýcha, tichá touha po pomstě"],["Prozatím","nezná Karibrkovo jméno ani adresu - Karibrk se nepředstavil"]],"next":["Neaktivní, dokud hráč výslovně nestanoví přesná pravidla jeho dlouhodobé role. Potom se může vrátit jako obyčejný člověk a osobní arcinepřítel, ne jako kosmická hrozba."],"aliases":["Mlazivoj","Vaelor"],"side":"nepritel"}},"CHRON":[{"title":"Zádrž","blocks":[{"k":"h1","t":"ZÁDRŽ"}],"id":"zadrz-obal","era":"Ostružná"},{"title":"Prolog — tři dny před Ostružnou","blocks":[{"k":"h2","t":"Prolog — tři dny před Ostružnou"},{"k":"p","t":"<em>Dungeons &amp; Dragons · Dobrodružství II · Krkavčí marka</em>"}],"id":"prolog","era":"Ostružná"},{"title":"I. U PŘEŤATÉ PODKOVY","blocks":[{"k":"h2","t":"I. U PŘEŤATÉ PODKOVY"},{"k":"p","t":"Zima přišla o tři týdny dřív, než měla, a přišla naštvaná."},{"k":"p","t":"Zájezdní hostinec U Přeťaté podkovy stojí na křižovatce, kde se dělí cesta na Zádušní hory a cesta k moři, a je to jediný barák na dva dny cesty, který má dveře, které se dají zavřít. Kdo si to nemůže dovolit, ten spí ve chlévě. Kdo si nemůže dovolit ani chlév, ten spí venku a ráno se sáně objíždějí."},{"k":"p","t":"Vy jste na tom v tomhle pořadí zhruba uprostřed."},{"k":"p","t":"Karibrk de Vill sedí u stolu nejblíž k ohni, protože je hobit a metr dvacet a v každé místnosti, kam vejde, si během první minuty najde místo, které je teplé a ze kterého vidí na dveře. Před ním leží tři měděné mince a rozepsaná stránka. Nepíše kouzlo. Píše seznam věcí, které v posledních čtrnácti dnech nefungovaly."},{"k":"p","t":"Je to dlouhý seznam."},{"k":"p","t":"Sandor stojí u kamen, protože se za stůl nevejde tak, aby vedle něj mohl sedět ještě někdo, a v téhle boudě jsou lidi, kteří chtějí sedět. Vaří. Vaří vždycky, i když se nemá z čeho vařit — dneska je to voda, tři cibule a kus slaniny velký jak dva palce, a bude z toho něco, co se dá jíst, protože Sandor to umí a nikdo neví proč."},{"k":"p","t":"Mer sedí zády ke zdi a nedělá nic. Vypadá to, že spí. Nespí. Mer nikdy nespí v místnosti, kde je víc než šest lidí, a jsou tu čtyři formani, dva hoši od koní a jeden chlap, který se od poledne nedotkl svého piva a to je věc, které si všimla už dvakrát."},{"k":"p","t":"A Tina přijde ve dvě odpoledne, otevře dveře nohou, protože má obě ruce plné, a hodí na stůl svitek, který má vosk a stuhu a všechny ty věci, které mají svitky, za které se platí."},{"k":"p","t":"„Tak,&quot; řekne. „Buď mě zabijete, nebo mi poděkujete.&quot;"},{"k":"hr"},{"k":"p","t":"Vyjednávala tři dny v Suché Lhotě, kde se z komína cechovní úřadovny kouří, i když v ní nikdo nebydlí, a vrátila se s papírem, který nevypadá jako práce pro takové, jako jste vy."},{"k":"p","t":"Karibrk si ho přečte dvakrát. Podruhé pomaleji."},{"k":"p","t":"<strong>Sklářský cech města Ostružné</strong> hledá <strong>odborníka na nekromantickou nauku</strong> k výkonu dohledu nad <strong>dvanácti přelivy</strong> a k <strong>revizi skladu</strong>. Nástup okamžitý. Ubytování a strava zajištěny. Doba trvání dle potřeby, nejméně však jedno kvartální kolo."},{"k":"p","t":"<strong>Tři sta zlatých.</strong>"},{"k":"p","t":"„Tři sta,&quot; řekne Sandor od kamen a nepřestane míchat."},{"k":"p","t":"„Tři sta,&quot; řekne Tina."},{"k":"p","t":"„Na hlavu?&quot;"},{"k":"p","t":"„Ne, ty vole, celkem. Sedmdesát pět na hlavu. To je pořád víc, než jsme čtyři dohromady viděli za celý loňský rok, a loni jsme dělali.&quot;"},{"k":"p","t":"Mer otevře oči. Nezvedne hlavu, jenom otevře oči, a to u ní znamená totéž jako když se někdo jiný postaví."},{"k":"p","t":"„Kdo tam umřel?&quot;"},{"k":"p","t":"„Cože?&quot;"},{"k":"p","t":"„Kdo jim umřel, když teď hledají.&quot; Mer má hlas, jako když se zavírají dveře — ne prudce, ale definitivně. „Za tři sta zlatých se nehledá nový. Za tři sta zlatých se hledá <strong>náhrada.</strong>&quot;"},{"k":"p","t":"Tina si sedne, nalije si z Karibrkova džbánku, protože je to Karibrkův džbánek a ona to dělá schválně už jedenáct let, a odpoví úplně klidně:"},{"k":"p","t":"„Jejich chlap prasknul.&quot;"},{"k":"p","t":"„Jak prasknul.&quot;"},{"k":"p","t":"„Nevím jak. Řekli mi doslova, že prasknul. Já jsem se ptala, jestli tím myslí infarkt nebo pád, a ten úředník se na mě podíval a řekl: <em>Prasknul.</em> A pak mi nabídl čaj.&quot;"},{"k":"p","t":"Chvíli je ticho, ve kterém je slyšet jenom Sandorova vařečka."},{"k":"p","t":"„Berem to,&quot; řekne Karibrk."},{"k":"p","t":"„Ty ses ani nezeptal, co je přeliv,&quot; řekne Mer."},{"k":"p","t":"„Ne.&quot;"},{"k":"p","t":"„Proč ne?&quot;"},{"k":"p","t":"Karibrk zvedne oči od toho svého seznamu věcí, které nefungovaly."},{"k":"p","t":"„Protože jsem to slovo v životě neslyšel a jsem v tomhle oboru čtyřicet let. A to znamená jednu ze dvou věcí: buď je to jejich cechovní žargon pro něco úplně obyčejného, a pak jsme si vydělali tři sta zlatých za nic.&quot; Namočí brk. „Nebo to je něco, co dělá jenom jedno město na světě. A pak to chci vidět, i kdyby mi neplatili.&quot;"},{"k":"p","t":"Sandor sundá hrnec z ohně a postaví ho doprostřed stolu."},{"k":"p","t":"„Tohle je ten druh věty,&quot; řekne, „po kterém obvykle někdo umře.&quot;"},{"k":"p","t":"„No a?&quot;"},{"k":"p","t":"„Nic. Jenom to říkám nahlas, abych to potom nemusel.&quot;"},{"k":"hr"},{"k":"p","t":"Podepsali to všichni čtyři, protože tak se to u nich dělá — ne proto, že by to cech vyžadoval, ale protože kdo nepodepsal, ten může říct, že u toho nebyl. Podepsali to na desce stolu, kolem hrnce, a Tina počítala nahlas, kolik to je na hlavu, a Sandor jí řekl, ať přestane, a ona nepřestala."},{"k":"p","t":"A v tom papíru byla ještě jedna položka. Byla v seznamu úkonů, mezi <em>revizí skladu</em> a <em>dohledem nad chlazením</em>, a byla napsaná stejným písmem jako všechno ostatní, takže si jí sice všimli, ale nikdo se u ní nezastavil."},{"k":"q","t":"<em>jedna vadná k odstranění</em>"},{"k":"p","t":"Karibrk si to přečetl. Vzpomněl si, že vadné kusy skla se házejí zpátky do pece."},{"k":"p","t":"A obrátil stránku."}],"id":"ostr-01","era":"Ostružná"},{"title":"II. CO JSTE ZAČ","blocks":[{"k":"h2","t":"II. CO JSTE ZAČ"},{"k":"p","t":"Za tohle vás žádný kronikář nepochválí a nikdo o vás nenapíše píseň, a kdyby, tak by to byla ta krátká, co se zpívá potichu."},{"k":"p","t":"Znáte se <strong>jedenáct let</strong>. Poznali jste se ve <strong>Vlčí jámě</strong> — zatopená stříbrná šachta, trestanecká četa, dvanáct lidí na jednom řetěze, osm dní ve vodě po pás. Když jeden upadl, tak buď ho zbylých jedenáct zvedlo, nebo šli dolů všichni, protože řetěz šel dolů s ním."},{"k":"p","t":"Zvedli jste se navzájem stočtyřicetkrát. Nikdo je nepočítal a všichni to číslo znají."},{"k":"p","t":"Dvanáct jich do jámy šlo. Čtyři vylezli."},{"k":"p","t":"Skládat se to pak dávalo <strong>dva roky</strong> a bylo to nemotorné, protože nikdo z vás neuměl žít s lidmi, kteří po něm nic nechtějí. Několikrát jste se rozešli — jednou na rok a půl, jednou na osm měsíců — a nikdy to nebylo ve zlém. Vždycky to bylo z praktičnosti, z peněz, z toho, že někdo musel na čas zmizet, protože ho hledali. A pokaždé jste se sešli zpátky do měsíce od chvíle, kdy to šlo."},{"k":"p","t":"A za ta léta v tom vzniklo něco, o čem nikdo z vás nikdy nemluvil a co nikdo nikdy nenapsal."},{"k":"p","t":"Není to přísaha. Nikdo ji nesložil. Není to vděk, protože vděk se opotřebuje. Není to ani přátelství, protože přátelé si tohle nedělají."},{"k":"p","t":"Nejblíž se k tomu dostala Mer, jednou v noci, když byla opilá tak, že mluvila pravdu:"},{"k":"p","t":"<strong>„Já nechráním vás. Já chráním tu cenu, kterou má můj život od chvíle, co jste mě vytáhli. Kdybych vás nechala chcípnout, tak se ta cena vrátí na nulu a já jsem zpátky ve vodě.&quot;</strong>"},{"k":"p","t":"Ostatní tři to slyšeli. Nikdo na to nic neřekl."},{"k":"p","t":"A od té doby o tom nikdo nemluvil ani jednou — ale visí to ve vzduchu úplně vždycky, u každého jídla, u každé hádky, u každého dělení kořisti. Nikdo z vás to neumí pojmenovat, nikdo by o tom nechtěl mluvit ani pod nožem, a všichni čtyři to považujete za to nejsvatější, co máte."},{"k":"p","t":"Nejste dobří lidé. Ani jeden."},{"k":"p","t":"Jenom máte jedno pravidlo, které nikdo nevyslovil."}],"id":"ostr-02","era":"Ostružná"},{"title":"III. DĚDEK SE VRACÍ","blocks":[{"k":"h2","t":"III. DĚDEK SE VRACÍ"},{"k":"p","t":"Ráno druhého dne, ještě za tmy, vyjdete ze dvora a na oji vozu sedí jedenáctileté mrtvé dítě a klátí nohama."},{"k":"p","t":"„Vy jste si koupili vůz,&quot; řekne místo pozdravu. „Vy jste si koupili <strong>vůz.</strong> Za co? Vy jste loni neměli na kroupy.&quot;"},{"k":"p","t":"„Dědku,&quot; řekne Tina."},{"k":"p","t":"„Nezdravím se. Zdravení je pro lidi, kteří se dlouho neviděli, a já jsem vás viděl minulý týden, akorát vy jste neviděli mě, protože jste blbí.&quot;"},{"k":"p","t":"Byl pryč <strong>čtrnáct měsíců</strong>."},{"k":"p","t":"Nikdo se ho nezeptá kde. Neptali se ho ani poprvé, ani popáté, a už se to nějak nedělá. Sandor mu beze slova podá krajíc, který Dědek nesní, protože nejí, a přesto ho vezme a strčí do kapsy, protože to dělá pokaždé a nikdo neví proč. Mer mu zkontroluje pravou ruku, kde měl loni prasklé zápěstí, protože ta mrtvola se sama nespraví a ona je jediná, kdo to umí zašít tak, aby to drželo."},{"k":"p","t":"Kaštan k němu přileze zespodu z vozu a zůstane mu ležet u nohy, což je jediný projev náklonnosti, jakého je hrobní mlok schopen, a Dědek se tváří, že si toho nevšiml."},{"k":"p","t":"Vy čtyři víte tohle a nic víc:"},{"k":"p","t":"Jmenuje se Dědek, protože mu tak Tina před devíti lety řekla jako urážku a on odpověděl <strong>„přijímám&quot;</strong> a od té doby se tak podepisuje — teda podepisoval by se, kdyby uměl psát, což neumí, což je jediná věc na světě, kvůli které se vzteká jako opravdové dítě."},{"k":"p","t":"Mizí a přichází. Nikdy neřekne, že jde. Nikdy neřekne, kde byl."},{"k":"p","t":"A <strong>pětkrát za devět let</strong> se objevil přesně v tu vteřinu, kdy jste měli umřít. Jednou v zamčené kobce, jednou na dně strže, jednou vteřinu předtím, než Sandorovi projela hlavou kuše."},{"k":"p","t":"První tři roky jste tomu říkali náhoda."},{"k":"p","t":"Teď tomu radši neříkáte nijak."},{"k":"hr"},{"k":"p","t":"Sedí na oji celý den a nadává. Nadává na cestu, na koně, na Tinin způsob řízení, na to, že sníh padá blbě, a v jednu chvíli se zastaví uprostřed věty a mlčí dvě hodiny, a pak pokračuje přesně tam, kde přestal, jako by se nic nestalo."},{"k":"p","t":"Umí věci, které nejsou k ničemu."},{"k":"p","t":"Umí mluvit <strong>jakýmkoli hlasem, který kdy slyšel</strong> — a slyšel jich hodně, a některé z nich jsou mrtvé tak dlouho, že to jméno už nikomu nic neřekne. Dělá s tím u ohně zvířata a jednou tím Tinu rozbrečel a od té doby to nedělá."},{"k":"p","t":"<strong>Vždycky ví, kolik je hodin.</strong> Na minutu. Ve sklepě bez oken, v mlze, po týdnu v podzemí. Nikdy se nespletl a nikdy nevysvětlil jak."},{"k":"p","t":"<strong>Přečte jakékoli písmo.</strong> Včetně těch, která už nikdo nezná. Sám nenapíše ani čárku."},{"k":"p","t":"<strong>Ví, kolik dní je někdo naživu.</strong> Ne dopředu — dozadu. Neptá se. Prostě to ví."},{"k":"p","t":"A kolem něj se <strong>zastaví hmyz.</strong> Do tří kroků. Mouchy, brouci, mravenci — zůstanou stát a čekají, a když odejde, tak jdou dál. O tomhle nemluví vůbec."},{"k":"p","t":"Karibrk se ho jednou, jedinkrát, zeptal, co byl zač předtím."},{"k":"p","t":"Dědek se na něj podíval a řekl:"},{"k":"p","t":"„Já jsem nikdy nesloužil pánovi, hobite. Já jsem sloužil <strong>rubrice.</strong> A to je rozdíl, který ti nevysvětlím, protože bys ho pochopil, a to bych ti nepřál.&quot;"},{"k":"p","t":"Pak si odplivl, i když nemá sliny, protože je to gesto a gesta mu zůstala."}],"id":"ostr-03","era":"Ostružná"},{"title":"IV. TŘI DNY NA SEVER","blocks":[{"k":"h2","t":"IV. TŘI DNY NA SEVER"},{"k":"p","t":"Cesta do Ostružné vede třemi údolími a v každém je hůř."},{"k":"p","t":"<strong>První den</strong> je normální zima. Druhý den je zima, která bolí. Třetí den praskají stromy — ne obrazně, doopravdy: mráz se dostane do dřeva, voda v něm zmrzne a kmen se roztrhne s ranou jako z kuše, a vy se pokaždé lekněte a pokaždé se tomu pak smějete."},{"k":"p","t":"Mer jede vzadu a nemluví. Kaštan jí leze po rukávu a ona ho nechá. Když se u brodu zastavíte napojit koně, mlok slézt z vozu a <strong>zůstane stát nad kusem zamrzlé země</strong>, kterou nikdo z vás nerozezná od kterékoli jiné."},{"k":"p","t":"„Co tam má?&quot; zeptá se Tina."},{"k":"p","t":"„Někdo tam leží,&quot; řekne Mer. „Dlouho. Není to čerstvé.&quot;"},{"k":"p","t":"„A to on pozná?&quot;"},{"k":"p","t":"„On to pozná skrz metr kamene.&quot; Mer ho zvedne a strčí si ho pod plášť. „Proto ho mám. Nemám ho, protože je hezký.&quot;"},{"k":"hr"},{"k":"p","t":"Sandor jde většinu cesty pěšky vedle vozu, i když se na něj vejde, protože chodit pomáhá. V noci vaří. Ve dne mlčí. A když se na jednom kopci potkáte s formanem, který veze dřevo, a ten forman spustí do svého kluka — pacholka, patnáct let, ruce od omrzlin — způsobem, který se dělá jenom lidem, o kterých se ví, že nemají kam jít, tak Sandor <strong>zastaví.</strong>"},{"k":"p","t":"Postaví se tři kroky od něj a nic neřekne. Jenom stojí."},{"k":"p","t":"Forman se v půlce věty zarazí, podívá se nahoru — a nahoru je u Sandora daleko — a najednou má práci u koní."},{"k":"p","t":"Karibrk to viděl. Karibrk viděl i to, co viděl Sandor: kluk má na krku spálený pruh od provazu, jaký se dělá, když se vede za krk, a ne když se věší."},{"k":"p","t":"Sandor se vrátí k vozu a řekne:"},{"k":"p","t":"„Nic.&quot;"},{"k":"p","t":"„Já nic neříkám,&quot; řekne Karibrk."},{"k":"p","t":"„Ty vždycky neříkáš nejhlasitěji ze všech.&quot;"},{"k":"hr"},{"k":"p","t":"O Sandorovi se u vás ví tohle a nikdo o tom nikdy nemluvil nahlas:"},{"k":"p","t":"Devatenáct let byl <strong>katem Krkavčí marky.</strong> Byl v tom dobrý — jedna rána, nikdo netrpěl, a každého se předtím zeptal, jestli má vzkaz. Má u sebe sešitek. Je v něm <strong>sto devadesát sedm vzkazů</strong> a nikdy z něj nepřečetl nahlas ani jeden."},{"k":"p","t":"Skončilo to, když mu přivedli čtrnáctiletou holku, která ukradla husu."},{"k":"p","t":"Odmítl."},{"k":"p","t":"Za odmítnutí šel do Vlčí jámy on sám a to je celý ten příběh."},{"k":"p","t":"A když z jámy vylezl, tak začal dělat přesně to, co po něm celou dobu chtěli — akorát si to zařídil po svém. Bez rozsudku, bez špalku, bez otázky, jestli má někdo vzkaz. Někdy uprostřed rozhovoru. Někdy dřív, než si vůbec všimnete, že něco viděl."},{"k":"p","t":"Nikdo z vás v tom nevidí maniaka. Ti lidi si to většinou opravdu zaslouží a on to pozná dřív a líp než kdokoli jiný."},{"k":"p","t":"Většinou."},{"k":"p","t":"Nikdo z vás mu to nikdy nevyčetl. Ve Vlčí jámě zvedal Sandor řetěz sám třikrát."},{"k":"hr"},{"k":"p","t":"Karibrk nespí. Nespí pořádně od jámy a nespal pořádně ani předtím, a ta věc, kvůli které nespí, se dá popsat jednou větou, kterou nikdy nikomu neřekl:"},{"k":"p","t":"<strong>Celý život si přeje umřít, od té doby, co si pamatuje. A nejde to.</strong>"},{"k":"p","t":"Ne že by neměl odvahu. Zkoušel to. A pokaždé to nevyšlo způsobem, který se nedá vysvětlit smůlou — provaz, který vydržel čtyři lidi, praskl u něj; jed, který skolil koně, mu udělal tři dny těžké břicho; a jednou spadl ze skály, o které dodnes ví přesně, jak byla vysoká."},{"k":"p","t":"Nejstarší vzpomínku má tuhle a nemá žádnou starší:"},{"k":"p","t":"<em>Leze z hořící skříně. Je horko. Dýmu je tolik, že se nedá otevřít oko. A první věc, na kterou v té místnosti šlápne, je <strong>mrtvé dítě, sotva roční</strong>, které má úplně stejné oči jako on.</em>"},{"k":"p","t":"<em>A na krku mu visí <strong>druhá polovina medailonu</strong>, jehož první polovinu má on sám a měl ji, co pamatuje.</em>"},{"k":"p","t":"Nosí ji dodnes. Nikdy ji nikomu neukázal. Ta druhá půlka mu zůstala v ruce a je jediná věc, kterou si z toho hořícího domu odnesl kromě sebe."},{"k":"p","t":"Kdyby se ho někdo zeptal, jak se z hobita stane nekromant, tak neodpoví. Ukáže."},{"k":"p","t":"A kdyby ho ta otázka chytila ve tři ráno, ve špatný den, tak by možná řekl to, co si myslí:"},{"k":"p","t":"<em>„To jsem měl být kurva zahradník?&quot;</em>"}],"id":"ostr-04","era":"Ostružná"},{"title":"V. MĚSTO, KDE NIKOMU NEJDE PÁRA","blocks":[{"k":"h2","t":"V. MĚSTO, KDE NIKOMU NEJDE PÁRA"},{"k":"p","t":"Třetí den, hodinu před soumrakem, vyjedete z lesa a pod vámi leží Ostružná."},{"k":"p","t":"První, co uvidíte, je <strong>záře.</strong> Sklárna stojí na kopci nad městem a hoří ve dne v noci, už osmdesát let bez přerušení, a v mrazu se ta záře odráží od sněhu tak, že celé údolí vypadá jako vnitřek pece."},{"k":"p","t":"Druhá věc, které si všimnete, jsou <strong>domy.</strong> Kamenné. Všechny. Ve výšce, kde by měly stát chalupy z hlíny a klacků, stojí měšťanské domy s okenicemi, s malovanými štíty a se skly v oknech — se skutečnými tabulkami skla, kterých je v každém okně šest, a v Krkavčí marce si tabulku skla nemůže dovolit ani rychtář."},{"k":"p","t":"„Do prdele,&quot; řekne Tina."},{"k":"p","t":"„Tři sta zlatých,&quot; řekne Mer, „najednou vypadá jako almužna.&quot;"},{"k":"p","t":"Na kašně uprostřed náměstí je vytesané heslo, které tam dal vytesat pradědeček současného cechmistra:"},{"k":"q","t":"<strong>U NÁS NIKDO NEUMÍRÁ</strong>"},{"k":"p","t":"„Reklama,&quot; řekne Tina."},{"k":"p","t":"„Ne,&quot; řekne Dědek z oje, a řekne to tak, že se všichni otočí. „To není reklama. To je <strong>záruka.</strong> To je věta, kterou se ručí za zboží.&quot;"},{"k":"p","t":"A pak dodá, poprvé za tři dny bez ironie:"},{"k":"p","t":"„Postavte vůz mimo město.&quot;"},{"k":"hr"},{"k":"p","t":"Před branou si hraje asi dvacet dětí."},{"k":"p","t":"Je jich moc. Na město téhle velikosti je jich dvakrát tolik, než by mělo být. Honí se po ušlapaném sněhu, křičí, jedno druhému nadává, jedno pláče a hned zase ne, a je to úplně obyčejný křik dvaceti dětí před bránou, takový, jaký slyšíš v každé vesnici na světě."},{"k":"p","t":"Sandor to nevidí. Tina to nevidí. Mer to skoro vidí a nedá si to dohromady."},{"k":"p","t":"<strong>Karibrk to uvidí okamžitě</strong>, protože je to jeho řemeslo a dělá ho čtyřicet let."},{"k":"p","t":"Praská mráz. Stromy se trhají. Koním jde od nozder pára jak z komína a tobě samotnému stoupá od pusy oblak, kterým bys mohl podepsat vlastní jméno."},{"k":"p","t":"<strong>A žádnému z těch dvaceti dětí nejde od pusy ani obláček.</strong>"},{"k":"p","t":"Ani jednomu. Křičí, běhají, funí — a nad tím vším je čistý mrazivý vzduch, prázdný jako v létě."},{"k":"p","t":"Stojíš na cestě, hobit metr dvacet, s rukou na oji vozu, a tvoje vlastní pára ti stoupá nad hlavu, a v tu chvíli, poprvé za třicet let praxe, tě z něčeho zamrazí zevnitř, ne zvenku."}],"id":"ostr-05","era":"Ostružná"},{"title":"VI. TA JEDINÁ","blocks":[{"k":"h2","t":"VI. TA JEDINÁ"},{"k":"p","t":"Až úplně vzadu."},{"k":"p","t":"U zdi, kde nikdo nestojí, protože tam je stín a je tam o dva stupně míň, stojí malá holka s vědrem, které je pro ni moc velké, a čeká, až ostatní doběhnou, aby mohla projít."},{"k":"p","t":"Je jí devět. Je bledá a je hubená tím způsobem, kterým jsou hubené děti, které jedly, ale ne dost."},{"k":"p","t":"Postaví vědro. Zkřehlé prsty si dá k puse a <strong>dýchne na ně.</strong>"},{"k":"p","t":"A nad její hlavou vystoupá pára."},{"k":"p","t":"Jediná v celém tom městě."},{"k":"hr"},{"k":"p","t":"Uvidí, že se na ni koukáš."},{"k":"p","t":"A udělá věc, po které tě zamrazí podruhé, hůř: <strong>lekne se.</strong> Nekoukne se za sebe, jestli se nedívá někdo z dospělých. Nesklopí hlavu. Prostě si dá dlaň přes pusu — rychle, naučeně, tím pohybem, jakým si člověk zakrývá něco, za co ho už mockrát plácli přes ruku."},{"k":"p","t":"Zakryje si dech."},{"k":"p","t":"Protože ji naučili, že <strong>to</strong> je ta vada."},{"k":"p","t":"Chvíli tam tak stojíte, ona s dlaní na puse a ty s otevřenou. Pak vezme vědro oběma rukama a odejde brankou dovnitř a ani jednou se neohlédne, protože se ohlížejí děti, které čekají, že za nimi někdo půjde."},{"k":"p","t":"Tina se podívá na Karibrka."},{"k":"p","t":"„Ty seš bílej.&quot;"},{"k":"p","t":"„Já jsem vždycky bílej.&quot;"},{"k":"p","t":"„Ne takhle.&quot;"}],"id":"ostr-06","era":"Ostružná"},{"title":"VII. CECHMISTR","blocks":[{"k":"h2","t":"VII. CECHMISTR"},{"k":"p","t":"<strong>Bervoj Hlaváč</strong>, cechmistr sklářského cechu města Ostružné, je pětašedesátiletý obtloustlý pán s laskavýma očima, který vám osobně vyjde naproti až na náměstí, potřese vám rukou všem čtyřem včetně Mer, což tady zjevně není samozřejmé, a nechá vám donést svařené víno dřív, než si sundáte pláště."},{"k":"p","t":"Je to milý člověk. To je to nejhorší na něm."},{"k":"p","t":"„Tři sta,&quot; řekne, „a nebudu vám je krátit, ani kdyby to trvalo dýl, protože jsme si to tak podali a my si tady na slovo potrpíme.&quot;"},{"k":"p","t":"Ukáže vám sklárnu zvenku. Ukáže vám dílny. Ukáže vám hotové zboží — poháry, tabulky, lahvičky, a je to nádherná práce, taková, na jakou se dívá i člověk, kterého sklo nezajímá."},{"k":"p","t":"A pak vás vezme na dvůr, kde stojí nízká kamenná budova bez oken, zapuštěná do svahu, se dvěma dveřmi a jedním zámkem, a řekne:"},{"k":"p","t":"„A tohle je sklad. Tam vás pustím zítra, až se vyspíte, protože tam se nechodí unavený.&quot;"},{"k":"p","t":"Karibrk se zeptá, co se tam skladuje."},{"k":"p","t":"Bervoj Hlaváč se usměje tím laskavým způsobem a odpoví:"},{"k":"p","t":"„Zákaznický majetek.&quot;"},{"k":"hr"},{"k":"p","t":"Odcházíte přes dvůr a Karibrk se ještě jednou otočí, protože z těch dveří jde ven <strong>chlad</strong>, a to je špatně; sklepy pod hutí bývají teplé."},{"k":"p","t":"A ve chvíli, kdy se otáčí, přeběhne kolem rohu holka. Čtrnáct, možná patnáct, hubená, rychlá, a <strong>pod paží nese husu</strong>, která protestuje, jak jenom husa umí. Za rohem se ozve: „Zase! Ula! Zase!&quot; a kroky, které to nemyslí vážně."},{"k":"p","t":"Sandor se za ní podívá."},{"k":"p","t":"Podívá se <strong>dlouho.</strong>"},{"k":"p","t":"Karibrk to zaznamená a neřekne nic, protože vy si tyhle věci neříkáte."},{"k":"hr"},{"k":"p","t":"Na večeři v hostinci U Foukače jsou tři chody a je to nejlepší jídlo, které kdo z vás za poslední rok viděl."},{"k":"p","t":"Tina mluví za všechny, protože to umí. Mer nejí a Mer pozoruje: <strong>v téhle hospodě sedí čtrnáct lidí a nejmladšímu z nich je čtyřicet.</strong> Sandor jí a mlčí. Dědek sedí u okna zády k místnosti a od chvíle, co jste přešli hradbu, neřekl <strong>ani slovo</strong>, což se za devět let stalo dvakrát a ani jednou to neskončilo dobře."},{"k":"p","t":"A když jde hostinská kolem s džbánem, Karibrk se jí zeptá na tu holku s vědrem u brány."},{"k":"p","t":"Hostinská se zastaví. Přemýšlí, jak to říct hostům."},{"k":"p","t":"A pak to řekne způsobem, jakým se mluví o něčem, co je všem líto a nikdo s tím nic nenadělá:"},{"k":"p","t":"„Á. To je ta naše. Tu si klidně vemte, když budete potřebovat posluhovat — vodu, dříví, co je potřeba. Cech ji nikam nezařadil.&quot;"},{"k":"p","t":"„Proč ne?&quot;"},{"k":"p","t":"„Protože je <strong>vadná</strong>, pane.&quot; Řekne to laskavě. Řekne to soucitně. „Jí se to nepovedlo. Ona jediná.&quot;"},{"k":"p","t":"A jde dál nalévat."}],"id":"ostr-07","era":"Ostružná"},{"title":"VIII. DVĚ PÁRY","blocks":[{"k":"h2","t":"VIII. DVĚ PÁRY"},{"k":"p","t":"V devět večer jde Karibrk ven, protože v tom teple neusne a protože potřebuje slyšet vlastní myšlenky bez patnácti lidí kolem."},{"k":"p","t":"Mráz mu vlítne do plic jak facka. Náměstí je prázdné, sníh modrý od sklárny nad městem, a na okraji kašny — té s tím vytesaným heslem — sedí ta malá holka a nedělá vůbec nic."},{"k":"p","t":"Nemá kabát. Má na sobě všechno, co má."},{"k":"p","t":"Ona ho uvidí. Nezvedne se. Nezalekne se tentokrát, protože je tma a ona si asi myslí, že v tmavém nebude vidět, co dělá."},{"k":"p","t":"Ale je zima, a ona dýchá."},{"k":"p","t":"A nad její hlavou stoupá ta jediná pára v Ostružné, malinká, každé dvě vteřiny, a ona si toho všimne asi po páté a <strong>zase si dá ruku před pusu.</strong>"},{"k":"hr"},{"k":"p","t":"Karibrk de Vill, čaroděj čtvrté úrovně, nekromant, hobit, který sesílal věci, jimž nikdo v tomhle kraji neumí ani říct jménem, stojí tři kroky od devítiletého dítěte a nemá nejmenší ponětí, co se v takové situaci dělá."},{"k":"p","t":"Tak udělá to jediné, co ho napadne, a napadne ho to dřív, než si to stačí zakázat."},{"k":"p","t":"<strong>Nadechne se a vydechne.</strong> Naplno. Do mrazu."},{"k":"p","t":"Nad jeho hlavou vystoupá obláček páry, velký a hloupý a nepřehlédnutelný."},{"k":"p","t":"Holka spustí ruku."},{"k":"p","t":"Podívá se na jeho. Podívá se na svůj."},{"k":"p","t":"A pak — velmi opatrně, jako když se zkouší led — <strong>dýchne znova. Schválně.</strong>"},{"k":"p","t":"Aby tam byly dva."},{"k":"hr"},{"k":"p","t":"Stojí tam takhle asi dvě minuty. Nikdo nic neřekne. Nikdo nikoho na nic neupozorní. Dva idioti u kašny, kteří na sebe dělají páru a dívají se, jak jim to stoupá nahoru a mizí."},{"k":"p","t":"Když se jí to podaří obzvlášť velké, tak se <strong>usměje</strong> — jednou, krátce, a hned to zase schová."},{"k":"p","t":"A Karibrk cítí něco, co nedokáže pojmenovat a co ho vzápětí naštve, protože on umí pojmenovat úplně všechno, to je jeho práce."},{"k":"p","t":"Cítí, že tady stojí dva stejní."},{"k":"p","t":"Ona je jediný člověk v tomhle městě, který <strong>smí umřít</strong>, a naučili ji, že to je ta vada. On je jediný člověk v tomhle městě, který <strong>chce umřít</strong>, a čtyřicet let mu to nikdo nedovolil."},{"k":"p","t":"Jsou to dvě poloviny jedné věci a ani jeden z nich to nikdy takhle nevysloví."},{"k":"hr"},{"k":"p","t":"Nakonec se zvedne ona, protože jí je zima, a Karibrk už otevře pusu, aby něco řekl — cokoli, „jak se jmenuješ&quot; by stačilo — a nestihne to, protože ona udělá tři kroky k brance a <strong>pak se otočí.</strong>"},{"k":"p","t":"Ohlédne se."},{"k":"p","t":"To se ohlížejí děti, které čekají, že za nimi někdo půjde."},{"k":"p","t":"Zvedne ruku k puse, dýchne do dlaně naposledy, tak, aby to viděl —"},{"k":"p","t":"— a zmizí ve dveřích."},{"k":"hr"},{"k":"p","t":"Karibrk zůstane stát u kašny ještě dobrou čtvrthodinu a mrzne a nevšimne si toho."},{"k":"p","t":"Nad ním, na kopci, hoří sklárna, která nezhasla osmdesát let."},{"k":"p","t":"Pod ním, ve svahu, stojí kamenná budova bez oken, ze které jde chlad, a v ní je zákaznický majetek."},{"k":"p","t":"A v kapse má složenou smlouvu, ve které je mezi revizí skladu a dohledem nad chlazením napsaná jedna položka, kterou si přečetl a obrátil stránku."},{"k":"p","t":"<em>jedna vadná k odstranění</em>"}],"id":"ostr-08","era":"Ostružná"},{"title":"IX. RÁNO","blocks":[{"k":"h2","t":"IX. RÁNO"},{"k":"p","t":"Ráno vás Bervoj Hlaváč vezme ke skladu, odemkne a podrží dveře."},{"k":"p","t":"Uvnitř je zima jak v hrobce a je tam ticho, které je hutnější než ticho."},{"k":"p","t":"A na policích, od podlahy až ke stropu, v řadách, na kterých se za osmdesát let neusadil ani prach, stojí <strong>sklenice.</strong>"},{"k":"p","t":"Tisíce."},{"k":"p","t":"Každá má na sobě štítek s číslem partie. Každá je zapečetěná voskem. Každá je čistá, poctivá, krásná řemeslná práce, na jakou si tohle město stojí."},{"k":"p","t":"A v každé jedné z nich je něčí smrt, kterou tam někdo zafoukal a zavřel, aby ji ten dotyčný nemusel prožít."},{"k":"p","t":"Dědek udělá dva kroky dovnitř, zastaví se, a <strong>poprvé za devět let, co ho znáte, se rozzuří.</strong>"},{"k":"hr"},{"k":"p","t":"<em>Konec prologu.</em>"},{"k":"p","t":"<em>Hra začíná u těch dveří.</em>"}],"id":"ostr-09","era":"Ostružná"},{"title":"MEZIHRA — Tři týdny na jih","blocks":[{"k":"h2","t":"Mezihra mezi Ostružnou a Baldurovou bránou"},{"k":"h2","t":"I. VŮZ"},{"k":"p","t":"Vyjeli za svítání, protože Sandor tvrdil, že se z každého města má odjíždět tak, aby ho člověk viděl ještě jednou za sebou, a Tina tvrdila, že to je pitomost, a přesto vstala první. Vůz koupili ve Vlčnově od chlapa, který jim k němu se zoufalou upřímností řekl, že to je nejhorší vůz v kraji a že za ty peníze stojí leda tak dřevo. Sandor mu za něj zaplatil bez smlouvání a pak strávil dva dny tím, že mu vyměnil obě zadní kola, srovnal oj a vyspravil korbu prkny, která odněkud vzal a nikdo se neptal odkud. Když skončil, byl to pořád nejhorší vůz v kraji, ale byl to jejich nejhorší vůz v kraji, a to je rozdíl."},{"k":"p","t":"Elie ho pojmenovala Brambora."},{"k":"p","t":"„To není jméno pro vůz,\" řekl Dědek."},{"k":"p","t":"„Je hnědá a je nemotorná a nikdo ji nechce, dokud nemá hlad.\""},{"k":"p","t":"Dědek otevřel pusu, zase ji zavřel a pak řekl to jediné, co za devět let řekl jako pochvalu: „Tak jo.\""},{"k":"p","t":"Ula seděla vzadu se Skořápkou pod paží a celé první dopoledne se nehnula. Nedívala se dozadu na Ostružnou, ani jednou. Dívala se dopředu na cestu tak soustředěně, jako by čekala, že se každou chvíli ztratí."},{"k":"p","t":"Karibrk to viděl a nic neřekl."},{"k":"p","t":"Ve druhé hodině jízdy se Ula zeptala: „Kam vlastně jedeme?\""},{"k":"p","t":"„Do Baldurovy brány,\" řekla Tina. „Tři týdny. Možná čtyři, jestli budou brody vysoko.\" „A co tam je?\""},{"k":"p","t":"Tina se zamyslela, jak to popsat holce, která za třiapadesát let neviděla nic než jedno město s pecí."},{"k":"p","t":"„Lidi,\" řekla nakonec. „Strašně moc lidí.\""},{"k":"p","t":"Ula chvíli mlčela. Pak se zeptala: „A ty tam byla?\""},{"k":"p","t":"„Dvakrát.\""},{"k":"p","t":"„A nezabili tě?\""},{"k":"p","t":"„Zkoušeli to,\" řekla Tina spokojeně. „Ale já jsem rychlejší.\""},{"k":"h2","t":"II. PRVNÍ NOC"},{"k":"p","t":"První noc tábořili ve smrkovém lese, tři hodiny jízdy od Ostružné, protože Mer trvala na tom, že se první den nikdy nejezdí daleko. „Když se něco pokazí, chceš to zjistit blízko od místa, které znáš,\" řekla, a nikdo se nehádal, protože Mer měla v takových věcech pravdu vždycky. Sandor uvařil kaši s medem."},{"k":"p","t":"Ula ji snědla a pak dlouho seděla s prázdnou miskou v ruce a tvářila se, jako by ji někdo praštil. „Co je,\" řekl Sandor."},{"k":"p","t":"„Ono to přestalo.\""},{"k":"p","t":"„Co přestalo.\""},{"k":"p","t":"„Ten hlad.\" Řekla to skoro obviňujícím tónem. „Já jsem se najedla a on přestal. To se dělá vždycky?\""},{"k":"p","t":"Sandor si otřel ruce do zástěry a odpověděl jí přesně tak vážně, jak si ta otázka zasloužila. „Vždycky. A když to udělá kaše s medem, tak je to dobrá kaše.\""},{"k":"p","t":"Ula si vzala ještě dvakrát a potřetí, a pak jí bylo špatně, a Mer jí vysvětlila, že tohle je taky součást té věci — že tělo má hranici a že se ta hranice musí najít omylem, jinak by to nebylo poctivé. Ula zvracela za stromem a přitom se smála a Sandor jí držel vlasy a nadával na med. Elie u toho seděla u ohně, kolena pod bradou, a dívala se na ni s výrazem člověka, který vidí zázrak a nechce ho vyplašit."},{"k":"h2","t":"III. KARIBRK A ELIE — KOLIK JE HVĚZD"},{"k":"p","t":"Elie nespala. Sedla si k ohni vedle Karibrka a chvíli oba mlčeli tím způsobem, který mezi nimi fungoval od kašny."},{"k":"p","t":"„Já vám můžu položit otázku?\" řekla nakonec."},{"k":"p","t":"„Můžeš mi jich položit tolik, kolik chceš. Já ti na některé neodpovím a řeknu ti, že neodpovím, ale lhát ti nebudu.\""},{"k":"p","t":"Elie si to přebrala a kývla, jako by uzavírala obchod."},{"k":"p","t":"„Kolik je hvězd?\""},{"k":"p","t":"Karibrk zvedl hlavu. Nad smrky stálo nebe tak vymrzlé a čisté, jak umí být jenom na severu, a Mléčná dráha vypadala jako otisk palce v mouce."},{"k":"p","t":"„To nikdo neví.\""},{"k":"p","t":"„Ale někdo je musel spočítat.\""},{"k":"p","t":"„Zkoušelo se to. Ve městě, kde jsou knihovny — jsou to takové domy plné knih, uvidíš jednu, jestli budeme mít cestou štěstí — sedávali chlapi, kteří počítali hvězdy celý život a umřeli u toho, a pokaždé jim vyšlo jiné číslo.\""},{"k":"p","t":"„Proč?\""},{"k":"p","t":"„Protože je jich moc a protože ta obloha se hýbe. A protože,\" dodal, „některé z nich už tam nejsou. To světlo jde tak dlouho, že když se díváš na hvězdu, tak se někdy díváš na něco, co dávno shořelo.\""},{"k":"p","t":"Elie na to koukala hodně dlouho."},{"k":"p","t":"„Takže se dívám na někoho mrtvého.\""},{"k":"p","t":"„Na něco mrtvého.\""},{"k":"p","t":"„To je smutné.\""},{"k":"p","t":"„To je,\" řekl Karibrk. „A přesto se na to lidi dívají rádi a nikoho nenapadlo přestat.\" Elie si dala ruku před pusu, jak to dělala, ale tentokrát ne proto, aby si zakryla dech — zívla. „Já si myslím,\" řekla přes dlaň, „že to není smutný. To je jako když někdo pořád svítí, i když už tam není.\""},{"k":"p","t":"Karibrk de Vill, čaroděj šesté úrovně, nekromant, čtyřicet let v oboru, na to neuměl říct vůbec nic."},{"k":"h2","t":"IV. CO SE STANE, KDYŽ SE ZEPTÁŠ POUTNÍKA NA CESTU"},{"k":"p","t":"Čtvrtý den je na Obchodní stezce dohonil poutník."},{"k":"p","t":"Byl to mladík v pořádných botách a s tváří člověka, kterému nikdy nikdo neřekl, ať už mlčí, protože kdyby mu to někdo řekl, tak by se zeptal proč."},{"k":"p","t":"„Hej!\" zavolal. „Hej! Vy tam! Jedete na jih?\""},{"k":"p","t":"„Jedeme,\" řekla Tina."},{"k":"p","t":"„To je dobře, protože já taky. Hej. Hej! Vy máte vůz?\""},{"k":"p","t":"„Máme vůz.\""},{"k":"p","t":"„A já nemám vůz. Hej. Je to dlouhá cesta, viďte? Hej. Jak dlouhá?\""},{"k":"p","t":"Jel s nimi hodinu a půl a za tu dobu položil sto sedmdesát čtyři otázek. Dědek je počítal, protože Dědek počítá věci, a když u sto sedmdesáté čtvrté řekl nahlas „sto sedmdesát čtyři\", poutník se poprvé zarazil a zeptal se, co to znamená."},{"k":"p","t":"„To znamená, že příští bude sto sedmdesát pátá,\" řekl Dědek."},{"k":"p","t":"„Aha. Hej. A proč to počítáš?\""},{"k":"p","t":"„Sto sedmdesát pět.\""},{"k":"p","t":"Sandor zastavil vůz, sundal poutníka za límec z korby, postavil ho na cestu, dal mu do ruky bochník chleba a řekl: „Běž rovně a nezastavuj se, dokud neuvidíš vodu.\" Poutník se na chleba podíval, na Sandora se podíval, a odešel na jih. Když už byl daleko, otočil se a zakřičel přes rameno: „HEJ! A JAK DALEKO JE TA VODA?\""},{"k":"p","t":"Ula se smála tak, že málem spadla z vozu. Byl to první smích, který kdo z nich od ní slyšel, a Sandor kvůli němu zastavil vůz ještě jednou, aby si ho poslechl celý. V. PÍSMENA"},{"k":"p","t":"Šestý den pršelo a Elie nemluvila, protože v dešti nikdy nemluví, a tak jí Karibrk podal brk. Seděli pod plachtou na korbě, vůz kodrcal, Tina řídila a nadávala na bláto, a Karibrk položil mezi ně kus pergamenu, umočil brko a napsal na něj jedno jediné slovo."},{"k":"h2","t":"ELIE"},{"k":"p","t":"Ukázal na první písmeno. Řekl jeho jméno. Ukázal na druhé."},{"k":"p","t":"Elie na to zírala tak, jak zírala na tu kaši s medem Ula."},{"k":"p","t":"„To jsem já?\""},{"k":"p","t":"„To je tvoje jméno napsané. Kdyby to někdo za sto let našel, tak bude vědět, že jsi byla.\" Vzala mu brko z ruky a udělala první písmeno sama. Bylo křivé, moc velké a inkoustu bylo na to pětkrát víc, než bylo potřeba."},{"k":"p","t":"Bylo to nejhorší E, jaké kdy Karibrk viděl, a on viděl kopie netherijských svitků psané rukou umírajících."},{"k":"p","t":"Nechal si ten pergamen. Neřekl proč a nikdo se neptal, protože ta parta se na takové věci neptá."},{"k":"p","t":"Do večera uměla celé své jméno. Osmý den uměla napsat ULA, SANDOR a KAŠTAN a odmítla se učit slovo VADNÁ, protože Karibrk odmítl jí ho napsat."},{"k":"p","t":"„Proč ne?\""},{"k":"p","t":"„Protože to není slovo. To je něco, co si o tobě někdo vymyslel, a to se nepíše, to se zahazuje.\" Elie chvíli přemýšlela a pak řekla: „Tak mi napiš něco, co jsem.\""},{"k":"p","t":"Karibrk umočil brko a napsal:"},{"k":"h2","t":"ELIE, KTERÁ DÝCHÁ"},{"k":"h2","t":"VI. DRYÁDA U BRODU"},{"k":"p","t":"Jedenáctý den narazili u brodu na dub, který jim odmítl dovolit projít. Přesněji: z dubu vystoupila dryáda, měřila si je od hlavy k patě a oznámila jim, že na druhou stranu se přechází za poplatek. Poplatek byl „něco živého, co roste\". Tina navrhla Skořápku. Ula ji chytla oběma rukama a řekla první sprosté slovo, které kdy Elie slyšela, a Mer musela vysvětlovat, co to slovo znamená, a pak vysvětlovat, proč se nemá říkat, a pak vysvětlovat, proč to Tina říká pořád."},{"k":"p","t":"Nakonec to vyřešil Sandor: podal dryádě pytlík cibulových semínek, který vozil od jara, protože „člověk nikdy neví\"."},{"k":"p","t":"Dryáda si semínka prohlédla, přičichla si k nim a zeptala se, co z toho bude. „Cibule.\""},{"k":"p","t":"„A k čemu je cibule?\""},{"k":"p","t":"„Do všeho,\" řekl Sandor. „Bez cibule to nemá cenu vařit.\""},{"k":"p","t":"Dryáda o tom uvažovala tak dlouho, že Kaštan stihl usnout na Merině rukávu. Pak řekla: „Přejděte,\" a zmizela v dubu, a když se ohlédli z druhého břehu, rostly kolem toho dubu už tři cibule, protože dryády nemají trpělivost."},{"k":"p","t":"Elie si o tom celý večer povídala. Dryáda byla první bytost v jejím životě, která byla podivnější než ona sama, a to jí — jak řekla nahlas u ohně — „udělalo strašně dobře\". VII. TINA UČÍ ELII KRÁST A JE Z TOHO HÁDKA"},{"k":"p","t":"Třináctý den, v Liamově tvrzi na Obchodní stezce, naučila Tina Elii přeříznout měšec. Neudělala to potají. Udělala to na tržišti, nahlas, s vysvětlením, a Elie odešla od stánku s kořením s pěti měďáky, které nebyly její."},{"k":"p","t":"Karibrk se otočil na Tinu a poprvé za jedenáct let na ni zvýšil hlas. Hádka trvala dvacet minut a byla ošklivá. Tina tvrdila, že holka, která umí vzít, se nedá vyhladovět. Karibrk tvrdil, že holka, kterou chytnou, přijde v Baldurově bráně o ruku, a že Tina to ví. Mer se do toho nepletla. Sandor stál mezi nimi a nic neříkal a to bylo horší než kdyby křičel. Skončilo to tak, že Elie ty měďáky vrátila."},{"k":"p","t":"Šla k tomu stánku sama, položila je na pult a řekla — chraptivě, potichu, protože bylo teplo a mohla mluvit — že si je vzala a že to nebylo správné."},{"k":"p","t":"Kořenářka se na ni podívala, pak na tu partu za ní, pak zase na ni. A pak jí ty měďáky dala zpátky a přidala k nim skořicovou tyčinku a řekla: „Za poctivost, holka.\" Elie ji rozlomila na dva kusy a jeden dala Ule."},{"k":"p","t":"Tina si pak sedla na kraj vozu a dlouho mlčela a nakonec řekla Karibrkovi: „Já jsem to myslela dobře.\""},{"k":"p","t":"„Já vím.\""},{"k":"p","t":"„Ale bylo to blbě.\""},{"k":"p","t":"„Bylo.\""},{"k":"p","t":"„To se mi teda dneska nepovedlo.\""},{"k":"p","t":"„Ne,\" řekl Karibrk. „Ale ona to spravila líp, než bysme to spravili my dva dohromady, a to bys měla vzít v úvahu, než začneš chlastat.\""},{"k":"p","t":"Tina začala chlastat."},{"k":"h2","t":"VIII. MER A ULA — O TOM, KAM SE JDE"},{"k":"p","t":"Patnáctý den se Ula zeptala Mer, jestli teď umře."},{"k":"p","t":"Zeptala se na to úplně věcně, když Mer čistila Kaštanovi kůži, a Mer jí odpověděla stejně věcně, protože Mer neumí nic jiného."},{"k":"p","t":"„Ano. Jednou.\""},{"k":"p","t":"„Kdy?\""},{"k":"p","t":"„To nevím. Nikdo to neví a kdo tvrdí, že to ví, ten lže nebo prodává.\" Ula chvíli přemýšlela. „A kam se jde?\""},{"k":"p","t":"Mer odložila hadr."},{"k":"p","t":"„Můj Pán se jmenuje Kelemvor,\" řekla. „Není to hodný bůh a není to zlý bůh, je to spravedlivý bůh, což je něco úplně jiného a většinou horšího. Kdo umře, ten jde k němu. On se podívá, co s tím životem člověk dělal, a podle toho ho zařadí. Nekřičí, netrestá, nesmlouvá. Zapíše.\" „A když někdo neví, co dělal?\""},{"k":"p","t":"„Tak se ho zeptá.\""},{"k":"p","t":"Ula si to nechala projít hlavou. Pak řekla: „Já jsem třicet devět let kradla jídlo, který jsem nemohla sníst.\""},{"k":"p","t":"„To vím.\""},{"k":"p","t":"„To bude v tom zápisu blbě vypadat.\""},{"k":"p","t":"Mer se poprvé za tu cestu usmála."},{"k":"p","t":"„Ula. Ty jsi třicet devět let kradla jídlo, který jsi nemohla sníst, protože ti někdo vzal možnost se najíst. To nebude vypadat blbě. To bude vypadat jako účet, a ten účet nebude tvůj.\" IX. VOLO A KUŘE, KTERÉ BYLO KOUZELNÍK"},{"k":"p","t":"Sedmnáctý den potkali u Bezpečné zátoky chlapa v příliš dobrém klobouku, který si o sobě myslel, že je slavnější, než byl, a byl slavnější, než si zasloužil."},{"k":"p","t":"Představil se jako Volothamp Geddarm a během devadesáti vteřin jim nabídl k prodeji vlastní knihu, opravil Tinu ve věci polohy Vlčnova (mýlil se), Karibrka označil za „elfího dítěte\" (Karibrk mu na to neodpověděl a Sandor musel odejít za vůz), a Elii dal zdarma výtisk Volova průvodce Meči pobřeží, protože, jak řekl, „mladá čtenářka je investice\"."},{"k":"p","t":"Elie ho neuměla přečíst. Nesla ho tři týdny pod paží a naučila se z něj tři slova. S Volem cestoval kohout."},{"k":"p","t":"„To není kohout,\" řekl Volo urazeně. „To je Melicamp. Je to kouzelník. Došlo k nehodě.\" Kohout se na ně podíval s výrazem, který se dal popsat jedině jako hluboká profesní frustrace."},{"k":"p","t":"Mer si k němu klekla, dvěma prsty se mu dotkla hrudi a chvíli mlčela. „On to fakt je,\" řekla pak."},{"k":"p","t":"„Cože?\" řekl Karibrk."},{"k":"p","t":"„Tomu kohoutovi je čtyřicet dva let a má lidskou duši. Já se nepletu.\" Karibrk strávil zbytek dne tím, že Melicampovi kladl odborné otázky a kohout na ně odpovídal kýváním a jednou zakokrhal způsobem, který — a Karibrk na tom trval — byl jednoznačně nadávka v jazyce, který kohouti neznají."},{"k":"p","t":"Melicampa neopravili. Nikdo z nich nebyl transmutant a Karibrk odmítl na tom experimentovat s

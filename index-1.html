tvá sestra nikomu nepomůže, zatímco živá může přivést pomoc. Na odchodu mu Ula řekla, že mu nikdy neřekne tati, protože měla jednoho a ten ji prodal — ale že to není tím, že by jí nestál za to."},{"k":"p","t":"Třetí den patřil řemeslu: výběr kouzel (Roztříštění, Ohnivá koule, Animace mrtvých, obrany, Mluvení s mrtvými), silnější přisluhovač z formule Věrná hlína a kost, Meřiny obvazy ve voskovaném plátně a pátá lahvička z tmavého skla, na kterou se nikdo neptal. Tina přinesla stopu: staré sklepení pod bývalou koželužnou u západní zdi, kde se prý propadla podlaha a kde se poslední měsíc dvakrát v noci svítilo."},{"k":"p","t":"Poslední ráno se loučili po svém. Sandor čtrnácti slovy a příkazem Ule, ať cvičí dál. Tina přezkoušením pravidel a šedou nenápadnou stužkou pro případ, že tu barevnou bude muset hodit do řeky. Mer modlitbou a větou, že obě mají před sebou strašně moc let — a že to není víra, ale řemeslo. Karibrk dal Elii dřevěnou kravičku z mauzolea jako úkol: dožít se toho, aby mu ji mohla vrátit. Rocky mu na odchodu položil ruku na rameno a řekl, že půda si pamatuje."},{"k":"p","t":"Vyšli za rozbřesku. Na hřebeni nad Baldurovou bránou se Karibrk zastavil, zapálil si brko a řekl jediné slovo. U brány nazval jejich výpravu rodinnou záležitostí — někdo z těch našich se špatně chová — a strážný je pustil dovnitř. Město je pohltilo během dvaceti kroků. Zamířili k západní zdi."}],"id":"nez-vyjdeme","era":"Baldurova brána","d0":30,"d1":33},{"title":"Pýcha Mlazivoje Vaelora","blocks":[{"k":"h2","t":"Pýcha Mlazivoje Vaelora"},{"k":"p","t":"Cestou domů narazil Karibrk v Soukenické uličce na samozvaného arcimága, který veřejně terorizoval švadlenu a její dvě děti kvůli dluhu šesti zlatých - celá ulice přihlížela ze zavřených oken, nikdo se neodvážil zasáhnout. Karibrk nejdřív nabídl dluh zaplatit a odejít v klidu. Vaelor to odmítl tím nejhrubším způsobem a prohlásil rodinu za svůj majetek, dokud dluh nesplatí i s úrokem za \"drzost\"."},{"k":"p","t":"Facka projela skrz Zrcadlový obraz. Vaelor, uražený, že se ho vůbec někdo dotkl, zaútočil doopravdy - na zabití. Karibrk ho v krátkém, brutálním souboji rozdrtil: Roztříštění smetlo jeho iluze, Mrazivý dotyk ochromil ruku. V poslední milivteřině před smrtící ranou se zastavil - pomyslel na Elii a spustil místo toho jen veřejné ponížení."},{"k":"q","t":"„Ty nejsi mág. Ty seš kluk s drahým hábitem a s odznakem, kterej sis nejspíš koupil, ne vysloužil.\""},{"k":"p","t":"Rodina byla zachráněna, dluh zaplacen z Karibrkovy kapsy. Vaelor zůstal naživu, ponížený před celou ulicí, se zlomenou pýchou a tichou touhou po pomstě. Karibrk se nepředstavil - Vaelor zatím nezná jeho jméno ani adresu."}],"id":"vaelor","era":"Baldurova brána","d0":36,"d1":36},{"title":"BEZEJMENNÁ","id":"bezejmenna","era":"Baldurova brána","d0":34,"d1":35,"blocks":[{"k":"p","t":"Koželužna padla ve čtvrtek v noci. Osm set šest vykopaných děr, komora, kněz, hlína dovezená po pytlích z celého kraje — všechno leží pod třemi sáhy kamene a nikdo se k tomu nikdy nedostane. Tina si z komory odnesla zamčenou truhlici s okovaným víkem, protože bylo rychlejší ji vzít než otevřít, a pak na ni všichni na tři dny zapomněli."},{"k":"p","t":"V pátek ráno leželo u devátého rituálního bodu tělo, které nikdo nezabil. Žádná rána, žádná krev, zavřené oči, otřené ruce, hlína urovnaná dlaní a v ní ani jedna stopa nohou. Karibrk se ho zeptal, protože to umí, a mrtvý muž mu dal adresu, jméno informátora a jednu větu, která se pak celý den nedala vyhnat z hlavy: že za ním nikdo nestál a že tam bylo jenom *napsáno*, jako když někdo dopíše slovo a zvedne pero."},{"k":"h2","t":"Tři hodiny ráno, podkroví nad pekařstvím U Tří klasů"},{"k":"p","t":"Plán zněl: zmizel a nikdo neví jak. Tichý, čistý, beze stop. Parta ho odhlasovala jednomyslně, poprvé za celou kampaň, a Karibrk ho přijal větou „kurva nerad, ale dobře\", což je u něj nejblíž k pokoře, jak se kdy dostal."},{"k":"p","t":"Pod dveřmi svítilo světlo. Uvnitř mluvili dva. Jeden hlas byl Ilvosův, unavený a věcný. Druhý byl ženský, mladý, a mluvil tónem někoho, kdo je zvyklý, že se mu odpovídá. A než Karibrk stačil sáhnout na kliku, ten hlas řekl přes dveře: „Neklepej, hobite. Ty stejně nikdy neklepeš.\""},{"k":"p","t":"Zaklepal. Třikrát, pomalu. „Vidíš. Klepu. Jenom mi vadí, komu.\""},{"k":"p","t":"Stála u okna, opřená o rám. Nejvýš pětadvacet, tmavé cestovní šaty bez ozdob, vlasy sepnuté vzadu, na první pohled nic zvláštního. Na druhý pohled oči — **celé černé, od okraje k okraji**, jako dvě kapky inkoustu, a odrážel se v nich plamen svíčky způsobem, jakým se oči odrážet neumějí. Ilvos seděl na kraji postele s tváří v dlaních a v jeho výrazu bylo něco, co organizátor celé hereze mít neměl: strach z vlastní nadřízené."},{"k":"q","t":"„Nehádej moje jméno. Stejně bys ho neuhodl. Ale zeptej se mě na cokoliv — dneska v noci ti odpovím na první tři otázky pravdivě, ať se ti to bude líbit, nebo ne.\""},{"k":"p","t":"Karibrk si sedl na jedinou volnou židli, protáhl krk, rozhlédl se po místnosti, jako by odhadoval, jestli by se to tu vyplatilo koupit, a poznamenal k Ilvosovi, že pořád žádné chlebíčky. Pak si ubalil poslední dávku Karibrkova kydajícího brku, zapálil, potáhl a při výdechu si upřímně ulevil: „Konečně.\" Teprve potom se na ni podíval a položil tři otázky, které se neptají na plán, ale na kostru: **jaká je tvoje největší slabost, kdo je na vrcholu téhle pyramidy, a jak se na takovou bytost útočí.**"},{"k":"h2","t":"Tři pravdy"},{"k":"p","t":"**První.** Není bohyně. Když Bhaal zemřel poprvé — dřív než všichni ti bhaalspawni, o kterých se píše v knihách — jeho podstata se neroztříštila jenom do smrtelných dětí. Malá část neměla kam jít. Žádné tělo, žádný nárok. **Zbytek beze jména a beze schránky.** To je ona. Existuje, protože v ni lidé věří; čím víc jich věří, tím je skutečnější. Mečem se nedá zabít, protože není dost tělo, aby to mělo smysl. Dá se **rozvěřit** — vzít lidem důvod, ne těla. Přesvědčování je proti ní účinnější než ohnivá koule."},{"k":"p","t":"**Druhá.** Na vrcholu není nikdo. Žádný trůn, žádné jméno. Je tam jenom **hlad** — starší než bohové, starší než smrt sama, ten, co dal Bhaalovi vůbec chuť stát se bohem vraždění. Vyhaslá číše jsou jeho nejzoufalejší a nejzpackanější vyznavači, protože jsou jediní, kdo se ho pokoušejí nakrmit omylem, ne obětí."},{"k":"p","t":"**Třetí.** Nejúčinnější zbraň proti takovým bytostem není meč, oheň ani kouzlo. Je to **přesný zápis**. Smrtelníci mají jednu věc, kterou ony nemají: můžou rozhodnout, co je pravda o tom, co se stalo. Kdyby do každé cedulky v té komoře napsal skutečné jméno člověka s dětmi a domem se zeleným rámem, přestala by to být půda pro ni. Byla by to jenom smutná louka. „Ty jsi tohle už jednou udělal, viď? V tom sklářským městě. S tou knihou.\""},{"k":"h2","t":"Čtvrtá pravda, kterou nikdo nechtěl"},{"k":"p","t":"Karibrk jí místo čtvrté otázky řekl, že je krásná, a zeptal se na Lorda Aa. Ona se nezasmála. Řekla, že ji mortalové chválí za krásu tak často, že ji to dávno přestalo těšit — tohle je tvar, vybraný, ne narozený. „Kdybys mě viděl v tom, co jsem doopravdy, neřekl bys mi krásná. Řekl bys mi **prázdná**, a měl bys pravdu.\" A pak dodala, že to přesto bere jako kompliment, protože ho řekl navzdory tomu, co je, ne kvůli tomu — a že to je vzácnější, než čeká."},{"k":"p","t":"Je vázaná pravidly. Jedno z nich zní: co řekne třikrát pravdivě v jedné noci, platí navěky. Čtvrtou pravdu neřekla na otázku, ale z vlastní vůle, a to ji zavazuje jinak a dráž."},{"k":"q","t":"„Elie a Ula přestávají být pro tuhle herezi zajímavé od dnešní noci.\""},{"k":"p","t":"Ne ze strachu a ne kvůli krásné řeči. Protože jí ukázal něco, co hledala osmdesát let a nenašla to v žádném z osmi set šesti jmen: smrtelníka, kterého nezajímá, jestli vyhraje — zajímá ho jenom, jestli přežijí oni. To je prý vzácnější než rezonance i než anomálie. Stahuje svou ruku: žádná další vidění pro Ilvose, žádná síla za jeho slovy, žádné sny, které by někomu říkaly, kde ten dům stojí. Bez ní je z téhle větve jenom muž v podkroví s pár věřícími a bez cíle."},{"k":"p","t":"Co slíbit nemohla: že se nikde jinde nezakouká do dvou holek žádný další blázen. Svět je plný hladu a ona je jenom jeden jeho kousek. Ale ten hlad, který mířil na tenhle dům konkrétně, tou nocí zhasl."},{"k":"h2","t":"A pak to, co udělal Karibrk"},{"k":"p","t":"Hleděl do prázdna tam, kde ještě před chvílí stála, s naprostou jistotou, že ho slyší, byť to nevěděl a pouze tomu věřil. A dal jí svoje slovo: že se pokusí najít způsob, jak ji aspoň dočasně dostat z jejího prázdného stavu do trochu plnější formy. Řekl jí, že stejně jako ony pozorují smrtelníky, mají smrtelníci za ty tisíce let dost přečtené je — a jen by ho zajímalo, jestli je to ze srandy, z nudy, nebo to má hlubší smysl. A že smrtelník, který z vlastní vůle koná jisté věci, je podle jejich vlastních pravidel zasraně mocná věc, která dokáže zbořit i postavit kdejakou kokotinu."},{"k":"p","t":"A pak dodal to jediné, co ho z celé té noci mrzelo: že se jako kokot měl zeptat spíš na jméno než na otázku číslo dvě."},{"k":"p","t":"Vzduch se nezachvěl. Žádné znamení, žádná odpověď. Jenom dohořelý knot a tma — a možná, jenom možná, byla ta tma na chviličku o odstín teplejší, než by měla být."},{"k":"hr"},{"k":"p","t":"Ilvosovi Karibrk neřekl nic. Zeptal se ho „co je ti kurva do toho\", opřel se o kliku a u posledního schodu se otočil zpátky do tmy podkroví s větou „příště ty chlebíčky, jinak—\". Pět vteřin mu pak věnoval ten nejtvrdší pohled, jaký umí, a promítl do něj, že kurva zboří celý vesmír a zničí ho na všech možných úrovních, jestli ho byť jen napadne cokoliv, co by byť jen rozesmutnilo holky. Ilvos to přečetl přesně tak, jak to bylo myšleno. Barva mu odtekla z tváře a jednou pomalu kývl, jako člověk podepisující smlouvu, kterou nikdy neporuší, protože už viděl, co se stane tomu, kdo by to zkusil."},{"k":"p","t":"Dole na dvorku čekala Tina s rukou na jílci. „No?\" — „Je po všem. Doopravdy po všem.\" — „Věříš tomu?\" — „Věřím.\" A poprvé za tři dny to řekl bez jediné pochybnosti v hlase."},{"k":"hr"},{"k":"p","t":"Druhé dobrodružství tím skončilo. Dva dny nato, na cestě domů, potkal Karibrk v Soukenické uličce samozvaného arcimága Mlazivoje Vaelora — ale to už je jiná historka a ta si počká."}]}],"GROUP":[{"era":"Vlčí jáma — před jedenácti lety","items":[{"w":"všichni","t":"Zatopená stříbrná šachta, trestanecká četa, dvanáct lidí na jednom řetězu, osm dní ve vodě po pás. Když jeden upadl, buď ho zbylých jedenáct zvedlo, nebo šli dolů všichni."},{"w":"všichni","t":"Zvedli se navzájem stočtyřicetkrát. Nikdo je nepočítal a všichni to číslo znají. Dvanáct šlo dolů, čtyři vylezli."},{"w":"Sandor","t":"Zvedl řetěz sám třikrát."},{"w":"Karibrk","t":"Byl třetí od kraje. Třetí od kraje počítal dny."},{"w":"Tina","t":"Byla čtvrtá od kraje. Čtvrtá od kraje držela lampu."},{"w":"Mer","t":"Opilá řekla to jediné, co se kodexu blíží: nechráním vás, chráním tu cenu, kterou má můj život od chvíle, co jste mě vytáhli. Nikdo na to nic neřekl."}]},{"era":"Skládání a devět let s Dědkem","items":[{"w":"všichni","t":"Skládali se dva roky, párkrát se rozešli — jednou na rok a půl, jednou na osm měsíců — a nikdy ve zlém."},{"w":"Tina + Dědek","t":"Jméno Dědek mu dala Tina jako urážku. Odpověděl přijímám."},{"w":"Dědek","t":"Za devět let se pětkrát objevil přesně ve vteřině, kdy měl někdo umřít. Jednou v zamčené kobce, jednou na dně strže, jednou vteřinu předtím, než Sandorovi projela hlavou kuše."},{"w":"Sandor + Dědek","t":"Sandor mu pořád dává krajíc, který Dědek nesní, a přesto si ho strká do kapsy. Nikdo neví proč."},{"w":"Mer + Dědek","t":"Mer mu zašívá to mrtvé tělo — loni prasklé zápěstí. Je jediná, kdo to umí tak, aby to drželo."}]},{"era":"Dřívější tažení — příjezd","items":[{"w":"Tina","t":"Sehnala kšeft za tři sta zlatých. Až se to podělá, ponese to — řekla to nahlas už první den."},{"w":"Mer","t":"Položila jedinou správnou otázku dřív, než došli k městu: kdo jim umřel. Za tři sta zlatých se nehledá nový, hledá se náhrada."},{"w":"Karibrk","t":"Vzal to kvůli slovu přeliv, které za čtyřicet let praxe nikdy neslyšel. Podepsali to všichni čtyři, protože kdo nepodepsal, může říct, že u toho nebyl."},{"w":"všichni","t":"Karibrk jediný uviděl, že dvaceti dětem před branou nejde v mrazu pára. Ostatní tři to neviděli."},{"w":"Dědek","t":"U kašny řekl, že heslo není reklama, ale záruka — a přikázal postavit vůz mimo město. Ve skladu se poprvé za devět let rozzuřil."},{"w":"Sandor","t":"První den se dlouho díval za holkou, co utekla s husou. Karibrk to zaznamenal a neřekl nic."}]},{"era":"Dřívější tažení — děti","items":[{"w":"Karibrk + Elie","t":"U kašny na sebe mlčky dýchali do mrazu, aby tam byly dvě páry. Ani jeden to nikdy nepojmenoval."},{"w":"Karibrk + Elie","t":"Čtvrtý den jí řekl čistou pravdu a nabídl bezpodmínečný odchod. Postavila jedinou podmínku: Ula jede taky. Plán party se kvůli tomu změnil ze srovnat město se zemí na cílenou pomstu."},{"w":"Sandor + Ula","t":"Tři dny vařil o porci víc a nechával ji vychladnout na okně. Čtvrtý den to před Elií přiznal nahlas."},{"w":"Sandor + Ula","t":"Dal huse jméno Skořápka a Ule přikrývku."},{"w":"Tina + Elie","t":"Naučila ji otvírat zámek. Elie u toho poprvé křičela radostí, ne strachem."},{"w":"Mer + Ula","t":"Představila jí Kaštana a slíbila ochranu."},{"w":"Dědek + holky","t":"Vyprávěl jim pohádku různými hlasy a slíbil, že to zopakuje, jestli tu ještě bude. Pak je hlídal, zatímco parta šla do města."},{"w":"Karibrk + holky","t":"Dal každé padesát zlatých a únikový plán. Slíbil, že kdyby měl oživit celý hřbitov, aby k nim došel, udělá to a s radostí."}]},{"era":"Dřívější tažení — pátý den","items":[{"w":"Tina","t":"Zjistila o kočáře všechno: kočí tři dny neslézal a nemrkl, kola byla čistá a nikdo neviděl Rozárii přijet."},{"w":"Sandor","t":"Z pekařova kluka dostal to nejdůležitější: děti slyší sklep v břiše a Kubát chodí ke zdi poslouchat. Koupil mu koláč, který neochutná, a kluk ho držel v ruce."},{"w":"Mer + Karibrk","t":"V návratové komoře vyslechli mrtvého kluka. Mer se ptala na tři, Karibrk na dvě. Vyšlo z toho, že drží samo dítě, ne sklo."},{"w":"všichni","t":"Karibrk poprvé za čtyřicet let ukázal půlku medailonu a řekl jim celou nejstarší vzpomínku. Nikdo nic neřekl. Tina jenom kývla, Sandor vytáhl a zase schoval sešitek, Mer řekla: tak proto tě to město sere víc než nás."},{"w":"Tina","t":"Rozhodla dělení před sklepem: Sandor zůstane s holkama, protože je jediný, kdo unese, že tam někdo přijde. Sandor položil nůž na stůl a nic neřekl."}]},{"era":"Márnice — rubrika","items":[{"w":"všichni","t":"Do sklepa se došlo bábinou konvicí o dvou hrdlech: nalít dvakrát a nevypít. Kaštan poprvé za jedenáct let odmítl jít dál."},{"w":"Dědek + Karibrk","t":"Dědek přiznal, že psát nemůže, protože si to nechal vzít, když svůj úřad odevzdával. Pak sám nabídl: ty píšeš, já čtu."},{"w":"Mer","t":"Určila pravidlo, na kterém to celé stálo: zápis není lež ani pravda, zápis je nárok."},{"w":"Tina","t":"Vymyslela přehazovanou s knihou — dokud se kniha hýbe, nepíše se ani nemaže. Na tom se celý boj vyhrál."},{"w":"Karibrk","t":"Napsal do posledního prázdného řádku odběratele místo jména a podepsal se. Tři sta jedna duší odešlo najednou."},{"w":"všichni","t":"Ula řekla na cestě z města své jméno místo čísla. Sandor se musel otočit na druhou stranu."}]}],"TASKS":{"done":["Dohlédnout na přelivy a provést revizi skladu — zaplaceno 300 zl.","Vykoupit Elii a Ulu z města.","Zjistit, kdo rozbíjí schrány — Odval Kmoch.","Dostat se do sklepa — konvice o dvou hrdlech.","Osvobodit 301 dětí — zapsat je do rubriky jménem."],"open":["**Mezihra:** čas s holkama, prodej kořisti, pořádný ekvip pro celou partu.","**Tři prázdné schrány** — Karibrk zatím neřekl, co s nimi.","**Rubrika** — kniha, na jejíž posledním řádku je Karibrkův podpis. Nese ji Dědek.","**Kubátovo starší dítě** — v márnici nebylo. Jediná nezodpovězená otázka z dřívějšího tažení.","**Rozárie Ambrožová** — žije, ví, co Karibrk umí, a má velmi zajímavé roky před sebou.","**Tinin bratr** — Tři mosty, o svatém Havlu, v jedenáctém roce. Za rok a půl.","**Číšníci Vyhaslé číše** — kaciřská frakce bhaalistů, chrám pod městem (mauzoleum Thornwallů u Zlomeného kotle + odtoková štola u rybího trhu), heslo „Číše pije naposled“ platí jen do konce měsíce.","**Označovací úlomek** — přetvořené zádržné sklo, rituál dokončen na 60–70 %. Nestabilní echo stopy na Elii nebo Ule (nejisté které) — musí se odstranit pečlivě, ne narychlo.","**Kdo umí pracovat se zádržným sklem v Baldurově bráně** — stejná úroveň řemesla jako Bervoj Hlaváč. Možná souvisí s Ostružnou.","**Perimetr U Tří vran** — hraniční zádrž (16 kotoučků, ~50 m, 3s zamrznutí nezvaných) hotova a otestována na Volovi. **Další krok:** přes Dědka posílit na plnou bariéru, detaily upřesní hráč."]},"SPELLS":[[0,"Mistrovská ruka","Karibrkova vylepšená ruka — viz Lore"],[0,"Drobná iluze","zvuk nebo obraz na minutu"],[0,"Kouzelná ruka","přízračná ruka, 10 kg, 9 m"],[0,"Jedovatý postřik","1k12 jed (2k12 od 5. úr.), záchrana Odl"],[0,"Mrazivý dotyk","1k8 nekrotické (2k8 od 5. úr.), cíl se nemůže léčit"],[0,"Kyselinový stříkanec","1k6 kyselina, až dva cíle blízko sebe"],[0,"Ochrana před čepelemi","odolnost proti bodnému, sečnému a drtivému do tvého dalšího tahu"],[0,"Hřmící čepel","útok zbraní; když se cíl pohne, 1k8 hrom"],[0,"Praskající šlacha","rozerveš mrtvolu, 1k10 bodné v kruhu 3 m"],[0,"Tančící světla","až čtyři světla, pohybuješ s nimi"],[0,"Ohnivá střela","1k10 oheň, zapálí hořlavé"],[0,"Přátelé","výhoda na Charisma proti jednomu tvoru; pak to pozná"],[0,"Světlo","předmět svítí 6 m na hodinu"],[0,"Mrazivý paprsek","1k8 chlad, cíl −3 m rychlosti"],[0,"Šokující dotek","1k8 blesk, cíl nemá reakci; výhoda proti kovové zbroji"],[0,"Umíráček","1k8 nekrotické, 1k12 když už je cíl zraněný"],[0,"Jistý úder","výhoda na příští útok proti cíli"],[1,"Magická střela","3 střely po 1k4+1, nikdy nemine"],[1,"Štít","reakce, +5 zbroj do začátku tvého tahu"],[1,"Magické brnění","zbroj 13+Obr Ula."},"LORE":[{"id":"u-tri-vran","type":"misto","name":"Poštovní stanice U Tří vran","alias":["U Tří vran","Útočiště","Tři vrány"],"tags":["domov","základna"],"short":"Domov družiny. Hodinu koňmo od Baldurovy brány, odbočka z Obchodní stezky k Soumrakovým vrškům.","body":"Kamenná patrová stanice, která kdysi vyhořela a patnáct let stála prázdná. Karibrk ji koupil od mnicha Aldouse Dorndela za jeden zlatý — vydíráním nabídkou rubriky pro Candlekeep. Dvě vyřezané vrány na ceduli přežily oheň, třetí vyřezal Sandor a domalovala Seska. Hospoda jede jen dva karavanní dny z tendeny. Pozemek uzavírá hraniční zádrž — šestnáct zakopaných skleněných kotoučků, zhruba padesát metrů kolem domu. Pracovní druhé jméno, které používá jen rodina: Útočiště.","src":"hra","mech":{},"lvl":null},{"id":"baldurova-brana","type":"misto","name":"Baldurova brána","alias":["Brána","Baldur's Gate"],"tags":["město","kánon"],"short":"Největší město Meče pobřeží. Uvnitř hradeb asi 42 300 lidí, venku ještě jednou tolik.","body":"Přístavní velkoměsto rozdělené na Horní, Dolní a Vnější město, s hradbami vysokými jako sedm domů a Wyrmovým přechodem přes řeku. Vládnou mu vévodové a pořádek drží Ohnivá pěst. Před rokem město prošlo pádem a chaosem, ze kterého se ještě nevzpamatovalo — a přesně v tom chaosu se pod ním nadechl kult Vyhaslé číše.","src":"kánon","mech":{},"lvl":null},{"id":"horni-mesto","type":"misto","name":"Horní město","alias":["Upper City"],"tags":["čtvrť"],"short":"Bohatá horní část Baldurovy brány za vnitřní hradbou. Paláce, patricijské domy, řády a mágové.","body":"Sem se nikdo zvenčí jen tak nedostane, a kdo se dostane, ten je vidět. Vydává se za jeho obyvatele i Mlazivoj Vaelor, samozvaný arcimág, který se ohání odznakem Zahalených mágů.","src":"kánon","mech":{},"lvl":null},{"id":"dolni-mesto","type":"misto","name":"Dolní město","alias":["Lower City"],"tags":["čtvrť"],"short":"Přístav, trhy, dílny, krámy bez cedule. Tady se dá koupit cokoliv, pokud víš kde.","body":"Leží tu Soukenická ulička, krám jednooké Grizeldy s nekromantskými potřebami, kouzelnický obchod Aldetha Mizeráka a většina lidí, kteří o vás něco vědí. Hustě, hlučně, a nikdo si nikoho nepamatuje déle než den.","src":"kánon","mech":{},"lvl":null},{"id":"vnejsi-mesto","type":"misto","name":"Vnější město","alias":["Outer City"],"tags":["čtvrť","kult"],"short":"Chudinská změť za hradbami. Bez práva, bez hlídek, se spoustou lidí, které nikdo nepostrádá.","body":"Odsud kult Vyhaslé číše bere své lidi — palivo. Leží tu hřbitov Na spálence, koželužna u západní zdi a osm set šest jmen zapsaných v Registru jako budoucí hroby.","src":"kánon","mech":{},"lvl":null},{"id":"hrbitov-na-spalence","type":"misto","name":"Hřbitov Na spálence","alias":["Na spálence"],"tags":["hřbitov","kult"],"short":"Hřbitov ve Vnějším městě. Stálo tu mauzoleum vyhaslého rodu Malcherů.","body":"Nikdo se tu nepohřbívá od doby, co vyhasl poslední rod, který na to měl. Právě proto si ho kult vybral jako překladiště.","src":"hra","mech":{},"lvl":null},{"id":"mauzoleum-malcheru","type":"misto","name":"Mauzoleum rodu Malcherů","alias":["Malcherovi"],"tags":["kult","zničeno"],"short":"Překladiště kultu. Den 29 ho Karibrk zapálil a strop sklepa se propadl.","body":"Nebyl to hlavní stan, ale sklad a tajný vchod: pod podlahou byla skrýš s ústím starých kanálů do katakomb. Uvnitř ležely vyklizené osobní věci obětí (ne lup — vyklizené byty), bedny hrobové prsti a spárované dětské boty. Karibrk odsud odnesl Kámen štěstí, Boty elfí chůze, Registr a dřevěnou kravičku, zbytek zapálil jako vzkaz. Ústí kanálů leží pod třemi sáhy horkého kamene — kult přišel o cestu, družina taky.","src":"hra","mech":{},"lvl":null},{"id":"katakomby","type":"misto","name":"Katakomby pod Baldurovou bránou","alias":["katakomby"],"tags":["kult","nebezpečí"],"short":"Hlavní ležení Bratrstva Vyhaslé číše. Vede sem víc cest, všechny zavalené nebo neznámé.","body":"Kult tam nekope starý hřbitov — zakládá nový na místě, kde nikdy žádný nebyl, aby získal posvěcenou půdu smrti. Sídlí tam bratr Ilvos. Známá cesta (kanály z mauzolea) je zavalená; druhá možná je propadlé sklepení pod koželužnou u západní zdi.","src":"hra","mech":{},"lvl":null},{"id":"kozeluzna","type":"misto","name":"Sklepení pod bývalou koželužnou","alias":["koželužna","západní zeď"],"tags":["stopa","kult"],"short":"Tinina stopa: staré propadlé sklepení u západní zdi Vnějšího města, kde se dvakrát za měsíc v noci svítilo.","body":"Pravděpodobný druhý vchod do katakomb. Zatím neprozkoumáno.","src":"hra","mech":{},"lvl":null},{"id":"ostruzna","type":"misto","name":"Ostružná","alias":["Ostruzna"],"tags":["minulost","sklo"],"short":"Sklářské město v Krkavčí marce, kde se umírající děti vyfukovaly do sklenic. Dohráno.","body":"Osmdesát let tam hořela sklárna a na kašně stálo vytesané U NÁS NIKDO NEUMÍRÁ — ne reklama, záruka. Přeliv zastavil dítěti smrt uvnitř sklenice; hlad a zima zůstaly. Ve sklepě byla sigilská márnice se třemi sty jednou zapsanou duší. Karibrk je vypustil tím, že do rubriky dopsal jména místo čísel.","src":"hra","mech":{},"lvl":null},{"id":"candlekeep","type":"misto","name":"Candlekeep","alias":["Svícmark"],"tags":["knihovna","kánon"],"short":"Pevnost-knihovna na útesu jižně od Baldurovy brány. Vstupné: kniha, kterou ještě nemají.","body":"Karibrk jim slíbil rubriku do jednoho roku, jinak doplatí tržní cenu domu. Rubriku nese Dědek a Dědek je pryč. Aldous Dorndel je tam archivář třetí třídy.","src":"kánon","mech":{},"lvl":null},{"id":"dageruv-brod","type":"misto","name":"Dagerův brod","alias":["Daggerford"],"tags":["minulost"],"short":"Město na Obchodní stezce. Tady Zhentarim unesli Elii a Ulu a tři hodiny mučili družinu.","body":"Družina se nechala schválně zajmout, aby holky neviděly, jak vypadá řešení zvenčí. Plán měl tři chyby a všechny vyšly najevo během první hodiny. Skončilo to na větě o ceně: „Ta menší je vadná, dej ji za šest.“","src":"hra","mech":{},"lvl":null},{"id":"vlci-jama","type":"misto","name":"Vlčí jáma","alias":["Vlci jama"],"tags":["minulost","pouto"],"short":"Zatopená stříbrná šachta, trestanecká četa. Tady se parta poznala před jedenácti lety.","body":"Dvanáct lidí na jednom řetězu, osm dní ve vodě po pás. Když jeden upadl, buď ho zbylých jedenáct zvedlo, nebo šli dolů všichni. Zvedli se navzájem stočtyřicetkrát. Dvanáct šlo dolů, čtyři vylezli.","src":"hra","mech":{},"lvl":null},{"id":"soukenicka-ulicka","type":"misto","name":"Soukenická ulička","alias":["Soukenická"],"tags":["Dolní město"],"short":"Úzká ulice v Dolním městě. Den 36 tu Karibrk potkal a rozdrtil Mlazivoje Vaelora.","body":"Bydlí tu švadlena se dvěma dětmi, kterým Karibrk zaplatil šestizlatový dluh. Celá ulice to viděla ze zavřených oken — a viděla i to ponížení.","src":"hra","mech":{},"lvl":null},{"id":"severni-zila","type":"misto","name":"Severní žíla surového stříbra","alias":["žíla","stříbrná žíla"],"tags":["surovina"],"short":"Žíla na severu, kterou sto let hlídal Rocky. Odsud je stříbro na Rituál zádrže.","body":"Hora kdysi dlužila za těžbu bez navrácení. To, co z toho vracení zbylo, dostalo tvar a hlídalo. Sandor vytěžil, co bylo potřeba, protože Karibrk nechal krumpáč doma naschvál.","src":"hra","mech":{},"lvl":null},{"id":"sigil","type":"misto","name":"Sigil a márnice Dustmanů","alias":["Sigil","márnice"],"tags":["planární","minulost"],"short":"Město bran. Sklep pod Ostružnou byl jeho márnice a portál se třemi sty jednou zapsanou duší.","body":"Pokladníkem tam byl Dustman Odval Kmoch, který schrány sám rozbíjel, aby uspíšil hostům návrat. Rubrika je odtud.","src":"kánon","mech":{},"lvl":null},{"id":"bratrstvo-vyhasle-cise","type":"frakce","name":"Bratrstvo Vyhaslé číše","alias":["Číšníci","Vyhaslá číše"],"tags":["kult","nepřítel"],"short":"Kacířský odštěpek kultu Bhaala. Tak zvrácený, že ho ani normální bhaalisté nepřiznají.","body":"Věří, že Bhaalovu podstatu nejde probudit obyčejnou obětí — potřebují dvě přesné anomálie: bytost, které byla dlužena násilná smrt a unikla jí (Elie), a bytost, které bylo vzato jméno bez zabití (Ula). Jedna z nich prý znamená pohromu pro planetu, obě v jednom rituálu pro všechny říše. Mainstream jim posměšně říká Číšníci, protože sbírají prázdné nádoby. Vede je bratr Ilvos. Mají oko v blízkém okruhu U Tří vran.","src":"hra","mech":{},"lvl":null},{"id":"zhentarim","type":"frakce","name":"Zhentarim","alias":["Černá síť"],"tags":["kánon","nepřítel"],"short":"Obchodní a žoldnéřská síť, která obchoduje se vším včetně lidí.","body":"V Dagerově brodu měli obchodní stanici se sedmi lidmi, jedním kouzelníkem a dvěma psy. Zboží mířilo na jih do Amnu, kde se neptají. Ta stanice už neexistuje.","src":"kánon","mech":{},"lvl":null},{"id":"ohniva-pest","type":"frakce","name":"Ohnivá pěst","alias":["Flaming Fist"],"tags":["kánon","pořádek"],"short":"Žoldnéřská armáda, která v Baldurově bráně dělá městskou stráž. Modré pláště.","body":"Drží hradby a hlavní ulice. Ve Vnějším městě se moc neukazují, což je přesně důvod, proč tam kult může pracovat.","src":"kánon","mech":{},"lvl":null},{"id":"sedm-slunci","type":"frakce","name":"Obchodní dům Sedm sluncí","alias":["Seven Suns"],"tags":["kánon","rivalita"],"short":"Obchodní dům, který nabízel za U Tří vran 450 zlatých a prohrál s jedním zlatým.","body":"Fendrik Kolba varoval: lidi, co prohrajou takhle veřejně, si to pamatujou. Zatím se neozvali.","src":"kánon","mech":{},"lvl":null},{"id":"zahaleni-magove","type":"frakce","name":"Zahalení mágové","alias":["Cowled Wizards"],"tags":["kánon","magie"],"short":"Amnský řád, který hlídá, kdo smí kouzlit a kde. Nesnášejí amatéry, kteří se za ně vydávají.","body":"Mlazivoj Vaelor se jimi ohání a nosí stříbrný kruh s okem. Jestli je odznak pravý, koupený nebo ukradený, zatím nikdo neví — a jestli je pravý, má Karibrk problém navíc.","src":"kánon","mech":{},"lvl":null},{"id":"sklarsky-cech","type":"frakce","name":"Sklářský cech města Ostružné","alias":[],"tags":["minulost"],"short":"Cech, který osmdesát let prodával bohatým pojistku proti smrti.","body":"Vedl ho Bervoj Hlaváč, laskavý pětašedesátiletý pán, což bylo to nejhorší na něm. Zakázka zněla na tři sta zlatých a měla v seznamu úkonů položku „jedna vadná k odstranění“.","src":"hra","mech":{},"lvl":null},{"id":"dustmani","type":"frakce","name":"Dustmani","alias":["Dustmen"],"tags":["kánon","planární"],"short":"Sigilská frakce přesvědčená, že život je jen falešný stav a smrt je návrat.","body":"Odval Kmoch byl jeden z nich. Proto rozbíjel schrány — urychloval hostům návrat, o který nikdo z nich nestál.","src":"kánon","mech":{},"lvl":null},{"id":"bhaal","type":"buh","name":"Bhaal","alias":["Pán vražd"],"tags":["bůh","nepřítel"],"short":"Mrtvý bůh vraždy. Jeho podstatou je nevyhnutelnost násilné smrti.","body":"Nezemřel čistě — jeho krev je v potomcích a jeho kult se probouzí pokaždé, když se najde dost zoufalých lidí a dost chaosu. Vyhaslá číše je jeho nejšpinavější odnož.","src":"kánon","mech":{},"lvl":null},{"id":"kelemvor","type":"buh","name":"Kelemvor","alias":["Pán mrtvých"],"tags":["bůh","Mer"],"short":"Spravedlivý bůh smrti. Ne hodný, ne zlý — spravedlivý, což je většinou horší.","body":"Merin pán. Kdo umře, jde k němu; on se podívá, co ten člověk se životem dělal, a zapíše ho. Nekřičí, netrestá, nesmlouvá. Kdo neví, co dělal, toho se zeptá.","src":"kánon","mech":{},"lvl":null},{"id":"jergal","type":"buh","name":"Jergal","alias":["první bůh mrtvých","písař"],"tags":["bůh","Dědek"],"short":"První bůh mrtvých. Svůj úřad dobrovolně odevzdal třem smrtelníkům a zůstal písařem.","body":"Ti tři byli Bane, Bhaal a Myrkul. Dědek byl Jergalovým písařem a rubriku nese dodnes. Moc nemá a nikdy mít nebude — nikdo mu ji nevzal, on ji dal.","src":"kánon","mech":{},"lvl":null},{"id":"myrkul-bane","type":"buh","name":"Myrkul a Bane","alias":["Myrkul","Bane"],"tags":["bůh"],"short":"Dva ze tří, kterým Jergal předal úřad. Třetí byl Bhaal.","body":"Zmiňují se hlavně proto, že Dědek u toho předání byl a nikdy o tom nemluví.","src":"kánon","mech":{},"lvl":null},{"id":"ilmater","type":"buh","name":"Ilmater","alias":["Trpící bůh"],"tags":["bůh","útočiště"],"short":"Bůh utrpení a soucitu. Jeho chrámy neodmítají nikoho, kdo přijde s bolestí.","body":"Mer naučila Elii a Ulu jeho znak jako jeden ze tří, za kterými se dá jít o pomoc.","src":"kánon","mech":{},"lvl":null},{"id":"tyr","type":"buh","name":"Tyr","alias":["Slepý bůh"],"tags":["bůh","právo"],"short":"Bůh spravedlnosti. Slepý, aby neviděl, kdo před ním stojí.","body":"Třetí ze znaků, které Mer nakreslila holkám.","src":"kánon","mech":{},"lvl":null},{"id":"gond","type":"buh","name":"Gond","alias":["Gondovská kurýrní stanice"],"tags":["bůh","řemeslo"],"short":"Bůh vynálezů a řemesel. Jeho chrámy provozují nejrychlejší kurýrní službu na pobřeží.","body":"Dopis do Candlekeepu za tři dny místo devíti stál tolik, co slušný kůň.","src":"kánon","mech":{},"lvl":null},{"id":"volo","type":"postava","name":"Volothamp Geddarm","alias":["Volo"],"tags":["NPC","host","riziko"],"short":"Teatrální, nespolehlivý kronikář v příliš dobrém klobouku. Chodí U Tří vran a píše nesmysly.","body":"Cestuje s kohoutem Melicampem, což je doopravdy zakletý kouzelník. Do svého průvodce si zapsal o Karibrkově pivu věci, které nikdo neřekl, a o perimetru napsal „tajemná magická bariéra“. Je to hlavní podezřelý na oko v okruhu — ne ze zlé vůle, ale protože mluví. Otestoval perimetr vlastním tělem a tři vteřiny stál jako socha.","src":"kánon","mech":{},"lvl":null},{"id":"melicamp","type":"postava","name":"Melicamp","alias":[],"tags":["NPC","kuriozita"],"short":"Kohout. Doopravdy kouzelník, čtyřicet dva let, lidská duše. Došlo k nehodě.","body":"Mer to potvrdila dotykem. Karibrk odmítl ho opravovat s tím, že „když to podělám, bude z něj polívka a to bych si nesl“.","src":"kánon","mech":{},"lvl":null},{"id":"elminster","type":"postava","name":"Elminster","alias":["stařec v klobouku"],"tags":["NPC","mág","spojenec"],"short":"Nejmocnější mág, kterého kdy Karibrk uviděl pít pivo u vlastního stolu. Hraje se otevřeně.","body":"Byl zaveden jako nejmenovaný starší host obou karavanních dnů, ale hráč ho poznal hned při prvním přímém setkání a oslovil jménem. Vzal to s humorem („zkazil jsi mi odpoledne“). Dal jedinou radu: neptat se JAK kult zastavit, ale PROČ se probudil zrovna teď. Má u sebe Registr s 806 jmény. Do zápletky nezasahuje, vlastních potíží má dost.","src":"kánon","mech":{},"lvl":null},{"id":"ilvos","type":"postava","name":"Bratr Ilvos","alias":["Malen Dorrick","obchodník se lnem"],"tags":["NPC","bývalý kult","kult","nepřítel","otevřené","živý"],"short":"Bývalý vůdce Bratrstva Vyhaslé číše. Po pádu hereze žije bez moci pod jménem Malen Dorrick.","body":"Bývalý vůdce Bratrstva Vyhaslé číše. Neumí kouzlit; jeho síla stála na viděních a víře, o které po čtvrté pravdě Černooké přišel. Je to organizátor, ne duelant. Karibrk ho nechal žít. Bydlí v podkroví nad pekařstvím U Tří klasů ve Vnějším městě u východní brány pod krycím jménem Malen Dorrick, obchodník se lnem. Karibrk zná jeho adresu; Ilvos zatím nemá jasný nový cíl. Otevřená linka.","src":"hra","mech":{},"lvl":null},{"id":"kessil","type":"postava","name":"Bratr Kessil","alias":[],"tags":["NPC","kult","mrtvý"],"short":"Zajatý kultista z noci útoku. Karibrk ho po získání hesla zabil pomalu a záměrně krutě.","body":"Už nebyl potřeba. Ula to z okna částečně viděla a celé slyšela a ráno Karibrka konfrontovala — poprvé za dlouhou dobu použila jeho celé jméno. Rozhovor skončil bez odpuštění.","src":"hra","mech":{},"lvl":null},{"id":"ossvin","type":"postava","name":"Ossvin","alias":[],"tags":["NPC","přítel","řemeslo"],"short":"Starší truhlář z Baldurovy brány. Přišel pomoct zdarma, protože sem jako kluk nosil dopisy.","body":"Ze dřeva, které družina odkládala jako nepoužitelné, postavil stoly a lavice. Chtěl za to teplé jídlo, místo u ohně a skleničku vína ze sklepa. Je mezi podezřelými na oko, ale míň pravděpodobně než Volo.","src":"hra","mech":{},"lvl":null},{"id":"seska","type":"postava","name":"Seska","alias":["Seska"],"tags":["NPC","přítel","řemeslo"],"short":"Malířka štítů a vývěsních cedulí. Domalovala třetí vránu.","body":"Kanonický zápis jména je Seska; ve starších zápisech se objevuje i Seska — je to tatáž osoba.","src":"hra","mech":{},"lvl":null},{"id":"fendrik-kolba","type":"postava","name":"Fendrik Kolba","alias":[],"tags":["NPC","úřad"],"short":"Úředník v Domě záznamů. Převedl stanici za jeden zlatý a nezeptal se podruhé.","body":"Varoval, že Sedm sluncí si veřejnou prohru pamatuje.","src":"hra","mech":{},"lvl":null},{"id":"aldous-dorndel","type":"postava","name":"Bratr Aldous Dorndel","alias":["Dorndel"],"tags":["NPC","Candlekeep"],"short":"Archivář třetí třídy v Candlekeepu. Prodal dům za zlatý a přihodil bednu čokolády.","body":"Původně chtěl tržní cenu 450 zlatých. Karibrk mu nabídl nekatalogizovaný rukopis a on to vzal. Podmínka: rubrika musí doputovat do knihovny do roka.","src":"hra","mech":{},"lvl":null},{"id":"odval-kmoch","type":"postava","name":"Odval Kmoch","alias":[],"tags":["NPC","minulost","mrtvý"],"short":"Dustman a pokladník sigilské márnice pod Ostružnou. Rozbíjel schrány sám.","body":"Nedělal to z krutosti — urychloval hostům návrat. Když tři sta jedna duší odešlo najednou, zestárl a zemřel smířený.","src":"hra","mech":{},"lvl":null},{"id":"bervoj-hlavac","type":"postava","name":"Bervoj Hlaváč","alias":[],"tags":["NPC","minulost"],"short":"Cechmistr sklářského cechu Ostružné. Milý člověk, a to bylo to nejhorší na něm.","body":"Uměl pracovat se zádržným sklem na úrovni, kterou v Baldurově bráně někdo umí taky — a to je otevřená otázka.","src":"hra","mech":{},"lvl":null},{"id":"rozarie","type":"postava","name":"Rozárie Ambrožová","alias":[],"tags":["NPC","otevřené"],"short":"Žije, ví, co Karibrk umí, a má velmi zajímavé roky před sebou.","body":"Nedořešená linka z Ostružné. Nikdo neví, kde je.","src":"hra","mech":{},"lvl":null},{"id":"grizelda","type":"postava","name":"Grizelda","alias":["jednooká stařena"],"tags":["NPC","obchod","nekromancie"],"short":"Jednooká stařena z krámu bez cedule v Dolním městě. Prodává i to, co se normálně neprodává.","body":"Nabídla Karibrkovi formuli Hlas z prázdna — vyvolání bez mrtvoly, placené kousky vzpomínek. Odmítl bez váhání a ona ho za tu upřímnost naučila zdarma Věrnou hlínu a kost, čistou a bez háčku.","src":"hra","mech":{},"lvl":null},{"id":"bertold","type":"postava","name":"Farmář Bertold","alias":[],"tags":["NPC","Uhlík"],"short":"Farmář dvě míle od stanice. Od něj je Uhlík.","body":"Řekl o tom štěněti jedinou větu, která zůstala: „Von si ji vybral hned, jak vešla dovnitř.“","src":"hra","mech":{},"lvl":null},{"id":"renfeld","type":"postava","name":"Renfeld","alias":["U Divých duší"],"tags":["NPC","zvěřinec"],"short":"Majitel zvěřince U Divých duší. Psa neprodal, ale poslal je za Bertoldem.","body":"Poctivý obchodník, který radši pošle jinam, než by prodal špatné zvíře.","src":"hra","mech":{},"lvl":null},{"id":"aldeth","type":"postava","name":"Aldeth Mizerák","alias":[],"tags":["NPC","magie","obchod"],"short":"Kouzelnický obchodník. Zvonek u dveří nezvoní, ale hřeje.","body":"Prodal šest strážných run a rovnou řekl, že na členitý perimetr nestačí. Poctivý obchodník, který neprodá, o čem ví, že to nebude fungovat.","src":"hra","mech":{},"lvl":null},{"id":"minsc","type":"postava","name":"Minsc a Boo","alias":["Minsc","Boo"],"tags":["NPC","kánon","easter egg"],"short":"Rašemanský hraničář s hlavou jako meloun a miniaturní obří vesmírný křeček.","body":"Nesl Elii dvě míle na ramenou. Ule řekl, že Boo vidí, že ji někdo držel a už nedrží, a že to je nejlepší den, jaký může křeček zažít.","src":"kánon","mech":{},"lvl":null},{"id":"tiax","type":"postava","name":"Tiax","alias":[],"tags":["NPC","kánon","easter egg"],"short":"Gnóm, který bude vládnout světu. Zatím křičí z bedny.","body":"Ula mu dala měďák jako pojištění a on jí vystavil listinu PRVNÍ MINISTRYNĚ na kusu pytloviny. Nosí ji dodnes.","src":"kánon","mech":{},"lvl":null},{"id":"aldarin","type":"postava","name":"Aldarin","alias":[],"tags":["NPC","mrtvý","Zhentarim"],"short":"Vedoucí zhentarimské stanice v Dagerově brodu. Dobře oblečený, klidný, ne krutý.","body":"Řekl větu o ceně a pak ji na vyžádání zopakoval. To byla poslední věc, kterou udělal.","src":"hra","mech":{},"lvl":null},{"id":"kastan","type":"postava","name":"Kaštan","alias":[],"tags":["zvíře","Mer"],"short":"Bílý slepý hrobní mlok. Cítí smrt skrz metr kamene.","body":"Mer ho nemá, protože je hezký. V Dagerově brodu našel obě holky za dvacet minut.","src":"hra","mech":{},"lvl":null},{"id":"skorapka","type":"postava","name":"Skořápka","alias":[],"tags":["zvíře","Ula"],"short":"Husa. Ulina od Ostružné. Nesnáší Uhlíka a bere to jako práci.","body":"Sandor jí dal jméno dřív, než Ula řekla svoje.","src":"hra","mech":{},"lvl":null},{"id":"tinin-bratr","type":"postava","name":"Tinin bratr","alias":[],"tags":["otevřené"],"short":"Domluva: Tři mosty, o svatém Havlu, v jedenáctém roce. To je za rok a půl.","body":"Tina o něm nemluví a nikdo se neptá. Je to jediná věc, kvůli které by odešla.","src":"hra","mech":{},"lvl":null},{"id":"medailon","type":"predmet","name":"Půlka medailonu — úpis","alias":["úpis","medailon"],"tags":["artefakt","Karibrk","tajemství"],"short":"Karibrk nemůže umřít, protože za něj už bylo zaplaceno. Jedna půlka dluh, druhá splátka.","body":"Nejstarší vzpomínka: leze z hořící skříně a šlápne na mrtvé roční dítě se stejnýma očima, které má na krku druhou polovinu. Smrt se nevyfoukne pryč, přehodí se. Nikdo neví, co úpis zruší. Kult o něm neví a to je zatím Karibrkova jediná výhoda.","src":"hra","mech":{},"lvl":null},{"id":"rubrika","type":"predmet","name":"Rubrika","alias":[],"tags":["artefakt","Dědek","Candlekeep"],"short":"Kniha z márnice, ve které je zápis nárok — ne pravda, ne lež. Nese ji Dědek.","body":"Na posledním řádku stojí Karibrkovo jméno jako ručitel výdeje tří set jedné duše. Nikdo zatím neřekl, co to obnáší. Musí být v Candlekeepu do roka, jinak družina doplatí za dům 450 zlatých. Dědek psát neumí — nechal si to vzít, když odevzdával úřad.","src":"hra","mech":{},"lvl":null},{"id":"registr","type":"predmet","name":"Registr","alias":[],"tags":["důkaz","kult","u Elminstera"],"short":"Vázaná kniha: sloupec čísel, sloupec jmen. Poslední zapsané 806. Na straně 812 číslo bez jména.","body":"Osm set šest obyčejných lidí z Vnějšího města, kteří ještě žijí, a osm set šest předem nachystaných hrobů. Časově sedí přesně na den, kdy družina přivedla Ulu domů k Elie. Karibrk ho dal Elminsterovi výměnou za všechno, co z něj vyčte.","src":"hra","mech":{},"lvl":null},{"id":"kamen-stesti","type":"predmet","name":"Kámen štěstí","alias":["Luckstone","Stone of Good Luck"],"tags":["magický","Karibrk"],"short":"+1 k ověřením vlastností a k záchranným hodům. Nosí Karibrk. Vyžaduje sladění.","body":"Nalezeno v mauzoleu Malcherů mezi věcmi, které kult odložil stranou.","src":"kánon","mech":{},"lvl":null},{"id":"boty-elfi-chuze","type":"predmet","name":"Boty elfí chůze","alias":["Boots of Elvenkind"],"tags":["magický","Tina"],"short":"Kroky jsou naprosto tiché. Výhoda na plížení. Nosí Tina.","body":"Nalezeno tamtéž. Sedí jí to skoro urážlivě dobře.","src":"kánon","mech":{},"lvl":null},{"id":"ulomek","type":"predmet","name":"Úlomek přetvořeného zádržného skla","alias":["označovací předmět"],"tags":["kult","důkaz"],"short":"Označovací předmět kultu. Stejné řemeslo jako v Ostružné.","body":"Karibrk technologii poznal okamžitě. Z něj vyšel nápad na hraniční zádrž. Otevřená otázka: kdo v Baldurově bráně umí pracovat se zádržným sklem na úrovni Bervoje Hlaváče.","src":"hra","mech":{},"lvl":null},{"id":"lebka","type":"predmet","name":"Lebka na řetízku","alias":[],"tags":["pomůcka","nekromancie"],"short":"Komponentní pomůcka, 55 zlatých. Nahrazuje drobné materiálové složky nekromantických kouzel.","body":"Koupeno u Grizeldy. Nemá vlastní moc, jenom šetří sháňku po komponentách.","src":"hra","mech":{},"lvl":null},{"id":"kravicka","type":"predmet","name":"Dřevěná vyřezaná kravička","alias":[],"tags":["symbol","Elie"],"short":"Hračka z mauzolea s odřeným nosem. Patřila dítěti, které už nikam nedošlo.","body":"Karibrk ji dal Elii jako úkol: dožít se toho, aby mu ji mohla vrátit. Drží ji od dne 33.","src":"hra","mech":{},"lvl":null},{"id":"poutni-nuz","type":"predmet","name":"Sandorův poutní nůž","alias":[],"tags":["zbraň","Elie","dar"],"short":"Dřevěná rukojeť, na provazy a pytle. Podmínka: nikdy ho nevytáhnout, když se dá běžet.","body":"Sandor k tomu dodal, že kdyby musela, není zlá — jenom neměla na vybranou.","src":"hra","mech":{},"lvl":null},{"id":"seda-stuzka","type":"predmet","name":"Šedá nenápadná stužka","alias":[],"tags":["Elie","útěk"],"short":"Náhradní stužka od Tiny pro případ, že tu barevnou bude muset hodit do řeky.","body":"Vlasy a barva šatů se pamatují první. Tina ji zapřísáhla, ať to nikomu neříká.","src":"hra","mech":{},"lvl":null},{"id":"klidodym","type":"predmet","name":"Karibrkův kydající brk","alias":["Klidodým","Klidodým (brko)"],"tags":["spotřební","Karibrk"],"short":"Deset minut hoření: výhoda na příští záchranu na soustředění a na příští Vhled; imunita vůči strachu a stavům ovlivňujícím mysl.","body":"Po dobu účinku nevýhoda na iniciativu při překvapení. Recept zná jenom Karibrk. Zbývají 4 dávky.","src":"hra","mech":{},"lvl":null},{"id":"schrany","type":"predmet","name":"Tři prázdné schrány","alias":[],"tags":["otevřené","sklo"],"short":"Neporušené zádržné sklenice z Ostružné. Prázdné a funkční.","body":"Karibrk zatím nikomu neřekl, co ho k tomu napadlo. Otevřená linka, kterou drží hráč.","src":"hra","mech":{},"lvl":null},{"id":"listina-ministryne","type":"predmet","name":"Listina PRVNÍ MINISTRYNĚ","alias":[],"tags":["Ula","kuriozita"],"short":"Kus pytloviny od gnóma Tiaxe. Ula ho nepřečetla, ale nosí ho.","body":"Za jeden měďák. Říká tomu pojištění.","src":"hra","mech":{},"lvl":null},{"id":"kotoucek","type":"predmet","name":"Zádržný kotouček perimetru","alias":["kotoučky"],"tags":["obrana","domov"],"short":"Skleněný kotouček velikosti dlaně, zakopaný. Šestnáct kusů uzavírá pozemek.","body":"Kdo nemá heslo, předmět nebo svolení a překročí linii, na tři vteřiny zamrzne. Nebolí to. Zvířata neplatí. Přes cestu je speciální varianta propouštějící vozy se znamením na oji.","src":"hra","mech":{},"lvl":null},{"id":"verna-hlina","type":"predmet","name":"Formule Věrná hlína a kost","alias":[],"tags":["nekromancie","formule"],"short":"Trvalé posílení přisluhovače bez skryté ceny. Naučila Grizelda zdarma.","body":"Víc odolnosti i útoku než běžná animace mrtvých. Přisluhovač: 31 životů, zbroj 15, útok 1k8+5.","src":"hra","mech":{},"lvl":null},{"id":"hlas-z-prazdna","type":"predmet","name":"Formule Hlas z prázdna (odmítnuta)","alias":[],"tags":["nekromancie","odmítnuto"],"short":"Vyvolání bez potřeby mrtvoly. Cena: kousky vzpomínek při každém použití.","body":"Karibrk odmítl rovnou: „nekupuju věci, který mi kradou vlastní hlavu.“ Formule existuje dál a někdo ji koupí.","src":"hra","mech":{},"lvl":null},{"id":"konvice","type":"predmet","name":"Konvice o dvou hrdlech","alias":[],"tags":["minulost","klíč"],"short":"Bábina konvice z Ostružné. Nalít dvakrát a nevypít — tak se otevřel sklep.","body":"Kaštan tehdy poprvé za jedenáct let odmítl jít dál.","src":"hra","mech":{},"lvl":null},{"id":"sesitek","type":"predmet","name":"Sešitek se 197 vzkazy","alias":[],"tags":["Sandor","tajemství"],"short":"Devatenáct let popravování, sto devadesát sedm posledních vzkazů.","body":"Nikdy z něj nepřečetl nahlas ani jeden.","src":"hra","mech":{},"lvl":null},{"id":"volu-pruvodce","type":"predmet","name":"Volův průvodce Meči pobřeží","alias":[],"tags":["kniha","riziko"],"short":"Elie ho nosila tři týdny pod paží a naučila se z něj tři slova.","body":"Volo si do něj zapsal U Tří vran a „tajemnou magickou bariéru“. Co přesně napsal a koho to přivede, je otevřená otázka.","src":"hra","mech":{},"lvl":null},{"id":"preliv","type":"ritual","name":"Přeliv","alias":["preliv"],"tags":["sklo","Ostružná"],"short":"Vyfouknutí smrti umírajícího dítěte do sklenice. Dítě přestane růst, dýchat a spát.","body":"Hlad a zima zůstanou. Sklenice se zapečetí voskem a prodá bohatým jako pojistka proti smrti. Elie je jediná, komu se přeliv nepovedl — sklenice se zavřela prázdná, a proto smí umřít. Město tomu říkalo vada.","src":"hra","mech":{},"lvl":null},{"id":"zadrz","type":"ritual","name":"Zádrž","alias":["zadrz"],"tags":["sklo","princip"],"short":"Zádrž nedrží věc na místě silou. Drží ji v okamžiku, který se nikdy nedokončí.","body":"Tohle je jádro celé kampaně. Ula v zádrži strávila 39 let jako číslo partie. Karibrk ten princip otočil naruby a udělal z něj obranu domova.","src":"hra","mech":{},"lvl":null},{"id":"hranicni-zadrz","type":"ritual","name":"Hraniční zádrž (perimetr)","alias":["perimetr"],"tags":["obrana","domov"],"short":"Zamknutí hranice uvnitř okamžiku, kdy se přes ni má přejít. Tři vteřiny nehybnosti.","body":"Šestnáct kotoučků, zhruba 50 m kolem pozemku, propojený kruh. Výjimku má rodina a kdo dostal heslo nebo předmět. Nezastaví to všechno — ale tři vteřiny, kdy někdo stojí a míří na něj kuše, rozhodují. Otestováno na Volovi. Dá se přes Dědka posílit na plnou bariéru; detaily neupřesněny.","src":"hra","mech":{},"lvl":null},{"id":"ritual-zadrze-kultu","type":"ritual","name":"Rituál zádrže (kultovní varianta)","alias":[],"tags":["kult","nebezpečí"],"short":"K prvnímu rituálu kult potřebuje tři věci: surové stříbro, Karibrkovu krev a bezměsíčnou noc.","body":"Bezměsíčná noc přišla den 30 a kult zaútočil — ale primárně na Rockyho, protože past byla na bytost z dluhu, ne na holky. Rituál nebyl dokončen. U předchozího pokusu (noc útoku) byl na 60–70 %, než ho Karibrk přerušil Ohnivou koulí; na jedné z holek zůstalo nestabilní echo stopy a nikdo neví na které.","src":"hra","mech":{},"lvl":null},{"id":"zakladani-hrbitova","type":"ritual","name":"Zakládání hřbitova hrobovou prstí","alias":["hrobová prsť"],"tags":["kult","zjištění"],"short":"Hrobová prsť není nekromantická surovina. Hlína z hrobu dělá z místa hřbitov.","body":"Karibrkovo klíčové zjištění (INT 21, čtyřicet let praxe). Navezená ve velkém na místo, kde hřbitov nikdy nebyl, mu dá právo smrti. Vyčištěné a spárované dětské boty jsou symbolické pohřby: jeden pár = jedno rezervované místo. Osm set šest jmen = osm set šest čekajících hrobů.","src":"hra","mech":{},"lvl":null},{"id":"rezonance-ritual","type":"ritual","name":"Rezonance dvou anomálií","alias":[],"tags":["kult","jádro"],"short":"Elie a Ula každá zvlášť byly jen anomálie. Pod jednou střechou jsou signál.","body":"Elminsterovo vysvětlení: kult potřeboval palivo (zoufalí lidé ve Vnějším městě), vzduch (chaos po pádu Baldurovy brány) a jiskru (rezonance). Kámen hozený do rybníka nedělá vlny schválně — je to fyzika, ne vina.","src":"hra","mech":{},"lvl":null},{"id":"pad-brany","type":"udalost","name":"Pád Baldurovy brány","alias":[],"tags":["kánon","pozadí"],"short":"Před rokem. Chaos a trosky, ve kterých si nikdo nevšiml, co se pod městem nadechuje.","body":"Druhá ze tří věcí, které probudily kult. Město se z toho pořád nevzpamatovalo.","src":"kánon","mech":{},"lvl":null},{"id":"noc-utoku-ud","type":"udalost","name":"Noc útoku","alias":[],"tags":["den 26","boj"],"short":"Den 26. Čtyři postavy v pláštích, rituál na dvoře, Ohnivá koule přímo do středu.","body":"Tři kultisté mrtví, tři zajati. Z výslechu padlo heslo i adresa mauzolea. Karibrk zabil Kessila pomalu a už bez nutnosti — a Ula to slyšela.","src":"hra","mech":{},"lvl":null},{"id":"pozar-mauzolea","type":"udalost","name":"Požár mauzolea","alias":[],"tags":["den 29","zlom"],"short":"Den 29. Karibrk zapálil překladiště jako vzkaz, proti Tinině námitce a s Sandorovým tichým souhlasem.","body":"Strop se propadl a zavalil ústí kanálů pod třemi sáhy horkého kamene. Kult přišel o sklad i cestu, družina o jedinou známou cestu dolů.","src":"hra","mech":{},"lvl":null},{"id":"noc-bez-mesice-ud","type":"udalost","name":"Noc bez měsíce","alias":[],"tags":["den 30","boj"],"short":"Den 30. Kult šel po Rockym, ne po holkách. Past byla na bytost z dluhu.","body":"Čtyři kultisté vyřízeni, jméno bratra Ilvose padlo, a padlo i to, že kult má oko v blízkém okruhu domácnosti. Elie poprvé řekla Karibrkovi „tati“.","src":"hra","mech":{},"lvl":null},{"id":"vaelor-udalost","type":"udalost","name":"Pýcha Mlazivoje Vaelora","alias":[],"tags":["den 36","souboj"],"short":"Den 36. Souboj v Soukenické uličce. Vaelor přežil, protože Karibrk myslel na Elii.","body":"Facka prošla skrz Zrcadlový obraz, Roztříštění rozbilo iluze, Mrazivý dotyk ochromil ruku. Místo smrtící rány přišlo veřejné ponížení před celou ulicí. Vaelor nezná Karibrkovo jméno ani adresu. Zatím.","src":"hra","mech":{},"lvl":null},{"id":"skalovani","type":"pravidlo","name":"Škálování kouzel","alias":[],"tags":["pravidlo","mechanika"],"short":"Kouzla s pozicí rostou podle ÚROVNĚ POZICE. Triky rostou podle ÚROVNĚ POSTAVY.","body":"Magická střela seslaná z pozice 3. úrovně dá 5 střel. Trik dává 1 kostku do 4. úrovně postavy, 2 od 5., 3 od 11., 4 od 17. Karibrk je 7. úroveň, takže jeho triky dávají 2 kostky. PJ to hlídá automaticky, hráč nemusí.","src":"hra","mech":{},"lvl":null},{"id":"jiskry","type":"pravidlo","name":"Jiskry a klasické XP","alias":[],"tags":["pravidlo","odměny"],"short":"Dva souběžné systémy. Jiskry nikdy za zabíjení — za charakterní volby. XP klasicky 5e.","body":"ZJIŠTĚNÍ 25–100, ŘEMESLO 25–100, CENA 50–150, RODINA 50–150, SRAČKA 25–75 za přiznanou chybu. Klasické XP se dávají i za vyřešení připravené hrozby bez boje, srovnatelně s tím, jaký boj by to nahradilo.","src":"hra","mech":{},"lvl":null},{"id":"xp-fond","type":"pravidlo","name":"Závěrečný XP fond za dobrodružství","alias":[],"tags":["pravidlo","odměny","PJ"],"short":"PJ si na začátku dobrodružství tajně stanoví fond podle šesti os. Vyplácí se na konci.","body":"Osy po 1–5 bodech: SMRTELNOST, SPLETITOST, SÁZKA, ORIGINALITA PJ (×2), VYNALÉZAVOST HRÁČE, CENA. Sedm stupňů od Škrábance (asi 300 XP) po Zápis do kronik (asi 13 000 XP). Zpětně se nic nedopočítává.","src":"hra","mech":{},"lvl":null},{"id":"talenty","type":"pravidlo","name":"Talenty jsou fixní","alias":[],"tags":["pravidlo","postup"],"short":"Slot na 4., 8., 12., 16. a 19. úrovni. Jednou zvolený talent se přepíše jen se souhlasem PJ.","body":"Karibrk: Dotčený Fey (+1 INT na 21, 1x denně Mlžný krok zdarma, zvolená Detekce magie). Tina: Kušista-expert. Sandor: Sekáč. Mer: Léčitel. Na 7. úrovni má každý jeden talent, další slot až na 8.","src":"hra","mech":{},"lvl":null},{"id":"karma-pravidlo","type":"pravidlo","name":"Karma a přesvědčení","alias":[],"tags":["pravidlo","charakter"],"short":"Parta vychází ze zlého základu. Elie je nezištně dobrá, Ula stojí přesně na zlomu.","body":"Karma se hýbe za činy, ne za slova. Elie je jediná brzda, kterou parta má, a všichni to o ní vědí.","src":"hra","mech":{},"lvl":null},{"id":"deti-nebojuji","type":"pravidlo","name":"Elie, Ula a Uhlík do boje nejdou","alias":[],"tags":["pravidlo","stůl"],"short":"Nikdy, za žádných okolností. Životy a zbroj jsou pro nehody, ne pro účast v bitvě.","body":"Uhlík dokud nevyroste a dokud to někdo výslovně nerozhodne jinak.","src":"hra","mech":{},"lvl":null},{"id":"kz-magicka-strela","type":"kouzlo","name":"Magická střela","alias":["Magic Missile"],"tags":["kouzlo","1. úroveň","podrobné"],"short":"3 střely po 1k4+1, nikdy nemine","body":"Tři zářící šipky, každá zasáhne cíl, který vidíš. Nemine nikdy, neexistuje záchrana. Za vyšších úrovní: +1 střela za každou pozici nad první, takže z pozice 3. úrovně letí pět střel. Jediné spolehlivé zranění, které Karibrk má, když se všechno ostatní pokazí.","src":"PJ","mech":{"škola":"zaklínání","dosah":"36 m","seslání":"1 akce","trvání":"okamžitě","složky":"V, S","záchrana":"—, nikdy nemine","kostky":"3x 1k4+1 silové","soustředění":"ne","rituál":"ne"},"lvl":1},{"id":"kz-stit","type":"kouzlo","name":"Štít","alias":["Shield"],"tags":["kouzlo","1. úroveň","podrobné"],"short":"reakce, +5 zbroj do začátku tvého tahu","body":"Reakce v okamžiku, kdy tě někdo zasáhne nebo na tebe letí Magická střela: +5 ke Zbroji do začátku tvého dalšího tahu, a Magickou střelu to zruší úplně. Z 16 udělá 21, což na šesté úrovni znamená, že většina věcí mine.","src":"PJ","mech":{"škola":"odvraceni","dosah":"sebe","seslání":"1 reakce","trvání":"1 kolo","složky":"V, S","záchrana":"—","kostky":"—","soustředění":"ne","rituál":"ne"},"lvl":1},{"id":"kz-magicke-brneni","type":"kouzlo","name":"Magické brnění","alias":["Mage Armour"],"tags":["kouzlo","1. úroveň","podrobné"],"short":"zbroj 13+Obratnost na 8 h","body":"Zbroj = 13 + Obratnost, pokud cíl nenosí zbroj. Karibrk to sesílá ráno a nemyslí na to zbytek dne. Právě tohle mu drží Zbroj 16.","src":"PJ","mech":{"škola":"odvraceni","dosah":"dotyk","seslání":"1 akce","trvání":"8 hodin","složky":"V, S, M","záchrana":"—","kostky":"—","soustředění":"ne","rituál":"ne"},"lvl":1},{"id":"kz-spalujici-ruce","type":"kouzlo","name":"Spalující ruce","alias":["Burning Hands"],"tags":["kouzlo","1. úroveň","stručné"],"short":"kužel 4,5 m, 3k6 oheň","body":"Zatím jen stručný popis. Podrobnosti (dosah, záchrana, kostky, trvání) se doplní, až se na to kouzlo bude reálně házet.","src":"PJ","mech":{},"lvl":1},{"id":"kz-chromaticka-koule","type":"kouzlo","name":"Chromatická koule","alias":["Chromatic Orb"],"tags":["kouzlo","1. úroveň","stručné"],"short":"3k8, vybraný živel","body":"Zatím jen stručný popis. Podrobnosti (dosah, záchrana, kostky, trvání) se doplní, až se na to kouzlo bude reálně házet.","src":"PJ","mech":{},"lvl":1},{"id":"kz-uspani","type":"kouzlo","name":"Uspání","alias":["Sleep"],"tags":["kouzlo","1. úroveň","podrobné"],"short":"5k8 životů usne bez záchrany","body":"Usínají tvorové od nejnižších aktuálních životů, dokud vystačí součet. Nemrtví a tvorové imunní vůči okouzlení jsou vyňatí. Za vyšších úrovní +2k8.","src":"PJ","mech":{"škola":"okouzlení","dosah":"27 m","seslání":"1 akce","trvání":"1 minuta","složky":"V, S, M","záchrana":"—, sčítají se životy","kostky":"5k8 životů","soustředění":"ne","rituál":"ne"},"lvl":1} ,"kostky":"—","soustředění":"ne","rituál":"ne"}},{"id":"kz-trik-drobniluze","type":"kouzlo","name":"Drobná iluze","alias":["Minor Illusion"],"tags":["kouzlo","0. úroveň","trik","podrobné"],"short":"—","body":"Buď zvuk, nebo obraz o velikosti krychle 1,5 m — ne obojí najednou. Obraz nevydává zvuk, světlo ani teplo a projde se skrz něj. Kdo iluzi prozkoumá akcí, pozná ji.","src":"PJ","lvl":0,"mech":{"škola":"iluze","dosah":"9 m","seslání":"1 akce","trvání":"1 minuta","složky":"S, M","záchrana":"Inteligence (zkoumání při dotyku)","kostky":"—","soustředění":"ne","rituál":"ne"}},{"id":"kz-trik-mistrovskr","type":"kouzlo","name":"Mistrovská ruka","alias":[],"tags":["kouzlo","0. úroveň","trik","podrobné"],"short":"—","body":"Zapálí nebo zhasne svíčku, očistí nebo ušpiní předmět do 0,5 kg, ochutí, obarví, ohřeje nebo ochladí drobnost na hodinu. Neudělá nic, co by mohlo zranit — a přesto se s ní dají dělat věci, na které se nikdo nedívá.","src":"PJ","lvl":0,"mech":{"škola":"proměna","dosah":"3 m","seslání":"1 akce","trvání":"až 1 hodina","složky":"V, S","záchrana":"—","kostky":"—","soustředění":"ne","rituál":"ne"}},{"id":"cernooka","type":"postava","name":"Černooká","alias":["Bezejmenná","Zbytek","ta z podkroví","ta s černýma očima"],"tags":["NPC","Bhaal","romance","nadpřirozené","otevřené"],"lvl":null,"src":"hra","short":"Zbytek Bhaalovy podstaty beze jména a beze schránky. Mladá žena s úplně černýma očima. Existuje, protože v ni lidé věří.","body":"Když Bhaal zemřel POPRVÉ, dřív než všichni známí bhaalspawni, jeho podstata se neroztříštila jen do smrtelných dětí. Malá část neměla kam jít — žádné tělo, žádný nárok. Tenhle zbytek je ona.\n\n**Podoba:** nejvýš pětadvacet, tmavé cestovní šaty bez ozdob, vlasy sepnuté vzadu, na první pohled nenápadná. Oči celé černé od okraje k okraji, jako dvě kapky inkoustu, a odráží se v nich světlo způsobem, jakým se oči odrážet neumějí. Sama říká, že je to tvar — vybraný, ne narozený, a že v tom, co je doopravdy, by se jí neřeklo krásná, ale **prázdná**.\n\n**Jak funguje:** existuje úměrně tomu, kolik lidí v ni věří. Nedá se zabít mečem, protože není dost tělo, aby to mělo smysl. Dá se **rozvěřit** — vzít věřícím důvod, ne těla; zabíjení kultistů ji posiluje stejně jako zakládá. Nejúčinnější zbraň proti ní je **přesný zápis**: napsat skutečná jména tam, kde ona potřebuje prázdno a čísla.\n\n**Čím je vázaná:** co řekne třikrát pravdivě v jedné noci, platí navěky. Pravda řečená z vlastní vůle mimo otázku ji zavazuje jinak a dráž.\n\n**Co udělala:** den 35 stáhla ruku z hereze. Elie ani Ula už pro Vyhaslou číši nejsou zajímavé — žádná vidění pro Ilvose, žádná síla za jeho slovy, žádné sny prozrazující dům. Nemohla slíbit, že se jinde nezakouká jiný blázen; slíbila jen, že hlad mířící na tenhle dům zhasl.\n\n**Nedořešené:** jméno neřekla a Karibrk se nezeptal. Pozvání do hospody přijala s tím, že pít nebude — nemá v čem — ale že se možná jednou posadí do rohu jako ten starý muž s kloboukem a bude poslouchat, jak vychovává dceru, kterou vůbec neměl potkat. Karibrk jí do prázdného vzduchu dal slovo, že se pokusí najít způsob, jak ji dostat z prázdného stavu do plnější formy. To slovo platí a nikdo neví, co obnáší.\n\n**Den 41 — podmínky plnější formy:** po Karibrkově návrhu upřesnila, že problém není samotná živost schránky, ale **cizí život a cizí nárok**. Za přijatelný směr považuje živé tělo vytvořené výhradně pro ni, které před ní nikomu nepatřilo, nenese cizí osobu ani příběh, nestárne běžným lidským způsobem a není vězením. Musí z něj moci kdykoli odejít čistě vlastním rozhodnutím; zničení těla nesmí zničit ji, pouze ukončit manifestaci. Konečné provedení si vyhrazuje schválit až nad konkrétním plánem. Jméno si vybere sama. Karibrkovy pracovní návrhy DéMonika, Živola a Bhaalónka byly přijaty způsobem, který prakticky vylučuje jejich budoucí použití.","mech":{"typ":"zbytek božské podstaty, bez schránky","nedá se":"zabít zbraní ani kouzlem","dá se":"rozvěřit (vzít věřícím důvod)","slabina":"přesný zápis — skutečná jména místo čísel","vázanost":"tři pravdy v jedné noci platí navěky"}},{"id":"hlad","type":"buh","name":"Hlad","alias":["ten hlad","to nad nimi"],"tags":["kosmologie","Bhaal","nepojmenované"],"lvl":null,"src":"hra","short":"Na vrcholu není nikdo s trůnem ani se jménem. Je tam jenom hlad — starší než bohové, starší než smrt sama.","body":"Podle Černooké to je ten, kdo dal Bhaalovi vůbec chuť stát se bohem vraždění. Není to bytost s kultem, oltářem ani vůlí v lidském smyslu. Vyhaslá číše jsou jeho nejzoufalejší a nejzpackanější vyznavači, protože jsou jediní, kdo se ho pokoušejí nakrmit **omylem**, ne obětí.\n\nNad ním existuje jediná bytost, o které podle ní stojí za to vědět, že je — **Lord Ao**. Ale ten neodpovídá na otázku *proč*. Ao kontroluje účetnictví, nevysvětluje, proč účty existují.","mech":{}},{"id":"pouto-pravidlo","type":"pravidlo","name":"Pouta — jak se počítají vztahy","alias":["pouto","vztahy","zamilovanost"],"tags":["pravidlo","mechanika","vztahy"],"lvl":null,"src":"hra","short":"Čtyři ukazatele: BLÍZKOST, DŮVĚRA, ZÁVISLOST, CENA. Zdravé pouto láme kletby, nezdravé láme postavu.","body":"Vztah není jedno číslo. Jsou čtyři a hýbou se každý zvlášť podle toho, co se ve hře stane.\n\n**BLÍZKOST (0–100)** — jak blízko si ti dva reálně jsou. Roste společně prožitým, ne slovy.\n**DŮVĚRA (0–100)** — jestli se na sebe dá spolehnout. Roste dodrženým slovem, padá zatajeným.\n**ZÁVISLOST (0–100)** — kolik z toho je potřeba místo volby. Tohle je ta špatná osa.\n**CENA (roste, nikdy neklesá)** — co už to stálo. Karma, zranění, ztracené příležitosti, lidi, kteří kvůli tomu odešli.\n\n**Stav pouta se odvodí sám:**\n- ZÁVISLOST 60+ → **TOXICKÉ**. Nevýhoda na záchrany proti okouzlení a sugesci od té osoby a na ověření, jestli lže.\n- BLÍZKOST přesáhne DŮVĚRU o víc než 20 → **NAKŘÁPLÉ**. Postava té osobě dává víc, než kolik jí věří, a to se nikdy nevyplatí.\n- DŮVĚRA 10 a míň → **ZLOMENÉ**.\n- Jinak **ZDRAVÉ**.\n\n**Co zdravé pouto umí:** při DŮVĚŘE 80+ může jednou za dobrodružství zlomit účinek, který by se jinak zlomit nedal — kletbu, ovládnutí, strach, i zádrž. Ne mechanikou, ale tím, že postava má důvod, který je silnější než zadání. Použití se zapíše a ten rok se neopakuje.\n\n**Co nezdravé pouto stojí:** toxické pouto dává druhé straně páku. PJ ji smí použít proti hráči, a používá ji.","mech":{"osy":"BLÍZKOST · DŮVĚRA · ZÁVISLOST · CENA","toxické":"ZÁVISLOST 60+","nakřáplé":"BLÍZKOST − DŮVĚRA > 20","láme kletby":"DŮVĚRA 80+, 1x za dobrodružství"}},{"id":"rubrikar","type":"predmet","name":"Rubrikář","alias":["malý registr","Registrum minor"],"tags":["magický","Karibrk","nekromancie","kořist"],"lvl":null,"src":"PJ","short":"Šedě vázaná prázdná kniha z kultovní truhlice. Kdo je v ní zapsán jménem, nemůže o svém jménu lhát.","body":"Vyžaduje sladění. Dokud ho neseš:\n\n— Jednou za dlouhý odpočinek můžeš seslat **Mluvení s mrtvými** bez použití pozice.\n— Mrtvý, jehož **skutečné jméno** do knihy zapíšeš dřív, než kouzlo sešleš, se nesmí vyhnout ani jedné z pěti otázek. Odpovídá stručně, ale rovně.\n— Kniha má 101 prázdných listů. Zapsané jméno z ní nejde vyškrtnout.\n\nCelá věc je varianta téhož principu, kterým Karibrk vyprázdnil sigilskou márnici a kterým se podle Černooké dá ubližovat bytostem jejího druhu. Kult ji zjevně chystal na opačné použití.","mech":{"vzácnost":"vzácný","sladění":"ano","nábojů":"1 za dlouhý odpočinek","škola":"věštění / nekromancie"}},{"id":"zamilovanost","type":"schopnost","name":"Zamilovanost (dlouhodobý efekt)","alias":["efekt zamilovanost"],"tags":["efekt","Karibrk","vztahy"],"lvl":null,"src":"hra","short":"Tři věci, ve kterých je lepší, a tři, ve kterých je hloupější. Nedá se vypnout vůlí.","body":"**Co přidává:**\n1. **Výhoda na záchrany proti strachu.** Kdo má na co myslet, se hůř zlomí.\n2. **Jednou za den může přehodit neúspěšnou záchranu na soustředění.** Myšlenka, která drží.\n3. **+2 k Přesvědčování a Vystupování.** Mluví líp, protože mu na tom poprvé po čtyřiceti letech záleží.\n\n**Co bere:**\n1. **Nevýhoda na Vhled a na záchrany proti klamu a iluzi**, kdykoliv v tom hraje roli ona nebo někdo, kdo ji připomíná.\n2. **Nevýhoda na Zkoumání při vyhodnocování rizika** u čehokoliv, co by ho k ní přiblížilo. Tohle je ten nebezpečný.\n3. **Roztržitost:** poprvé za den, kdy padne zmínka o ní během boje nebo vyjednávání, ztrácí reakci do konce svého dalšího tahu.\n\nEfekt se neodstraní odpočinkem, kouzlem ani vůlí. Odstraní se jenom tím, co se stane dál.","mech":{"typ":"dlouhodobý","od":"den 35","zruší":"jen děj, ne kouzlo"}},{"id":"kz-hp-strážná-lebka","type":"kouzlo","name":"Strážná lebka","alias":[],"tags":["kouzlo","1. úroveň","podrobné","hrobopis","přetvořenec"],"short":"lebka hlídá 9 m, vidíš skrz ni (rituál)","body":"Položíš lebku a probudíš ji. Vnímá živé tvory v kouli 9 m kolem sebe, i skrz 30 cm dřeva nebo hlíny (kámen ne). Když do dosahu vstoupí tvor, kterého jsi při sesílání nevyjmenoval, lebka cvakne čelistí (slyšet na 18 m), nebo ti pošle mentální obraz toho, kdo to je, pokud jsi do 1,5 km — vybereš při vytvoření. Jednou za krátký odpočinek můžeš akcí vidět a slyšet skrz ni do konce svého dalšího tahu. Nemrtví a konstrukty ji nespustí. **Za vyšších úrovní:** +1 lebka za každou pozici nad první. Rozdíl od Poplachu: vidí, KDO přišel, a lebek může být víc. **Zdroj:** Hrobopis, Karibrkův vlastní rukopis — kouzlo je zapsané v jeho knize. **TRVALÝ ZÁPIS:** od dokončení výtvor nevyžaduje soustředění a nemá časový limit. Trvá do zničení, Karibrkova trvalého odvolání nebo rozvázání kotvy. Klidová forma není zrušení: výtvor se pouze uspí a lze jej za 1 minutu znovu probudit bez další pozice, pokud má pro svou formu dost místa a potřebnou okolní hmotu.","src":"PJ","mech":{"škola":"nekromancie","dosah":"dotyk","seslání":"1 minuta","trvání":"trvale, dokud není zničen, trvale odvolán nebo rozvázána kotva","složky":"V, S, M (lebka, nespotřebuje se)","záchrana":"—","kostky":"—","soustředění":"ne","rituál":"ano","zdroj":"Hrobopis — Karibrkův vlastní výzkum"},"lvl":1},{"id":"kz-hp-kostěný-pavouk","type":"kouzlo","name":"Kostěný pavouk","alias":[],"tags":["kouzlo","1. úroveň","podrobné","hrobopis","přetvořenec"],"short":"přetvořenec: průzkumník z kůstek, 1k6 + jed","body":"**Drobný nemrtvý.** Zbroj 13 · životy 8 (+5 za každou pozici nad první) · rychlost 9 m, šplhání 9 m i po stropě · temnozrak 18 m. **Kousnutí:** útok kouzlem (+8), 1k6 + úroveň pozice bodné; zasažený hází záchranu na Odolnost proti tvému SO, jinak je otrávený do konce svého dalšího tahu. **Škvíra:** proleze otvorem širokým 2,5 cm. **Oči na dálku:** bonusovou akcí vidíš a slyšíš jeho smysly do začátku svého dalšího tahu (ty sám jsi mezitím slepý a hluchý). Platí bonus Nemrtvých poddaných podle karty školy (životy a zranění navíc). Přetvořenec jedná hned po tobě v iniciativě, poslouchá slovní povely (nestojí akci), bez povelu se jen brání. Z jednoho seslání vždy jen jeden přetvořenec (pokud kouzlo neříká jinak). Když přetvořenec klesne na 0 životů nebo je trvale odvolán, vazební zápis končí; zničené zvláštní složky se znovu použít nedají. **Zdroj:** Hrobopis, Karibrkův vlastní rukopis — kouzlo je zapsané v jeho knize. **TRVALÝ ZÁPIS:** od dokončení výtvor nevyžaduje soustředění a nemá časový limit. Trvá do zničení, Karibrkova trvalého odvolání nebo rozvázání kotvy. Klidová forma není zrušení: výtvor se pouze uspí a lze jej za 1 minutu znovu probudit bez další pozice, pokud má pro svou formu dost místa a potřebnou okolní hmotu.","src":"PJ","mech":{"škola":"nekromancie","dosah":"9 m","seslání":"1 akce","trvání":"trvale, dokud není zničen, trvale odvolán nebo rozvázána kotva","složky":"V, S, M (prstní kůstky aspoň dvou tvorů)","záchrana":"Odolnost (jed)","kostky":"1k6 + úroveň pozice bodné","soustředění":"ne","rituál":"ne","zdroj":"Hrobopis — Karibrkův vlastní výzkum"},"lvl":1},{"id":"kz-hp-tři-mrtvé-vrány","type":"kouzlo","name":"Tři mrtvé vrány","alias":[],"tags":["kouzlo","2. úroveň","podrobné","hrobopis","přetvořenec"],"short":"přetvořenci: tři rv","type":"kouzlo","name":"Hrobový červ","alias":[],"tags":["kouzlo","4. úroveň","podrobné","hrobopis","přetvořenec"],"short":"přetvořenec z hrobové prsti: hrabe, polyká, 2k8","body":"**Velký nemrtvý.** Zbroj 15 · životy 50 (+10 za pozici nad čtvrtou) · rychlost 9 m, hrabání 9 m · otřesové čití 18 m. **Kousnutí:** útok kouzlem, 2k8 + úroveň pozice bodné; Střední nebo menší cíl je uchopen (únik SO kouzel). Kdo je uchopen už na začátku červova tahu, je **spolknut**: oslepen, zadržen, úplný kryt, 2k6 kyselé na začátku každého červova tahu. Najednou jen jeden. Spolknutý vypadne, když červ utrpí 15+ zranění v jednom tahu, usne do klidové formy, je odvolán nebo zničen. **Hřbitovní půda:** tam, kudy prohrabe, se z hlíny stávají hroby — čtverec 3 m za každý tah je těžký terén 10 minut; pak se magická tíha vytratí, fyzicky rozrytá zem samozřejmě zůstává rozrytá. Přímý plod Karibrkova zjištění, že hrobová prsť dělá z místa hřbitov. **Zdroj:** Hrobopis, Karibrkův vlastní rukopis — kouzlo je zapsané v jeho knize. **TRVALÝ ZÁPIS:** od dokončení výtvor nevyžaduje soustředění a nemá časový limit. Trvá do zničení, Karibrkova trvalého odvolání nebo rozvázání kotvy. Klidová forma není zrušení: výtvor se pouze uspí a lze jej za 1 minutu znovu probudit bez další pozice, pokud má pro svou formu dost místa a potřebnou okolní hmotu.","src":"PJ","mech":{"škola":"nekromancie","dosah":"18 m","seslání":"1 akce","trvání":"trvale, dokud není zničen, trvale odvolán nebo rozvázána kotva","složky":"V, S, M (pytel hrobové prsti ze tří různých hrobů, spotřebuje se)","záchrana":"—","kostky":"2k8 + úroveň pozice bodné; spolknutí 2k6 kyselé","soustředění":"ne","rituál":"ne","zdroj":"Hrobopis — Karibrkův vlastní výzkum"},"lvl":4},{"id":"kz-hp-kostnicový-kolos","type":"kouzlo","name":"Kostnicový kolos","alias":[],"tags":["kouzlo","5. úroveň","podrobné","hrobopis","přetvořenec"],"short":"přetvořenec z desítek těl: obr, 2 údery 2k10, rozpadne se v roj","body":"**Obrovský nemrtvý.** Zbroj 16 · životy 90 (+15 za pozici nad pátou) · rychlost 12 m. **Vícenásobný útok:** dva údery, útok kouzlem, dosah 4,5 m, 2k10 + úroveň pozice drtivé. **Kostěný déšť (1x za dlouhý odpočinek):** akcí si vyrve žebra a mrští je — kužel 9 m, 6k6 bodné, záchrana na Obratnost napůl; kolos přijde o 20 životů. **Rozpad:** když klesne na 0, rozsype se do Velkého roje kostí se 30 životy, který vydrží ještě minutu; kdo začne tah v jeho prostoru, hází záchranu na Obratnost, jinak 2k6 sečné. Platí bonus Nemrtvých poddaných podle karty školy (životy a zranění navíc). Přetvořenec jedná hned po tobě v iniciativě, poslouchá slovní povely (nestojí akci), bez povelu se jen brání. Z jednoho seslání vždy jen jeden přetvořenec (pokud kouzlo neříká jinak). Když přetvořenec klesne na 0 životů nebo je trvale odvolán, vazební zápis končí; zničené zvláštní složky se znovu použít nedají. **Zdroj:** Hrobopis, Karibrkův vlastní rukopis — kouzlo je zapsané v jeho knize. **TRVALÝ ZÁPIS:** od dokončení výtvor nevyžaduje soustředění a nemá časový limit. Trvá do zničení, Karibrkova trvalého odvolání nebo rozvázání kotvy. Klidová forma není zrušení: výtvor se pouze uspí a lze jej za 1 minutu znovu probudit bez další pozice, pokud má pro svou formu dost místa a potřebnou okolní hmotu.","src":"PJ","mech":{"škola":"nekromancie","dosah":"18 m","seslání":"1 minuta","trvání":"trvale, dokud není zničen, trvale odvolán nebo rozvázána kotva","složky":"V, S, M (kosti aspoň dvaceti tvorů a onyx za 100 zl, onyx se spotřebuje)","záchrana":"Obratnost (Kostěný déšť, roj)","kostky":"2x 2k10 + úroveň pozice drtivé","soustředění":"ne","rituál":"ne","zdroj":"Hrobopis — Karibrkův vlastní výzkum"},"lvl":5},{"id":"kz-hp-písař-z-márnice","type":"kouzlo","name":"Písař z márnice","alias":[],"tags":["kouzlo","5. úroveň","podrobné","hrobopis","přetvořenec"],"short":"přetvořenec: zapíše pravé jméno, cíl má nevýhodu proti tvé nekromancii","body":"**Střední nemrtvý, neútočí.** Zbroj 15 · životy 35. **Zápis:** akcí zapíše **pravé jméno** tvora, které znáš, pokud je do 18 m. Ten má po dobu 1 hodiny nevýhodu na záchrany proti tvým nekromantickým kouzlům a nemůže se před tebou skrýt magií — neviditelnost a iluze na tebe nefungují. Jeden zápis za seslání, na pozici 7+ dva. **Odpis:** když zapsaný zemře během té hodiny, písař dopíše, co ten tvor věděl v posledním okamžiku; položíš mu jednu otázku jako při Mluvení s mrtvými, bez desetidenní lhůty. **Zápis je nárok:** zapsaný pozná, že byl zapsán, a pozná i rukopis. Mer tohle kouzlo nenávidí a Dědek by se u něj poprvé usmál. **Zdroj:** Hrobopis, Karibrkův vlastní rukopis — kouzlo je zapsané v jeho knize. **TRVALÝ ZÁPIS:** od dokončení výtvor nevyžaduje soustředění a nemá časový limit. Trvá do zničení, Karibrkova trvalého odvolání nebo rozvázání kotvy. Klidová forma není zrušení: výtvor se pouze uspí a lze jej za 1 minutu znovu probudit bez další pozice, pokud má pro svou formu dost místa a potřebnou okolní hmotu.","src":"PJ","mech":{"škola":"nekromancie","dosah":"3 m","seslání":"10 minut","trvání":"trvale, dokud není zničen, trvale odvolán nebo rozvázána kotva","složky":"V, S, M (pravá ruka mrtvého, který uměl psát, a inkoust za 100 zl, spotřebuje se)","záchrana":"—","kostky":"—","soustředění":"ne","rituál":"ne","zdroj":"Hrobopis — Karibrkův vlastní výzkum"},"lvl":5},{"id":"kz-hp-márnicový-rytíř","type":"kouzlo","name":"Márnicový rytíř","alias":[],"tags":["kouzlo","6. úroveň","podrobné","hrobopis","přetvořenec"],"short":"přetvořenec z pěti vojáků: štít spojenců, 2 údery (zatím nad síly)","body":"**Střední nemrtvý.** Zbroj 18 · životy 80 (+15 za pozici nad šestou) · rychlost 9 m. **Vícenásobný útok:** dva seky, útok kouzlem, 2k8 + úroveň pozice sečné + 2k6 nekrotické. **Chránit:** reakcí převezme zásah mířený na spojence do 1,5 m. **Aura pochodu:** tvoji nemrtví do 9 m mají výhodu na záchrany proti odvrácení nemrtvých. Karibrk ho zatím nesešle — čeká na 11. úroveň a pozici 6. **Zdroj:** Hrobopis, Karibrkův vlastní rukopis — kouzlo je zapsané v jeho knize. **TRVALÝ ZÁPIS:** od dokončení výtvor nevyžaduje soustředění a nemá časový limit. Trvá do zničení, Karibrkova trvalého odvolání nebo rozvázání kotvy. Klidová forma není zrušení: výtvor se pouze uspí a lze jej za 1 minutu znovu probudit bez další pozice, pokud má pro svou formu dost místa a potřebnou okolní hmotu.","src":"PJ","mech":{"škola":"nekromancie","dosah":"9 m","seslání":"1 minuta","trvání":"trvale, dokud není zničen, trvale odvolán nebo rozvázána kotva","složky":"V, S, M (pět mrtvých, kteří nosili zbraň)","záchrana":"—","kostky":"2x 2k8 + úroveň pozice sečné + 2k6 nekrotické","soustředění":"ne","rituál":"ne","zdroj":"Hrobopis — Karibrkův vlastní výzkum"},"lvl":6},{"id":"kz-hp-bárka-bez-převozníka","type":"kouzlo","name":"Bárka bez převozníka","alias":[],"tags":["kouzlo","7. úroveň","podrobné","hrobopis","přetvořenec"],"short":"kostěná loď, pluje po mlze i po zemi, 24 h (zatím nad síly)","body":"Z kostí a vozu vyroste bárka, která pluje po vodě i po vlastní mlze nad zemí, 24 km za hodinu, a unese dvanáct Středních tvorů. Veslují kostlivci, kteří nemluví a neumí bojovat. Kdo na ní spí, nesní. Jergal kdysi takovou měl. Karibrk ji zná jen z Dědkovy věty, kterou neměl slyšet. Čeká na 13. úroveň. **Zdroj:** Hrobopis, Karibrkův vlastní rukopis — kouzlo je zapsané v jeho knize. **TRVALÝ ZÁPIS:** od dokončení výtvor nevyžaduje soustředění a nemá časový limit. Trvá do zničení, Karibrkova trvalého odvolání nebo rozvázání kotvy. Klidová forma není zrušení: výtvor se pouze uspí a lze jej za 1 minutu znovu probudit bez další pozice, pokud má pro svou formu dost místa a potřebnou okolní hmotu.","src":"PJ","mech":{"škola":"nekromancie","dosah":"18 m","seslání":"1 hodina","trvání":"trvale, dokud není zničen, trvale odvolán nebo rozvázána kotva","složky":"V, S, M (loďka nebo vůz a kosti třiceti tvorů)","záchrana":"—","kostky":"—","soustředění":"ne","rituál":"ne","zdroj":"Hrobopis — Karibrkův vlastní výzkum"},"lvl":7},{"id":"hrobopis","type":"pravidlo","name":"Hrobopis — kouzla přetvořenců","alias":["přetvořenci","Hrobopisec"],"tags":["pravidlo","nekromancie","Karibrk"],"short":"Karibrkův vlastní rukopis nekromancie: trvalí přetvořenci, fyzické výtvory držené vazebním zápisem.","body":"Dvanáct kouzel (1.–7. úroveň), která Karibrk sepsal sám. Nový hlavní zákon: vytvoření stojí pozici a materiál, ale hotový přetvořenec už není dočasný efekt. Nevyžaduje soustředění a trvá do zničení, odvolání nebo rozvázání kotvy. Vazební limit = bonus zdatnosti Karibrka (7. úroveň: 3 navázaní celkem). Přetvořence lze na 1 minutu uspat do fyzické klidové formy a bez další pozice znovu probudit; klidová forma zachovává hmotu a logiku konkrétního výtvoru. Hrobový červ při spánku pustí vypůjčenou zeminu a stáhne se do kompaktního hrobního uzlu, ale Srostlík se do kapsy fakt nevejde a rakev zůstane rakví. Od 9 Pečetí budoucí Ossuárium řeší skutečné pohodlné skladování. Platí Nemrtví poddaní; Pečetě, Šev, Zákon zápisu a Hřbitovní půda podle aktivního Kodexu.","src":"PJ","mech":{},"lvl":null},{"id":"cesty-holek","type":"pravidlo","name":"Cesty — jak se z holek stává, čím budou","alias":["Cesty","sklony","povolání holek"],"tags":["pravidlo","Elie","Ula"],"short":"Každá cesta má 0–10 bodů. Body dává zážitek, učitel, Karibrk a hlavně jejich vlastní volba. Co se nerozvíjí, vyhasíná.","body":"Stupně: 1–2 Jiskra · 3–4 Zájem · 5–7 Učednice · 8–9 Řemeslo · 10 Povolání. Body: zážitek +1, učitel +1 (+2 když k němu mají silné pouto), Karibrkova podpora +1, vlastní volba +2; tlačení proti vůli −1 a Vzdor. Každou tendenu se naplno rozvíjí nejvýš dvě cesty, co tři tendeny nedostane nic, ztratí bod. Cesty se navzájem posilují i tlumí a u Uly hýbou karmou. Z 5 na 6 se jde jen tehdy, když Karibrk zařídí učitele, čas nebo peníze — to je hráčovo rozhodnutí. Imoenovo pravidlo: cestu jde změnit kdykoli, stará ale spí, dokud ji nová nepřeroste. Do boje to holky nepouští — nikdy. Plná pravidla: Kodex Hrobopisce, část Cesty.","src":"PJ","mech":{},"lvl":null},{"id":"kz-bg3-kyselinovy-strikanec","type":"kouzlo","name":"Kyselinový stříkanec","alias":["Acid Splash"],"tags":["kouzlo","trik","BG3","čaroděj"],"short":"1k6 kyselina, až dva cíle blízko sebe","body":"1k6 kyselina, až dva cíle blízko sebe. **Kdo ho umí:** kouzelník, čaroděj.","src":"kánon","mech":{"škola":"vyvolávání","dosah":"18 m","trvání":"okamžitě","záchrana":"záchrana Obr","kostky":"1k6 (2k6 od 5. úr.)","soustředění":"ne","rituál":"ne","povolání":"kouzelník, čaroděj","zdroj":"Baldur's Gate 3 (bg3.wiki)"},"lvl":0},{"id":"kz-bg3-ochrana-pred-cepelemi","type":"kouzlo","name":"Ochrana před čepelemi","alias":["Blade Ward"],"tags":["kouzlo","trik","BG3","čaroděj"],"short":"odolnost proti bodnému, sečnému a drtivému do tvého dalšího tahu","body":"Odolnost proti bodnému, sečnému a drtivému do tvého dalšího tahu. **Kdo ho umí:** bard, kouzelník, černokněžník, čaroděj.","src":"kánon","mech":{"škola":"vymítání","dosah":"ty","trvání":"1 kolo","záchrana":"—","kostky":"—","soustředění":"ne","rituál":"ne","povolání":"bard, kouzelník, černokněžník, čaroděj","zdroj":"Baldur's Gate 3 (bg3.wiki)"},"lvl":0},{"id":"kz-bg3-hrmici-cepel","type":"kouzlo","name":"Hřmící čepel","alias":["Booming Blade"],"tags":["kouzlo","trik","BG3","čaroděj"],"short":"útok zbraní; když se cíl pohne, 1k8 hrom","body":"Útok zbraní; když se cíl pohne, 1k8 hrom. **BG3:** v BG3 od Patche 8. **Kdo ho umí:** kouzelník, černokněžník, čaroděj.","src":"kánon","mech":{"škola":"zaklínání","dosah":"dosah zbraně","trvání":"1 kolo","záchrana":"útok zbraní","kostky":"zbraň + 1k8 hrom","soustředění":"ne","rituál":"ne","povolání":"kouzelník, černokněžník, čaroděj","zdroj":"Baldur's Gate 3 (bg3.wiki)"},"lvl":0},{"id":"kz-bg3-praskajici-slacha","type":"kouzlo","name":"Praskající šlacha","alias":["Bursting Sinew"],"tags":["kouzlo","trik","BG3","čaroděj"],"short":"rozerveš mrtvolu, 1k10 bodné v kruhu 3 m","body":"Rozerveš mrtvolu, 1k10 bodné v kruhu 3 m. **BG3:** původní kouzlo BG3 (Patch 8) — potřebuje mrtvolu v dosahu. **Kdo ho umí:** kněz, čaroděj.","src":"káno

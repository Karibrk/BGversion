tím, že „když to podělám, tak z něj bude polívka a to bych si nesl\"."},{"k":"p","t":"Volo odjel na sever. Ula ho okradla o dvě stříbrné a Karibrk to viděl a poprvé nic neřekl, a přesně z toho pak měl čtyři dny výčitky."},{"k":"h2","t":"X. VAROVÁNÍ"},{"k":"p","t":"Devatenáctý den dorazili do Dagerova brodu."},{"k":"p","t":"Je to první opravdové město, které holky viděly: hradby, dlažba, tři sta domů, tržiště, které se koná dvakrát týdně, a hlídky v barvách vévody, které se nudí tak, že je to na nich vidět. Ubytovali se v hostinci U Šesti stříbrných a Karibrk si obě holky posadil ke stolu a řekl jim to nejjednodušeji, jak uměl."},{"k":"p","t":"„Můžete kamkoli po tržišti. Můžete kamkoli po hlavní ulici. Můžete do stáje, do kostela, do krámu, kam chcete. Ale za tržnici, do těch uliček u řeky, nechoďte. Ani ve dvou, ani v poledne, ani na chvilku.\""},{"k":"p","t":"„Proč?\" zeptala se Ula."},{"k":"p","t":"A tady Karibrk udělal chybu, kterou si pak vyčítal tři dny — odpověděl jí pravdu, ale odpověděl jí ji krátce."},{"k":"p","t":"„Protože tam kupčí s lidma.\""},{"k":"p","t":"Kdyby jí to vysvětlil celé — kdyby jí popsal, jak to vypadá, jak to funguje, jak rychle to jde — možná by to dopadlo jinak. Ale on to řekl krátce, protože nechtěl, aby to Elie musela poslouchat, a Ula, která si třicet devět let vybírala, komu uvěří, tomu tak úplně neuvěřila. Dopoledne se ztratily."},{"k":"h2","t":"XI. TRŽNICE, KTERÁ NEBYLA TRŽNICE"},{"k":"p","t":"Stalo se to takhle, a Ula to pak vyprávěla jednou a už nikdy:"},{"k":"p","t":"Na tržišti stál stánek s cukrovím. Skutečné cukroví, barevné, na dřevěné tyčce, něco, co Ula viděla za třiapadesát let třikrát a nikdy neochutnala. Kluk u stánku jí řekl, že jich má víc vzadu, že ať jde za ním, že za tržnicí má bratr celý vozík."},{"k":"p","t":"Ula věděla, že to je blbost."},{"k":"p","t":"Ale Elie se na to cukroví dívala."},{"k":"p","t":"A Ula, která třicet devět let brala jídlo, kterým se nenajedla, pochopila v jedné vteřině, že tohle je poprvé, co může něco vzít pro někoho, kdo to ochutná."},{"k":"p","t":"Šly obě. Za tržnici, do uličky u řeky, kde nemají chodit."},{"k":"p","t":"Vozík tam byl. Cukroví na něm bylo. A byli tam čtyři chlapi a jeden vůz s plachtou a řetěz, a Ula stačila Elii strhnout za sebe a stačila jednomu z nich rozbít nos loktem, protože Ula umí prát se od svých čtrnácti, které trvají devětatřicet let."},{"k":"p","t":"Nestačilo to."},{"k":"h2","t":"XII. TŘI HODINY"},{"k":"p","t":"Družina to zjistila za dvacet minut, protože Kaštan."},{"k":"p","t":"Bílý slepý mlok vylezl Mer z pláště, slezl na dlažbu a šel k tržnici tak rovně, jak jde věc, která cítí smrt skrz kámen a ví, kudy prošel strach."},{"k":"p","t":"Skončilo to u skladiště na břehu Delimbiyru, jednoho z těch, které mají dvoje vrata a žádná okna."},{"k":"p","t":"Zhentarim. Ne velká ryba — obchodní stanice, sedm lidí, jeden kouzelník, dva psi. Zboží na jih do Amnu, kde se neptají."},{"k":"p","t":"A tady začíná ta část, kterou obě holky pochopily až za tři týdny."},{"k":"p","t":"Tina obešla skladiště za osm minut a vrátila se s tím, co potřebovali vědět: holky jsou uvnitř, jsou spolu, jsou v pořádku a jsou v kleci u zadní stěny — a mezi nimi a dveřmi je pět chlapů a kouzelník."},{"k":"p","t":"„Ohnivá koule to řeší,\" řekla Tina."},{"k":"p","t":"„Ohnivá koule to řeší i s nima,\" řekl Karibrk."},{"k":"p","t":"Ticho."},{"k":"p","t":"„A i kdyby ne,\" dodal, „tak se ta klec od Ohnivé koule rozžhaví a ony u toho budou. A i kdyby ne,\" a tady se poprvé zarazil, „tak uvidí, jak vypadá člověk, do kterého jsem hodil Ohnivou kouli. A já nechci, aby to Elie viděla. Ne po tom, co viděla ve skladu.\""},{"k":"p","t":"Sandor přikývl. „Tak jdeme dovnitř po svých.\""},{"k":"p","t":"„Cože?\" řekla Mer."},{"k":"p","t":"„Necháme se chytit,\" řekl Karibrk. „Jsme obchodníci, hledáme dvě uprchlé holky, jsme naštvaní a jsme neozbrojení. Oni nás zavřou. Až budeme uvnitř a až budeme mít všechny v jedné místnosti a holky za zády, tak to skončí za deset vteřin.\""},{"k":"p","t":"„To je ten nejpitomější plán, jaký jsem kdy slyšela,\" řekla Tina."},{"k":"p","t":"„Máš lepší?\""},{"k":"p","t":"Neměla."},{"k":"p","t":"Plán měl tři chyby a všechny tři vyšly najevo během první hodiny."},{"k":"p","t":"První: Zhentarim jim vzali víc věcí, než čekali, včetně Karibrkovy knihy — a nekromant bez knihy je pořád nekromant, ale je jich míň."},{"k":"p","t":"Druhá: nesvázali je do jedné místnosti s holkama. Svázali je vedle."},{"k":"p","t":"Třetí, a nejhorší: jejich kouzelník byl opatrný. Ne chytrý, opatrný. Neptal se, kdo jsou. Předpokládal, že lžou, a začal to ověřovat způsobem, který se ověřuje kleštěmi. Tři hodiny."},{"k":"p","t":"Tři hodiny, při kterých Sandor neřekl ani slovo, Mer se usmívala způsobem, ze kterého šla husí kůže i těm chlapům, Tina dvakrát omdlela a Karibrk počítal — nahlas, v hlavě, pořád dokola — kolik kroků je od jeho ramene k té zdi, za kterou byla klec."},{"k":"p","t":"Holky slyšely všechno."},{"k":"p","t":"To v tom plánu nebylo. Tohle nikdo nechtěl a nikdo to nepředpokládal, a Karibrk si to bude vyčítat déle než ty tři hodiny trvaly."},{"k":"p","t":"A pak přišla ta věta."},{"k":"h2","t":"XIII. VĚTA"},{"k":"p","t":"Vedoucí té stanice — chlap jménem Aldarin, dobře oblečený, klidný, ne krutý, a to je horší — přišel ve čtvrté hodině s papírem v ruce, protože i tenhle obchod se vede v knihách. Podíval se na klec, ve které seděly dvě holky, a řekl svému písaři, aniž by ztišil hlas, protože proč by ztišoval hlas před zbožím:"},{"k":"p","t":"„Ta menší je vadná, dej ji za šest. Ta starší vydrží, dej ji za dvacet. A nekrm je, do Amnu je to devět dní a nemá cenu do toho investovat.\""},{"k":"p","t":"Nebylo to sprosté. Nebylo to výhružné. Nebyla v tom zloba."},{"k":"p","t":"Byla v tom cena."},{"k":"p","t":"A v tu vteřinu se v té místnosti pokazily čtyři věci najednou."},{"k":"p","t":"Sandor — devatenáct let kat, který se každého zeptal, jestli má vzkaz — zvedl hlavu. Mer přestala se usmívat."},{"k":"p","t":"Tina, která měla ruce svázané za zády a zlomený prst, se začala smát a nemohla přestat. A Karibrk de Vill, hobit metr dvacet, který dvě hodiny nehnul brvou, řekl úplně klidně: „Řekni to znova.\""},{"k":"p","t":"Aldarin se otočil. „Prosím?\""},{"k":"p","t":"„To slovo. To první. Řekni ho ještě jednou.\""},{"k":"p","t":"A Aldarin, protože byl chlap, který nikdy nemusel čekat na odpověď, ho řekl ještě jednou. Karibrk neměl knihu."},{"k":"p","t":"Ale připravená kouzla nejsou v knize. Připravená kouzla jsou v hlavě a zůstávají tam celý den, a to je věc, kterou ví každý čaroděj a nikdo, kdo čaroděje jenom svazuje. Mlžný krok stojí bonusovou akci a nepotřebuje ruce."},{"k":"p","t":"Objevil se za Aldarinem."},{"k":"p","t":"Co se dělo pak, popsala Tina později u ohně čtyřmi slovy — „bylo to velmi rychlé\" — a víc se k tomu nikdy nevrátila, protože ta parta se na takové věci neptá."},{"k":"p","t":"Sandor přetrhl řemen, protože měl sílu devatenáct a protože ho někdo právě naštval, a k tomu, aby zabil dva lidi holýma rukama, nepotřeboval ani pět vteřin. Mer položila ruku na hruď kouzelníkovi a řekla mu, že je jí líto, že to nemůže udělat pomalu. Tina si vytrhla svůj vlastní zlomený prst z pout a šla po psech."},{"k":"p","t":"Deset vteřin to nebylo. Bylo to skoro čtyřicet."},{"k":"p","t":"A Karibrk stihl zavřít dveře do místnosti s klecí, než to začalo, což je to jediné, co si z toho večera nechal jako dobrou zprávu."},{"k":"h2","t":"XIV. CO VIDĚLY"},{"k":"p","t":"Když bylo po všem, otevřel ty dveře Sandor."},{"k":"p","t":"Půlork, dva metry, potrhaný, s rozbitým obočím a rukama, ze kterých kapalo něco, co nebylo jeho. Postavil se do dveří a řekl jedinou větu:"},{"k":"p","t":"„Zavřete oči a chyťte se mě.\""},{"k":"p","t":"Chytly se ho."},{"k":"p","t":"Nesl je oběma rukama, po jedné z každé strany, tři sta metrů uličkami k tržnici, a ani jedna z nich se nepodívala, protože jim to řekl a protože v tu chvíli by mu věřily cokoli. U kašny na náměstí je postavil na zem, klekl si k nim, aby byl na jejich úrovni — obr, který si dřepá, aby byl menší než dvě holky — a řekl to, co bylo potřeba říct dřív než cokoli jiného: „Není to vaše vina.\""},{"k":"p","t":"Ula začala vysvětlovat to cukroví."},{"k":"p","t":"„Není to vaše vina,\" zopakoval Sandor. „Udělaly jste blbost. Blbost a vina nejsou to samý. Blbost uděláš, když ti někdo nabídne něco, co jsi nikdy neměla. Vinu má ten, kdo to nabízí.\" Elie nemluvila. Elie nemluvila ještě další dva dny, i když bylo teplo a i když bylo bezpečno. Třetí den ráno, v táboře pod hrušní, si sedla vedle Karibrka a řekla: „Já jsem slyšela, co vám dělali.\""},{"k":"p","t":"„Já vím.\""},{"k":"p","t":"„Vy jste nekřičel.\""},{"k":"p","t":"„Ne.\""},{"k":"p","t":"„Proč?\""},{"k":"p","t":"Karibrk položil brko."},{"k":"p","t":"„Protože jsi to slyšela,\" řekl."},{"k":"p","t":"Elie se rozbrečela poprvé, co ji znali. Brečela dlouho a hlasitě a ošklivě, jak brečí devítileté děti, a Karibrk ji celou dobu držel a nadával přitom potichu, souvisle a velmi sprostě na všechno, co ho napadlo, protože jinak by brečel taky a to by nikomu nepomohlo."},{"k":"p","t":"Ula seděla dva kroky vedle. Nebrečela. Jenom se zeptala Sandora, jestli jí ukáže, jak se rozbíjí nos loktem správně."},{"k":"p","t":"Ukázal jí to. Cvičili to pak každý večer, celý zbytek cesty."},{"k":"h2","t":"XV. CO TO ZNAMENALO"},{"k":"p","t":"Byla to Mer, kdo to nakonec pojmenoval, dva dny nato."},{"k":"p","t":"Holky se ptaly — obě, poprvé společně — proč se nechali chytit. Proč nepřišli hned. Proč to trvalo."},{"k":"p","t":"A Mer jim to řekla přesně: „Protože kdybychom vykopli ty dveře, tak vás dostaneme ven za dvacet vteřin. A vy byste u toho viděly, jak vypadá sedm lidí, když je Karibrk zapálí zevnitř. To si nikdo z nás nepřál, abyste viděly. Tak jsme šli dovnitř po svých a spletli jsme se a zaplatili jsme za to.\" Ula tomu chvíli nerozuměla. Pak jí to došlo a bylo to na ní vidět."},{"k":"p","t":"„Vy jste se nechali mučit,\" řekla velmi pomalu, „abychom my dvě neviděly něco ošklivýho?\" „Jo,\" řekl Sandor od kotlíku. „A dopadlo to blbě. To se stává.\""},{"k":"p","t":"„To je nejpitomější věc, co jsem kdy slyšela.\""},{"k":"p","t":"„Taky myslím,\" řekla Tina se sádrou na ruce."},{"k":"p","t":"Ula se rozbrečela až tady. Ne kvůli sklepu, ne kvůli kleci, ne kvůli cukroví. Kvůli tomuhle."},{"k":"h2","t":"XVI. MINSC"},{"k":"p","t":"Dvaadvacátý den, na Obchodní stezce jižně od Dagerova brodu, potkali rangera s hlavou jako meloun a hlasem jako lavina."},{"k":"p","t":"Byl to obrovský Rašeman s vytetovaným obličejem, chodil sám, mluvil sám se sebou a v levé ruce nesl křečka."},{"k":"p","t":"Křeček se jmenoval Boo."},{"k":"p","t":"„Boo říká, že vy jste dobří lidé!\" zaduněl přes celou cestu. „Boo se v tom nemýlí! Boo je miniaturní obří vesmírný křeček a vidí do duší!\""},{"k":"p","t":"„Miniaturní obří,\" zopakoval Karibrk."},{"k":"p","t":"„ANO!\""},{"k":"p","t":"Elie se na toho křečka dívala tak, jak se předtím dívala na hvězdy."},{"k":"p","t":"Minsc — protože se tak jmenoval — jim vysvětlil, že je na cestě za spravedlností, že hledá svou svěřenkyni, že jeho hlava je občas „nemocná od rány mečem\" a že když se to stane, tak mu Boo poradí. Sandor mu dal najíst. Minsc snědl za tři lidi a pak Sandorovi třikrát potřásl rukou a řekl mu, že „půlorci mají velké srdce a ještě větší hrnce\"."},{"k":"p","t":"Elii posadil na ramena a nesl ji dvě míle a celou tu dobu jí vyprávěl o Rašemenu a o čarodějkách a o tom, že zlo se má kopat do zadku, ale zdvořile, protože i zlo bylo něčí dítě. Když se loučili, klekl si k Ule, vzal Boa do dlaně a řekl jí velmi vážně: „Boo mi říká, že tebe někdo držel a už tě nedrží. Boo říká, že to je nejlepší den, jaký může křeček zažít.\" Pak se rozzářil: „ZA BOOA A ZA SPRAVEDLNOST!\""},{"k":"p","t":"A odešel na sever s křečkem v ruce."},{"k":"p","t":"Karibrk se za ním díval a řekl to, co si mysleli všichni: „Ten chlap je úplně mimo.\" „Jo,\" řekla Mer."},{"k":"p","t":"„A kdyby to skladiště vykopával on, tak by nás nikdo nemučil.\""},{"k":"p","t":"„Jo.\""},{"k":"h2","t":"XVII. TIAX"},{"k":"p","t":"O dva dny později, ve vsi u Bystřin, na ně z bedny křičel gnóm."},{"k":"p","t":"Byl vysoký metr, měl na sobě roucho, které bylo příliš velké i na dospělého člověka, a oznamoval kolemjdoucím, že až přijde jeho čas, bude vládnout světu a všichni přítomní budou jeho poddaní, a ti, kdo mu teď dají minci, budou poddaní s výsadami."},{"k":"p","t":"Jmenoval se Tiax."},{"k":"p","t":"Ula mu dala měďák."},{"k":"p","t":"„PROČ jsi mu dala měďák?\" řekla Tina."},{"k":"p","t":"„Pojištění,\" řekla Ula."},{"k":"p","t":"Tiax jí za to vystavil listinu. Byl to kus pytloviny a bylo na něm napsáno PRVNÍ MINISTRYNĚ, což Ula nepřečetla, ale Karibrk jí to přečetl, a Ula si to schovala do těch samých záhybů, kam si schovává peníze, a nosí to dodnes."},{"k":"h2","t":"XVIII. VĚCI, KTERÉ HOLKY ZKUSILY POPRVÉ"},{"k":"p","t":"Za tři týdny to bylo tohle a Elie si to nechala napsat na pergamen, protože už uměla čtrnáct slov:"},{"k":"p","t":"Med. (Ula ho jedla lžící, dokud jí nebylo špatně. Podruhé.) Horká lázeň. (V Dagerově brodu. Ula byla ve vodě hodinu a deset minut a odmítala vylézt.) Postel s peřinou. (Elie první noc spala na podlaze vedle ní, protože ta postel byla „moc měkká, nedá se v tom nic hlídat\".) Sníh, který se dá jíst. (Ne ten ze silnice, řekl Sandor. Ten ze silnice ne.) Písnička, u které se tleská. (V hostinci v Bystřinách. Ula tleskala špatně a nikoho to nezajímalo.) Kůň, který je hodný. (Kůň jménem Řepa. Nechal se hladit. Elie pro něj tři dny nosila jablka.) Sýr, který smrdí a je dobrý. (Ula tomu odmítala uvěřit tři dny.) Plavat. (Mer je učila v tůni pod Bystřinami. Elie se to naučila za dvě hodiny. Ula ne — Ula se vody bojí a nikdo z toho nedělá vědu.) Dárek. (Sandor koupil Ule nůž. Ne zbraň — kuchyňský. „Až budeš vařit ty.\") Že ti někdo drží místo u ohně, i když jdeš pozdě."},{"k":"p","t":"Poslední bod nadiktovala Ula a Karibrk ho napsal bez komentáře."},{"k":"h2","t":"XIX. NOC PŘED BRÁNOU"},{"k":"p","t":"Poslední noc tábořili na kopci nad Dračí zátokou, odkud je vidět na jih, a bylo teplo, protože jih je teplý, což bylo pro obě holky další věc, kterou nikdo nečekal, že bude nutné vysvětlovat. Elie si sedla vedle Karibrka."},{"k":"p","t":"„Zítra tam budeme?\""},{"k":"p","t":"„Zítra tam budeme.\""},{"k":"p","t":"„A co budeme dělat?\""},{"k":"p","t":"Karibrk chvíli přemýšlel, jestli jí má říct pravdu, a pak si vzpomněl, že si to spolu takhle domluvili u kašny v Ostružné."},{"k":"p","t":"„Musíme prodat pár věcí, musíme koupit lepší vybavení, protože to naše je na hovno, a musíme najít někoho, kdo se vyzná v knihách. A pak se uvidí.\""},{"k":"p","t":"„A my dvě?\""},{"k":"p","t":"Tohle byla ta otázka. Karibrk věděl, že přijde, tři týdny."},{"k":"p","t":"„Vy dvě jste s náma,\" řekl. „Dokud to bude bezpečný, tak jste s náma. A až to nebude bezpečný, tak vás dám někam, kde to bezpečný bude, a nebude se mi to líbit a udělám to stejně, a ty se na mě budeš zlobit a já to snesu.\""},{"k":"p","t":"Elie o tom uvažovala."},{"k":"p","t":"„To je poctivá odpověď,\" řekla nakonec."},{"k":"p","t":"„Jiný nedělám.\""},{"k":"p","t":"Nad nimi svítily hvězdy, z nichž některé už dávno nebyly, a Elie na ně chvíli koukala. „Karibrku.\""},{"k":"p","t":"„Hm.\""},{"k":"p","t":"„Já jsem si dneska uvědomila, že už si nepamatuju, jak vypadal ten sklad zevnitř.\" Karibrk zavřel oči."},{"k":"p","t":"„To je dobře,\" řekl. „To je zatraceně dobře.\""},{"k":"h2","t":"XX. BRÁNA"},{"k":"p","t":"Dvacátý první den, hodinu před polednem, vyjeli z lesa nad Wyrmovým přechodem a pod nimi ležela Baldurova brána."},{"k":"p","t":"Nejdřív most. Dvoupatrový, obestavěný domy tak, že to je vlastně celá ulice postavená přes řeku, a na tom mostě je tolik lidí, že to vypadá jako mravenčí cesta. Za mostem hradby. Ne hradby jako v Dagerově brodu — hradby, vysoké jako sedm domů, s věžemi, na kterých stojí Ohnivá pěst v modrých pláštích."},{"k":"p","t":"A za hradbami město."},{"k":"p","t":"Elie vstala na korbě."},{"k":"p","t":"Ula vstala vedle ní."},{"k":"p","t":"Ani jedna neřekla ani slovo, a to u Uly nebylo nic zvláštního, ale Elii bylo teplo a bylo bezpečno a přesto nemluvila, protože pro tohle prostě neměla slova a nikdo by je neměl. Domy stály na sobě. Ne vedle sebe — na sobě, čtyři patra, pět, šest, střechy jako terasy, komíny, prádlo natažené mezi okny přes celou ulici. Zvony. Ne jeden zvon, dvanáct zvonů, každý jiný. Přístav plný stěžňů tak hustě, že to zdálky vypadá jako spálený les. Racci. Kouř. Křik trhovců, který sem doléhá jako moře."},{"k":"p","t":"A lidí."},{"k":"p","t":"Lidí bylo tolik, že Ula začala počítat a vzdala to na devadesáti."},{"k":"p","t":"„Kolik jich tam je?\" zeptala se."},{"k":"p","t":"Dědek, který za celý den neřekl ani slovo, odpověděl bez zaváhání:"},{"k":"p","t":"„Čtyřicet dva tisíc tři sta a něco. Uvnitř hradeb. Venku ještě jednou tolik.\" Ula se otočila na Elii."},{"k":"p","t":"Elie stála na korbě, jednu ruku měla na Karibrkově rameni, druhou si držela u pusy — ale ne aby si zakryla dech."},{"k":"p","t":"Aby jí nespadla brada."},{"k":"p","t":"„Tak jo,\" řekla Tina a plácla otěžemi. „Držte se něčeho. Na tom mostě jsou největší zloději na Meči pobřeží a já je znám jménem.\""},{"k":"p","t":"Vůz Brambora se rozjel z kopce dolů, k Wyrmovu přechodu, do města, kde se dá koupit všechno a kde nikdo nikoho nezná."},{"k":"p","t":"Za nimi zůstal sever, sklárna, která už nehoří, a tři sta jedna jmen, která někdo zapsal. Před nimi byla brána."},{"k":"p","t":"Konec mezihry."}],"id":"mezihra","era":"Mezihra"},{"title":"DOMOV — U Tří vran","blocks":[{"k":"p","t":"Jak parta zlých lidí koupila spálenou boudu, vyškubla ji ze"},{"k":"p","t":"zubů chamtivého mnicha a získala psa"},{"k":"h2","t":"I. NÁVRH, KTERÝ SE NA CHVÍLI ZVRHNE"},{"k":"p","t":"„Jestli na to máme,\" řekneš, „tak to kupujeme. Problémy, který vzniknou tím, že ty prachy nemáme, budeme řešit, až přijdou. A"},{"k":"p","t":"mimochodem — jsem si jistej, že těch pár zlaťáků tady vyděláme.\""},{"k":"p","t":"Fendrik Kolba za pultem přikývne s výrazem úředníka, který právě uzavřel obchod a je mu jedno s kým."},{"k":"p","t":"A pak tě něco napadne, a je to vidět na tvé tváři dřív, než to stačíš zamaskovat."},{"k":"p","t":"„Ale ještě mě něco napadá,\" řekneš, a hlas ti trochu ztvrdne. „Ten chuj, co nám to celý zkomplikoval. Ten mnich.\""},{"k":"p","t":"„Aldous Dorndel,\" řekne Fendrik opatrně, jako by to jméno mohlo být nakažlivé."},{"k":"p","t":"„Jo, ten. Víte, co bych z něj nejradši udělal? Zombíka, co se sám kope do ksichtu"},{"k":"p","t":"čtyřiadvacet hodin denně. Aby měl čas přemejšlet, co všechno v životě posral.\" Tina se zasměje nahlas, tím smíchem, který nikdy nezakrývá, jak moc ji něco baví. „A bohužel pro něj,\" pokračuješ, „a naštěstí pro nás — tedy pro mě, teda pro nás — já mám něco, co nechce jenom on. Chce to celej ten jejich zkurvenej hrad. Knihu, kterou ještě neviděli.\""},{"k":"p","t":"Dědek, který až dosud stál u okna a díval se ven, se otočí tak rychle, že to od něj nikdo nečeká."},{"k":"p","t":"„To říkám jenom proto,\" dodáš, „že mě fakt nasral. Rozhodl jsem se, že to od něj získáme.\" Odmlčíš se. „Za směšnou částku. Přesnej odraz toho, jak moc náma vyjebal, když věděl, že spěcháme.\""},{"k":"p","t":"„A ta čokoláda,\" řekne Mer suše, „byl žert, nebo to bereme jako oficiální požadavek?\""},{"k":"p","t":"Zarazíš se. Na vteřinu, možná dvě, je ti jasné, jak to muselo znít — hobit, co se rozhoduje mstít mnichovi v knihovně na druhém konci světa kvůli baráku, který ještě ani nemá střechu."},{"k":"p","t":"„Byl to žert,\" řekneš. „Napůl.\""},{"k":"p","t":"„A ta druhá půlka?\" zeptá se Tina."},{"k":"p","t":"„Ta druhá půlka chce tu čokoládu opravdu.\" Fendrik za pultem sleduje tuhle výměnu s výrazem člověka, který za patnáct let služby viděl leccos, ale málokdy viděl skupinu lidí, kteří se sami sebe zastavují uprostřed vyhrožování, protože si uvědomí, že to zachází moc daleko, a pak se vrátí zpátky, protože to vlastně ještě nezachází dost daleko."},{"k":"p","t":"„Takže,\" shrne to Sandor od dveří, „plán je: napíšeme mu dopis, ve kterým mu naznačíme, že máme knihu, o kterou by stál Candlekeep, a že ji dostane — nebo aspoň informaci o ní — jenom jestli nám prodá barák za babku a přihodí bonbony.\""},{"k":"p","t":"„V zásadě jo.\""},{"k":"p","t":"„To je vydírání.\""},{"k":"p","t":"„To je,\" souhlasíš. „Ale je to vydírání knihou, ne nožem, a to je u nás už pokrok.\""},{"k":"p","t":"Sandor na to nic neřekne, ale je vidět, že se mu ta logika líbí víc, než by přiznal."},{"k":"p","t":"„Já to napíšu,\" řekneš. „Dědku, ty mi řekneš, jak se to má vlastně formulovat, abych to"},{"k":"p","t":"neposral.\""},{"k":"p","t":"Dědek se poprvé za celý rozhovor usměje — a je to ten úsměv, který nevěstí nic dobrého pro nikoho, kdo není u vašeho stolu."},{"k":"p","t":"„To si nenechám ujít,\" řekne. „Konečně někdo, kdo si dovolí vyhrožovat knihovně.\""},{"k":"h2","t":"II. DOPIS"},{"k":"p","t":"Sednete si k tomu ještě ten večer, na stole svíčka, pergamen, brko, a Dědek, který nemůže psát, ale umí namíchat slova tak přesně, že to bolí i tebe, když je zapisuješ."},{"k":"p","t":"„Nezačínej vyhrůžkou,\" řekne. „Začni faktem. Fakta jsou horší než vyhrůžky, protože se s nima nedá polemizovat.\""},{"k":"p","t":"Napíšeš první větu."},{"k":"p","t":"„Ctihodný bratře Dorndele,\""},{"k":"p","t":"„Teď fakt.\""},{"k":"p","t":"„Jsem v současné době v držení nekatalogizovaného rukopisu, jehož obsah se týká přímé korespondence s bytostí ze Sigilu, správy duší nezapsaných v žádném známém registru a praktické aplikace nekromantického práva, které vaše knihovna dosud"},{"k":"p","t":"nezaznamenala v žádném exempláři.\""},{"k":"p","t":"„Dobrý,\" řekne Dědek. „Teď to, proč by mu to mělo vadit.\""},{"k":"p","t":"„Rozumím, že podobný text by měl v Candlekeepu jistou hodnotu. Bohužel jsem v poslední době nucen řešit spíše přízemní záležitosti — jako je pozůstalost po vaší rodině, kterou momentálně komplikujete svým lpěním na tržní ceně u nemovitosti, kterou jste patnáct let nepovažoval za hodnou zmínky.\""},{"k":"p","t":"Tina, která čte přes rameno, hvízdne. „To je zlý.\" „To je teprv rozehřívačka,\" řekne Dědek. „Teď přijde nabídka.\""},{"k":"p","t":"„Navrhuji tedy výměnu, která ušetří čas nám oběma: prodáte mi poštovní stanici U Tří vran za symbolickou částku jednoho zlatého, urychlíte veškeré papírování na straně Candlekeepu, a jako projev dobré vůle přiložíte bednu kvalitní čokolády — a já vám na oplátku zaručuji, že zmíněný rukopis dorazí do vaší knihovny k prostudování, s plným svolením k opisu.\" „A poslední věta,\" řekne Dědek, „musí být zdvořilá. To je to nejhorší, co mu můžeš udělat — bejt k němu naprosto slušnej, když ví, co jsi mu právě řekl.\""},{"k":"p","t":"„S upřímnou úctou k vašemu řádu a přáním pokojného studia, Karibrk de Vill.\""},{"k":"p","t":"Sandor si dopis přečte, jakmile ho dokončíš, a chvíli mlčí."},{"k":"p","t":"„Tohle je nejstrašidelnější věc, co jsem od tebe kdy viděl,\" řekne nakonec, „a viděl jsem tě oživovat mrtvoly.\""},{"k":"p","t":"„Je to dobrý?\""},{"k":"p","t":"„Je to dokonalý. Právě proto se to bojím.\" Zapečetíš to voskem, ne kroužkovým —"},{"k":"p","t":"obyčejným, protože tohle není žádná dustmanská záležitost, jenom obyčejná, upřímná lidská hrozba — a odneseš to na Gondovskou kurýrní stanici, kde ti účtují cenu, za kterou by se dal koupit slušný kůň, výměnou za slib, že to do Candlekeepu doletí za tři dny místo devíti."},{"k":"p","t":"„Drahý,\" poznamenáš cestou zpátky."},{"k":"p","t":"„Levnější než čtyři sta padesát zlatejch,\" odpoví Tina, a má pravdu."},{"k":"h2","t":"III. TÝDEN, KDY SE ČEKALO"},{"k":"p","t":"Čekání na odpověď netrávíte nečinně, protože nikdo z vás neumí být nečinný déle než hodinu. Tina obejde tři krámy s nářadím a vrátí se s pilami, kladivy, hřebíky v soudku a výrazem člověka, který si právě uvědomil, že neumí odhadnout, kolik hřebíků potřebuje dům, protože nikdy žádný nekupovala."},{"k":"p","t":"Sandor stráví dva dny tím, že chodí po tržnici a ptá se řezníků, pekařů a hostinských na věci, o kterých nikdo z vás netušil, že existují — jak se skladuje sůl, kolik soudků piva unese jeden vůz, proč se maso věší jinak v zimě než v létě. Vrací se domů s poznámkami, které nikdo kromě něj nepřečte, protože je píše vlastním systémem značek."},{"k":"p","t":"Mer stráví odpoledne v chrámu Ilmatera, ne kvůli mrtvým tentokrát — kvůli receptu na mast proti puchýřům, protože, jak řekne, „když budeme čtyři dny tahat trámy, tak to někdo bude potřebovat, a nebudu to já.\""},{"k":"p","t":"Ula sedí na dvoře domu paní Orlethové a učí se od Sandora vázat uzly — ne bojové, praktické, na trámy a lana — a je u toho vidět soustředění, jaké jste u ní zatím viděli jenom při krádeži. Elie si nechá od Karibrka napsat slovo STANICE a nosí ho v kapse jako talisman, protože je to první slovo, které se týká místa, kam patří ona sama, ne někoho jiného."},{"k":"p","t":"Šestý den dorazí odpověď."},{"k":"p","t":"Kurýr — mladý, unavený, s prachem tří dnů cesty na plášti — ji předá osobně, protože je zapečetěná candlekeepskou pečetí a takové věci se nedávají poslíčkům druhé ruky. Sedíte kolem stolu jako u soudu."},{"k":"p","t":"„Tak čti,\" řekne Tina."},{"k":"h2","t":"IV. ODPOVĚĎ"},{"k":"p","t":"Rozlomíš pečeť. Písmo uvnitř je úhledné, přesné, psané rukou někoho, kdo strávil život kopírováním cizích slov tak dlouho, že vlastní styl ztratil."},{"k":"p","t":"„Vážený pane de Ville,\""},{"k":"p","t":"„Váš dopis mě zastihl v okamžiku, kdy jsem právě dokončoval katalogizaci třinácti svazků o planárních smlouvách, a musím přiznat, že popis vašeho rukopisu vzbudil zájem, jaký jsem v posledních letech u sebe nepozoroval.\" „Zabral to,\" zamumlá Mer."},{"k":"p","t":"„Po konzultaci s Nejvyšším knihovníkem jsme dospěli k závěru, že hodnota potenciálního textu jednoznačně převažuje nad symbolickou"},{"k":"p","t":"hodnotou pozemku, který, jak sám přiznávám, jsem od smrti svého bratrance nikdy nenavštívil a k němuž necítím žádnou skutečnou vazbu.\" „Přikládám tedy plnou moc k prodeji za částku jednoho zlatého, jak jste navrhl, a veškeré dokumenty potřebné k okamžitému převodu. Trvám pouze na jedné podmínce: rukopis musí dorazit do Candlekeepu do jednoho roku, jinak si vyhrazuji právo požadovat doplatek tržní ceny.\" „Chocolate accompanies this letter as a gesture of good faith, though I confess some confusion as to why it was specifically requested.\" „Přešel do společný řeči,\" poznamená Dědek. „To dělaj, když jsou nervózní.\""},{"k":"p","t":"„S úctou, bratr Aldous Dorndel, archivář třetí třídy.\""},{"k":"p","t":"Ticho u stolu trvá dobrých pět vteřin. Pak Tina vybuchne smíchy tak silně, že musí odložit šálek, než ho rozlije."},{"k":"p","t":"„Jeden zlatej,\" řekne, když se konečně nadechne. „JEDEN ZLATEJ. My jsme se báli o čtyři sta padesát a on nám to prodal za cenu oběda.\""},{"k":"p","t":"„Protože jsem mu nabídl něco cennějšího,\" řekneš, a snažíš se, aby to neznělo tak spokojeně, jak se cítíš."},{"k":"p","t":"„Máš tam ale tu podmínku,\" poznamená Mer. „Rok. Pak to skutečně musíš do Candlekeepu odvézt.\""},{"k":"p","t":"„Odvezu,\" řekneš. „Rok je dlouho. A stejně jsem tu knihu chtěl jednou vidět uloženou pořádně, ne v Dědkově kapse.\""},{"k":"p","t":"Dědek si odfrkne, ale nůž do toho vrazí neschovaný: „Rubrika není na to, aby ji čet nějakej archivář třetí třídy.\""},{"k":"p","t":"„Bude to muset počkat rok,\" řekneš. „Teď máme barák.\""},{"k":"p","t":"Na dně balíku, zabalená ve voskovaném papíru, leží skutečně bedna čokolády — deset kusů, tmavé, cizí vůně, dovezené odkudsi z jihu, kam žádný z vás nikdy nedošel."},{"k":"p","t":"Elie se na to dívá s výrazem posvátné hrůzy. „Můžu?\""},{"k":"p","t":"„Je to tvoje stejně jako naše,\" řekneš. Zakousne se do prvního kusu a na tváři se jí objeví výraz, který by se dal popsat jenom jako objev nového smyslu."},{"k":"p","t":"„Tohle,\" řekne s pusou plnou čokolády, „je lepší než cukroví.\""},{"k":"p","t":"Nikdo se tomu srovnání nesměje. Všichni vědí, co znamená."},{"k":"h2","t":"V. DŮM ZÁZNAMŮ PODRUHÉ"},{"k":"p","t":"Fendrik Kolba vezme do ruky candlekeepský dokument, přečte si ho dvakrát, jako by nevěřil vlastním očím, a pak se na vás podívá s výrazem muže, který za patnáct let služby ještě neviděl transakci za jeden zlatý u nemovitosti v hodnotě čtyř set padesáti."},{"k":"p","t":"„Tohle je... neobvyklé,\" řekne opatrně. „Legální?\" zeptá se Tina."},{"k":"p","t":"„Naprosto. Jenom neobvyklé.\" Podívá se na tebe. „Smím se zeptat, co jste mu nabídl?\" „Ne,\" řekneš zdvořile."},{"k":"p","t":"Fendrik pokrčí rameny způsobem, který jasně říká, že tuhle odpověď čekal, a začne razit pečeti."},{"k":"p","t":"„Obchodní dům Sedm sluncí bude zklamaný,\" poznamená mimochodem, když podepisuje"},{"k":"p","t":"poslední list. „Nabízeli čtyři sta padesát a prohráli s jedním zlatým. To se jim nebude líbit.\""},{"k":"p","t":"„To přežijou,\" řekne Sandor."},{"k":"p","t":"„Pravděpodobně ano,\" souhlasí Fendrik. „Ale nedivte se, jestli se o vás časem budou zajímat víc, než by se vám líbilo. Lidi, co prohrajou takhle veřejně, si to pamatují.\""},{"k":"p","t":"Poznámka na později, kterou si nikdo z vás nezapisuje, ale nikdo ji taky nezapomene. Podepíšeš poslední kus pergamenu vlastním jménem, poprvé za dlouhou dobu na"},{"k":"p","t":"dokument, který nemá nic společného se smrtí nikoho."},{"k":"p","t":"„Gratuluju,\" řekne Fendrik a poprvé za celé jednání se usměje jako člověk, ne jako úředník. „Jste majitelé Poštovní stanice U Tří vran.\" VI. STĚHOVÁNÍ"},{"k":"p","t":"Vrátíte se tam odpoledne, celá parta, s vozem plným nářadí a s Elií, která celou cestu z kozlíku počítá, kolikrát uvidí budovu, než dojedete — a spočítá to špatně, protože se pokaždé znovu rozčílí radostí, když se objeví za dalším ohybem cesty."},{"k":"p","t":"Sandor sesedne první a udělá něco, co jste u něj nikdy neviděli: položí dlaň na kamennou zeď u vchodu a stojí tak dobrých deset vteřin, mlčky, jako by se zdi představoval."},{"k":"p","t":"„Tak,\" řekne nakonec. „Tohle je naše.\" Ula vběhne dovnitř dřív, než ji někdo stačí zastavit, a je slyšet, jak křičí ze všech koutů budovy postupně — „TADY BUDU SPÁT!\", pak o chvíli později z jiné místnosti „NE, TADY!\", a nakonec z podkroví, vítězoslavně, „TADYHLE JE NEJLÍP VIDĚT VEN, TAK TADY!\""},{"k":"p","t":"Elie jde pomaleji, s rukou na zdi, jako by chtěla cítit kámen pod prsty celou cestu. U krbu se zastaví nejdéle."},{"k":"p","t":"„Tady bude teplo,\" řekne. „Až to opravíte.\" „Až to opravíme my,\" opravíš ji. „Ty tady bydlíš taky. Znamená to, že opravuješ taky.\""},{"k":"p","t":"Podívá se na tebe s výrazem, který nemá jméno — směs překvapení a něčeho, co vypadá jako pýcha."},{"k":"p","t":"První noc spíte na zemi, na dekách, protože postele ještě nemáte a střecha nad hlavní místností pořád ukazuje na hvězdy skrz díry, které by se daly nazvat oknem, kdyby byly úmyslné."},{"k":"p","t":"Nikomu z vás to nevadí."},{"k":"p","t":"Sandor uvaří na ohni přímo na podlaze — improvizovaný, riskantní, přesně takový, jaký by v pořádném domě vůbec neměl být — a jídlo chutná líp než cokoli, co jste jedli za poslední měsíc, protože je to první jídlo uvařené na místě, které je vaše."},{"k":"p","t":"Dědek sedí u okna bez skla a dívá se ven na tmu, kde by měla být krajina, a je na něm vidět něco, co se za devět let neobjevilo — klid, který nepředstírá."},{"k":"p","t":"„Vypadáš spokojeně,\" poznamenáš."},{"k":"p","t":"„Jsem starý přes tisíc let a nikdy jsem neměl vlastní adresu,\" řekne. „Tohle je zvláštní pocit.\" „Dobrej, nebo špatnej?\""},{"k":"p","t":"„Nevím ještě. Zeptej se mě za rok.\""},{"k":"h2","t":"VII. PLÁN"},{"k":"p","t":"Ráno se sejdete kolem ohniště se seznamem, který napsala Tina — protože Tina umí počítat, i když to nikdo z vás nikdy nahlas nepřizná jako kompliment."},{"k":"p","t":"„Nejdřív střecha,\" řekne. „Bez střechy je všechno ostatní k ničemu, protože nám to zaprší.\""},{"k":"p","t":"„Pak krb a kuchyň,\" dodá Sandor. „Bez tepla a bez vaření nemá cenu tady dělat cokoliv jinýho.\""},{"k":"p","t":"„A pak společná místnost,\" uzavře Mer. „Protože jestli to má bejt hospoda, musí to aspoň vypadat jako hospoda, ne jako sklad.\" „Od nejdražšího a nejtěžšího,\" shrneš to, „k nejlehčímu. Ať to nejhorší máme za sebou, dokud jsme ještě nadšení.\""},{"k":"p","t":"Nikdo nenamítá."},{"k":"h2","t":"VIII. STŘECHA"},{"k":"p","t":"Práce na střeše trvá tři dny a je to práce, jaká z vás vymáčkne víc potu, než kolik jste čekali — trámy se musí vyměnit, tašky sundat, roztřídit na použitelné a nepoužitelné, nové dokoupit ve městě a dovézt."},{"k":"p","t":"[Hoď na tento úkol — padá čtrnáct.] Je to dobrý hod, ne zázračný — takový, po kterém věci jdou hladce, ale ne bez práce, a přesně to je práce na střeše: hladká, ale zatraceně náročná."},{"k":"p","t":"Sandor a Ula pracují nahoře, protože Ula je lehká a mrštná a nebojí se výšek způsobem, který by u někoho jiného byl neopatrnost a u ní je prostě fakt. Sandor jí podává trámy, ona je usazuje, a je mezi nimi vidět souhra, jakou byste nečekali od bývalého kata a bývalé zlodějky."},{"k":"p","t":"Třetí den, když sundáváte poslední vrstvu ohořelých tašek u štítu, najde Elie něco v sutinách — kus dřeva, začernalý, ale ne prohořelý skrz."},{"k":"p","t":"„Co je tohle?\" zeptá se a otře z něj popel rukávem."},{"k":"p","t":"Je to cedule. Stará, dubová, s vyřezanými třemi vránami v letu, a nápisem, který požár osmahl, ale nezničil: U TŘÍ VRAN."},{"k":"p","t":"Chvíli na to všichni civíte."},{"k":"p","t":"„Přežilo to oheň,\" řekne Mer tiše. „Jako ta budova.\""},{"k":"p","t":"„Necháme si to,\" řekneš, dřív než stačíš přemýšlet, jestli to má smysl. „Ne jako jméno. Jako — \" hledáš slovo „ —připomínku, že to tady bylo předtím, než jsme přišli my, a bude to tady, i až tu nebudeme.\""},{"k":"p","t":"Sandor to vezme do rukou, otočí ji, prohlédne řezbu."},{"k":"p","t":"„Dá se to opravit,\" řekne. „Jedna vrána chybí — asi ulomená. Ale zbylý dvě drží.\""},{"k":"p","t":"„Necháme dvě,\" řekne Elie rozhodně. „A třetí si vyřežeme sami. Novou.\""},{"k":"p","t":"Nikdo s tím nemá problém."},{"k":"p","t":"RODINA +75 — Elie našla kus historie ◆ ◆ místa a rozhodla se ho zachovat, ne zahodit. IX. KRB A STUDNA"},{"k":"p","t":"Kuchyně a krb jsou Sandorovo území, a je vidět, jak se do té práce vrhá s nadšením, které jinak schovává za mrzutost."},{"k":"p","t":"[Hoď na tento úkol — padá sedmnáct.] Je to výborný hod, a Sandor to pozná dřív, než mu to stačíš říct — kleká si ke krbu, oklepává saze, a čím víc jich odpadává, tím širší úsměv se mu objevuje na tváři."},{"k":"p","t":"„Tohle,\" řekne nahlas, spíš sobě než vám, „je zednický práce, jakou už dneska nikdo nedělá. Podívejte se na tu spáru. Podívejte se na ten tah.\" Poklepe na cihly klackem a poslouchá zvuk. „Tohle stavěl někdo, kdo to bral jako řemeslo, ne jako práci.\""},{"k":"p","t":"Vyčistí komín, zkontroluje tah kouře pomocí hořícího chomáče slámy, a kouř táhne nahoru tak čistě, že se ani nezakuckáte."},{"k":"p","t":"„Tenhle krb bude fungovat líp, než fungoval, když byl novej,\" prohlásí."},{"k":"p","t":"Studna ve stáji je stejně dobrá zpráva — voda čirá, chladná, bez zápachu — a když Sandor s Ulou prolézají starý sklep pod stájí, najdou tam poličku, o které nikdo netušil: šest"},{"k":"p","t":"zapečetěných soudků, uchráněných před ohněm i před časem, plných soli, sušených bylin a jednoho, který po otevření voní tak silně alkoholem, že se Ula rozkašle."},{"k":"p","t":"„Tohle je pěti nebo šestileté víno,\" řekne Sandor, čichaje k němu s výrazem znalce. „Nikdo je nesebral, protože nikdo nevěděl, že tu je.\""},{"k":"p","t":"„Kolik to má cenu?\" zeptá se Tina okamžitě, protože Tina se na věci ptá takhle vždycky první."},{"k":"p","t":"„Dost, aby se vyplatilo ho neprodat a nechat si ho na otevření,\" odpoví Sandor."},{"k":"p","t":"ŘEMESLO +100 — Sandorovo oko a ruce ◆ ◆ udělaly z ohořelé kuchyně něco, co bude fungovat líp, než fungovalo předtím."},{"k":"h2","t":"X. SPOLEČNÁ MÍSTNOST"},{"k":"p","t":"Poslední velký úkol je hlavní místnost — stoly, lavice, něco, co promění holou kamennou síň v místo, kam by člověk chtěl vejít."},{"k":"p","t":"[Hoď na tento úkol — padá osmnáct.] Je to skoro nejlepší možný výsledek, a projeví se to způsobem, který nikdo nečekal: druhý den prací se na dvoře objeví vůz a z něj vystoupí dva lidé, které jste v životě neviděli. Starší muž, šedivý, s rukama plnýma mozolů — truhlář jménem Ossvin, který prý „slyšel ve městě, že se tu někdo pouští do Tří vran, a nemoh tomu jenom tak přihlížet, protože sem jako kluk nosil dopisy, než to vyhořelo\". A s ním mladá žena, štíhlá, ušmudlaná od barvy, která se představí jako Seska — malířka štítů a vývěsních cedulí, „protože jsem slyšela, že budete potřebovat něco na dveře, a náhodou jsem zrovna bez práce\"."},{"k":"p","t":"„Kolik chcete za pomoc?\" zeptáš se opatrně, protože nic není zadarmo a čtyřicet let praxe tě naučilo tomuhle nevěřit."},{"k":"p","t":"Ossvin se na tebe podívá s upřímným údivem. „Teplé jídlo a místo u ohně na noc,\" řekne. „A možná skleničku toho vína, co jste prej našli ve sklepě — o tom se ve městě už taky mluví, nevím jak, ale mluví.\""},{"k":"p","t":"Ukáže se, že Ossvin umí ze starého dřeva, které jste odkládali jako nepoužitelné, postavit stoly a lavice, jaké byste sami nedokázali za týden, a Seska stráví večer skicováním návrhů na novou ceduli — s dvěma starými vránami a jednou novou, přesně jak jste si přáli. „Proč nám vlastně pomáháte?\" zeptá se Mer přímo, protože Mer se ptá přímo vždycky. Ossvin pokrčí rameny. „Tohle místo bejvalo dobrý, než vyhořelo. Lidi na něj vzpomínaj. Je hezký vidět, že se znova otevře, místo aby z něj Sedm sluncí udělalo další překladiště.\" Ta věta zůstane viset ve vzduchu déle, než by čekal, a nikdo z vás neřekne nahlas, jak moc jí rozumíte — protože poprvé v životě jste na straně těch, o kterých se mluví hezky, ne na straně těch, před kterými se lidi schovávají. RODINA +50 — cizí lidé přišli pomoct"},{"k":"p","t":"◆ ◆ zadarmo, protože jim na tomhle místě záleželo dřív, než na něm začalo záležet vám."},{"k":"h2","t":"XI. PRVNÍ VEČEŘE POD VLASTNÍ STŘECHOU"},{"k":"p","t":"Pátý den je hlavní místnost hotová natolik, že se dá posadit ke stolu, ne na podlahu, a Sandor k té příležitosti uvaří jídlo, které by v Ostružné stálo víc, než jste tam za měsíc vydělali. Ossvin a Seska zůstávají na večeři — Seska mezitím dokončila novou vývěsní ceduli, opřenou zatím o zeď, čekající na hřebíky — a je to poprvé, co má vaše dlouhá kuchyňská tabule víc lidí, než kolik jich patří do rodiny. „Máte už jméno?\" zeptá se Ossvin mezi"},{"k":"p","t":"soustem."},{"k":"p","t":"Ticho."},{"k":"p","t":"„Ne úplně,\" přiznáš."},{"k":"p","t":"„U Tří vran je zabraný,\" poznamená Seska. „To bylo jméno tý starý stanice. Můžete si ho nechat, nebo si vymyslet novej.\""},{"k":"p","t":"„U Spáleného komína,\" navrhne Mer znovu, s tím samým úsměvem jako minule."},{"k":"p","t":"„To pořád zní jako varování,\" řekne Tina. „Přesně,\" zopakuje Mer."},{"k":"p","t":"Elie, která poslouchá celou dobu mlčky, najednou promluví — je teplo, je v bezpečí, a to jí dovoluje mluvit i o věcech, na které by se jinak nezeptala."},{"k":"p","t":"„Co třeba nechat starý jméno na ceduli,\" navrhne, „ale říkat tomu mezi sebou jinak? Aby to venku bylo U Tří vran, jak to bylo vždycky, a doma to bylo něco jenom naše?\""},{"k":"p","t":"Ticho u stolu, tentokrát jiného druhu. „To je dobrej nápad,\" řekne Sandor pomalu. „Necháme si to na potom,\" rozhodneš. „Ať to jméno přijde, až přijde. Nebudeme ho honit.\" Nikdo nenamítá. Ossvin s Sesskou tu noc zůstanou spát u krbu a ráno odejdou zpátky do města s penězi, které přijali neochotně a jenom proto, že jste trvali, a se slibem, že se stavíte, „až to tu bude vypadat, jak má\"."},{"k":"h2","t":"XII. DEN PRO PSA — ZAČÁTEK"},{"k":"p","t":"Rozhodneš se pro to ráno, aniž bys to komukoli oznámil dopředu, kromě jedné věty u snídaně. „Dneska nepracujeme na baráku,\" řekneš. „Dneska máme jinej úkol.\""},{"k":"p","t":"Elie na tebe kouká s lžící v půli cesty k puse. „Slíbil jsem ti psa,\" řekneš. „Dneska ho seženeme. A budeme na to mít celej den, protože tohle se nedá uspěchat.\""},{"k":"p","t":"Rozšíří se jí oči tak, že to bolí i tebe. Nejdřív jedete k Renfeldovi, do zvěřince U Divých duší, protože je to první místo, které vás napadne — vždyť tam Elie potkala Kála. Renfeld vás uvítá s dýmkou v koutku úst a s výrazem, který jasně říká, že ví přesně, proč jste přišli."},{"k":"p","t":"„Pes, jo,\" řekne. „Mám tu pár kusů. Pojďte se podívat, ale rovnou vám řeknu, že nevím, jestli vám bude co sedět.\""},{"k":"p","t":"První pes, kterého ukáže, je mohutný, s čelistmi jako svěrák a pohledem, který na první podívání říká „nedůvěřuj mi\"."},{"k":"p","t":"„Tenhle je hlídač z chovu na jihu,\" vysvětlí Renfeld. „Silnej, spolehlivej, ale potřebuje pevnou ruku a rok výcviku, než mu budete moct věřit s dítětem.\""},{"k":"p","t":"Karibrk se podívá na Elii. Elie se podívá na psa, který na ni vrčí zpod obočí, a udělá krok zpátky. „Ne tenhle,\" řekne tiše."},{"k":"p","t":"Druhý pes je přesný opak — malý, kudrnatý, s mašličkou na krku, kterou mu tam někdo uvázal z legrace nebo z lásky, a štěká tak vysokým hlasem, že Sandor sebou trhne. „Tenhle je z pozůstalosti jedný starý dámy,\" řekne Renfeld s neskrývaným pobavením. „Je milej. Je taky asi tak velkej jako moje bota.\" „Ne,\" řekne Karibrk okamžitě, dřív než stačí kdokoli cokoli namítnout. „Žádná čivava. Potřebuje psa, kterej ji ochrání, ne psa, kterej se schová jí do kapsy.\""},{"k":"p","t":"Renfeld se zasměje, jako by tohle přesně čekal. „Tak to tu pro vás nemám,\" řekne. „Ale znám chlapa. Farmář, dvě míle od tý vaší spálený stanice, jestli se nepletu. Ovčácký psi, pracovní, velký, chytrý. Měl prej minulej tejden vrh.\" XIII. TEN PRAVÝ"},{"k":"p","t":"Farma leží přesně tam, kde Renfeld řekl — kousek od vaší vlastní cesty, tak blízko, že je až absurdní, že jste o ní dosud nevěděli. Farmář, statný chlap jménem Bertold, vás zavede k boudě za stodolou, kde se v slámě povaluje šest štěňat kolem unavené, ale spokojené feny."},{"k":"p","t":"„Ovčáci,\" vysvětlí. „Máma hlídá stádo už šest let, ani jednou neztratila jehně vlkovi. Štěňata budou stejný, jak vyrostou.\""},{"k":"p","t":"Elie si klekne do slámy, opatrně, jako by se bála, že něco zkazí, jenom tím, že se přiblíží. Pět štěňat se od ní odplazí nebo zůstane ležet, zaujatá vlastními packami."},{"k":"p","t":"Šesté — tmavé, s bílou skvrnou na hrudi, o něco větší než ostatní — zvedne hlavu, podívá se na ni přes celou boudu, a pak se k ní rozeběhne tak rychle, jak to jeho packy dovolí, a vrazí do ní čumákem s takovou silou, že Elie spadne na záda a začne se smát způsobem, jaký jste od ní ještě neslyšeli — nahlas, nekontrolovaně, s tím štěnětem, které jí olizuje obličej a vrtí ocáskem tak zběsile, že mu poletuje celé pozadí."},{"k":"p","t":"„Tohle se stává málokdy,\" řekne Bertold tiše, s upřímným úžasem v hlase. „Von si obvykle vybíraj sami, jo, ale takhle rychle a takhle jasně jsem to ještě neviděl. Von si ji vybral hned, jak vešla dovnitř.\""},{"k":"p","t":"Elie leží na zádech ve slámě, se štěnětem na hrudi, a řekne — zadýchaně, mezi smíchy — jedinou větu, kterou v tu chvíli potřebuje říct: „Tenhle.\""},{"k":"p","t":"Nikdo se nehádá."},{"k":"p","t":"RODINA +150 — Elie našla něco, co si ◆ ◆ vybralo ji stejně rychle, jako ona vybrala jeho. Zaplatíš Bertoldovi cenu, kterou navrhne sám, a přidáš tolik navíc, že se začne ošívat a odmítat, dokud mu nevysvětlíš, že to je za ty jehňata, co mu nikdy vlk nevezme, protože jeho máma odvedla dobrou práci — a tohle štěně bude taky."},{"k":"p","t":"„Jak se jmenuje?\" zeptá se Bertold Elie, když vás doprovází k vozu."},{"k":"p","t":"Elie se zamyslí, štěně pevně v náručí. „Ještě nevím,\" řekne. „Musím se ho nejdřív dobře podívat.\""},{"k":"h2","t":"XIV. PRVNÍ NOC S PSEM"},{"k":"p","t":"Cestou zpátky štěně usne Elii na klíně a ona se ani nehne, aby ho nevzbudila, celou cestu, i když jí musí dávno brnět nohy."},{"k":"p","t":"Doma ho položí na deku u krbu a sleduje ho, jak spí, s výrazem, který nikdo z vás nikdy neviděl na tváři dítěte, které si celý život myslelo, že je vadné."},{"k":"p","t":"Večer, když se všichni chystají ke spánku, se štěně náhle probudí, zvedne hlavu, a začne vrčet — tiše, ale jasně, směrem ke dveřím. Sandor je okamžitě na nohou, ruka na sekeře. Za dveřmi nic není. Jenom liška, která zabloudila na dvůr a teď rychle utíká pryč, vyplašená tím zvukem zevnitř."},{"k":"p","t":"„Tak tohle je dobrý znamení,\" řekne Sandor, uvolní se, a podívá se na štěně s novým respektem. „Nemá ani deset tejdnů a už hlídá.\" Elie ho vezme zpátky do náruče, kde se okamžitě uklidní a znovu usne, jako by věděl, že svou práci na dnešek udělal a teď je čas si zasloužit odpočinek."},{"k":"p","t":"„Uhlík,\" řekne Elie tiše, spíš sama pro sebe, a pak to zopakuje nahlas, jistěji. „Bude se jmenovat Uhlík.\""},{"k":"p","t":"„Proč Uhlík?\" zeptá se Ula."},{"k":"p","t":"„Protože je tmavej,\" řekne Elie, „a protože se narodil kousek odsud, blízko baráku, kterej vyhořel, a přesto z toho vzniklo něco dobrýho. Jako uhlík, co nevyhasnul úplně a z něj se dá zase zapálit oheň.\""},{"k":"p","t":"Nikdo u toho vysvětlení nic nedodá, protože není co dodat."},{"k":"p","t":"RODINA +100 — Uhlík dostal jméno, které ◆ ◆ v sobě nese celý příběh místa, kde teď bydlí. XV. ZAKOŘENĚNÍ"},{"k":"p","t":"O týden později stojíte na dvoře Poštovní stanice U Tří vran a díváte se na to, co jste udělali: střecha celá, komín táhne, hlavní místnost má stoly, lavice i novou vývěsní ceduli s dvěma starými vránami a jednou čerstvě vyřezanou třetí, kterou vyřezal Sandor a domalovala Seska, když se stavila podruhé. Uhlík pobíhá po dvoře za Skořápkou, která ho okamžitě začala nenávidět s vervou, jaká se od husy dá čekat, a on to bere jako hru."},{"k":"p","t":"Ula sedí na schodech s nožem v ruce a vyřezává si do dřevěného zápraží vlastní jméno, malé, v koutě, kde si myslí, že to nikdo neuvidí — ale všichni to uvidí, a nikdo jí to nikdy nevytkne."},{"k":"p","t":"Dědek stojí u studny a dívá se na vodu tak dlouho, že se ho Mer nakonec zeptá, co tam vidí."},{"k":"p","t":"„Nic,\" řekne. „Poprvé za tisíc let se dívám do vody a nevidím nic zvláštního. Jenom vodu. Je to fajn pocit.\""},{"k":"p","t":"Sedneš si na zápraží vedle Elie, která hladí Uhlíka a dívá se na cestu, po které jste sem před dvěma týdny poprvé přijeli."},{"k":"p","t":"„Je to divný,\" řekne. „Poprvý v životě vím, kam se vracím, když někam jdu.\""},{"k":"p","t":"„To je dobrej pocit,\" řekneš."},{"k":"p","t":"„Je,\" souhlasí. „Je to nejlepší pocit, jakej znám. A já teď znám hodně pocitů, protože jste mě to naučil.\""},{"k":"p","t":"Podíváš se na budovu za sebou — kamennou, opravenou, s cedulí, která nese jméno starší než vy všichni dohromady, a s lidmi uvnitř, na kterých vám záleží víc, než jste si kdy mysleli, že vám může záležet na komkoli."},{"k":"p","t":"Nemáš to slovo pro to, co cítíš. Čtyřicet let jsi uměl pojmenovat cokoliv, a tohle pořád ne. Možná to slovo přijde. Zatím ti stačí, že to místo existuje, že má střechu, krb, a psa, co hlídá dveře."},{"k":"p","t":"Zatím to stačí."},{"k":"p","t":"Konec."}],"id":"domov","era":"Baldurova brána","d0":1,"d1":10},{"title":"HRANICE — perimetr","blocks":[{"k":"p","t":"Jak parta lidí, co si právě uvědomila, že tlusté zdi nestačí,"},{"k":"p","t":"našla způsob, jak si postavit vlastní hranici"},{"k":"h2","t":"I. RÁNO PO"},{"k":"p","t":"Spíte skoro do poledne — první skutečný spánek po nejhorší noci, jakou tenhle dům zažil od svého vlastního požáru — a když se"},{"k":"p","t":"probudíte, dvůr venku pořád páchne spáleným masem a je na něm rozkopaná hlína tam, kde Sandor s Tinou pracovali u stáje."},{"k":"p","t":"Sejdete se u stolu, mlčky, jeden po druhém, a nikdo se neptá, jak se komu spalo, protože odpověď je vidět na každém z vás stejně. „Musíme si promluvit o zdech,\" řekne Sandor nakonec, a je to první celá věta toho dne. „Nemáme zdi,\" odpoví Tina. „Máme jedny dveře a spoustu oken, co se dají rozbít loktem.\" „To jsem myslel.\""},{"k":"p","t":"Sedíte tam dobrou hodinu, každý s hrnkem něčeho horkého, a snažíte se dát dohromady, co vlastně chcete. Ne mluvíte o tom, co se stalo v noci — na to je pořád příliš brzo — mluvíte o tom, co se nesmí stát znova."},{"k":"p","t":"„Chci vědět, když se něco přiblíží,\" řekneš. „Ne až to zaklepe na dveře. Dřív.\""},{"k":"p","t":"„Chci, aby to, co se přiblíží, nemohlo dovnitř,\" dodá Mer. „Ani kdyby vědělo, že tam jsme.\" „A chci,\" řekne Ula tiše, poprvé od rána, „aby to platilo pro celej pozemek. Ne jenom pro barák. Protože včera stály přesně tady, na dvoře, a nikdo je neviděl přijít.\""},{"k":"p","t":"Nikdo s tím nepolemizuje. Nikdo se jí taky nedívá do očí déle, než je nutné — ne z odporu, ale protože všichni vědí, čím si tahle noc prošla, a nikdo neví, jak se k tomu postavit."},{"k":"p","t":"„Dobře,\" shrneš to. „Padesát metrů kolem baráku. Nikdo, kdo nemá heslo, věc nebo naše svolení, se nedostane dovnitř. A budeme to vědět dřív, než to zaklepe.\""},{"k":"p","t":"„To zní jednoduše,\" poznamená Tina."},{"k":"p","t":"„Zní,\" souhlasíš. „Uvidíme, jak jednoduchý to bude doopravdy.\""},{"k":"h2","t":"II. PROVAZY A ZVONKY"},{"k":"p","t":"První nápad je ten nejlevnější, a proto ho zkusíte první."},{"k":"p","t":"Tina navrhne obyčejné tripwiry — provaz natažený nízko mezi stromy a kolíky, na němž visí staré plechové hrnky a zvonky, které koupíte na tržišti za pár měďáků. „Když někdo šlápne na provaz, tak to zacinká. Jednoduchý, levný, a funguje to i bez kouzel.\""},{"k":"p","t":"Strávíte tím celé odpoledne — natahujete provaz kolem hranice, kterou jste si vyměřili kroky (Mer chodí a počítá, protože Mer jediná umí počítat na sto a nesbíhat se u toho), věšíte zvonky, testujete, jestli to drží."},{"k":"p","t":"Funguje to. Té noci."},{"k":"p","t":"[Test první noc.] Ve dvě ráno vás vzbudí cinkání — všichni jste na nohou, zbraně v rukou, srdce vám bijí jak o závod — a je to liška. Obyčejná, vyplašená liška, co se zamotala do provazu a teď panikaří tak silně, že cinká celá tahle strana pozemku. Ve čtyři ráno vás vzbudí cinkání znovu. Tentokrát jelen."},{"k":"p","t":"V šest ráno je to Uhlík, který se v noci vyplížil ven a rozhodl se prošetřit, proč to tam tak zajímavě cinká."},{"k":"p","t":"„Tohle nefunguje,\" řekne Sandor ráno, s očima podlitýma únavou, a nikdo mu neoponuje. „Problém není v tom, že to nefunguje,\" opraví ho Mer. „Problém je, že to funguje na všechno. Potřebujeme něco, co pozná rozdíl mezi liškou a člověkem, co nás chce zabít.\""},{"k":"p","t":"Sundáváte zvonky ještě to samé odpoledne. III. NAJATÍ LIDÉ"},{"k":"p","t":"Druhý nápad přijde od Tiny, přirozeně, protože Tina zná ve městě víc lidí než kdokoli z vás dohromady."},{"k":"p","t":"„Můžeme si najmout hlídače,\" navrhne. „Pár chlapů, co budou chodit kolem v noci."},{"k":"p","t":"Feldepost by mi jich sehnal dost — bejvalí žoldáci, co teď nemaj práci, protože válka, ve který bojovali, skončila.\""},{"k":"p","t":"Zkusíte to. Najmete tři muže — Bracka, Toma a mladíka jménem Ossin (ne, jiný Ossin než truhlář, na to vás upozorní hned první den, s jistou dávkou popuzenosti) — a zaplatíte jim slušně za noční hlídky."},{"k":"p","t":"[Zkouška druhého řešení.] Trvá to čtyři dny, než zjistíte, co je špatně. Ne že by nepracovali poctivě — pracovali. Ale čtvrtou noc přijde Tina k tobě s výrazem, který nevěstí nic dobrého, a řekne ti to přímo: „Brack se ptal Ossina, proč máme tak dobrý zámky na sklepě, když je to jenom hospoda. A pak se ptal, jestli jsme fakt tak bohatí, jak to vypadá.\" „To je jenom zvědavost,\" namítneš."},{"k":"p","t":"„Zvědavost, kterou pak řekne kámošovi v hospodě u řeky, a ten kámoš to řekne dalšímu,\" odpoví Tina. „Kari, jestli chceme, aby o nás nikdo nevěděl víc, než musí, tak nemůžeme platit lidem, aby chodili kolem baráku a koukali se dovnitř.\""},{"k":"p","t":"Máte pravdu, uvědomíš si, a je to nepříjemná pravda, protože znamená, že tenhle problém se nedá vyřešit penězi ani cizíma rukama."},{"k":"p","t":"„Musí to bejt někdo z nás,\" řekneš nahlas, „nebo něco, co není člověk a nemá s kým klábosit v hospodě.\""},{"k":"p","t":"Propustíte hlídače s dvojnásobnou odměnou a slibem doporučení, a vrátíte se tam, kde jste začali."},{"k":"h2","t":"IV. POPLACH"},{"k":"p","t":"Čtvrtý pokus je první, který zahrnuje skutečnou magii, a je to Karibrkův nápad, protože je to jediné kouzlo, které zná a které se na tohle aspoň trochu hodí."},{"k":"p","t":"Sesíláš Poplach — rituálem, ne pozicí, protože rituál stojí čas navíc, ale ne kouzelnou energii, a tu budeš potřebovat na jiné věci — a nastavíš neviditelnou hranici kolem stavení."},{"k":"p","t":"[Test s Poplachem.] Funguje to o poznání líp než provazy. Poprvé, když ho spustíš, zafunguje na formana, co jel kolem po cestě a ani nevěděl, že přes tu hranici prošel — mentální poplach tě probudí přesně, jak má, a je to skutečně on, ne liška."},{"k":"p","t":"Problém je jinde."},{"k":"p","t":"„Jak dlouho to drží?\" zeptá se Sandor druhý den ráno."},{"k":"p","t":"„Osm hodin,\" odpovíš. „Pak to musím seslat znova.\""},{"k":"p","t":"„A pokrývá to celej perimetr? Padesát metrů kolem?\""},{"k":"p","t":"Podíváš se na to, co jsi vlastně sesílal, a je ti to trapně jasné. „Ne. Pokrývá to dvacet stop na stranu od místa, kde stojím, když to sesílám. Abych pokryl padesát metrů, musel bych to sesílat na pěti, šesti různejch místech, a pak si to pamatovat, a pak to všechno obnovovat každejch osm hodin, což znamená, že nikdy nebudu moct spát celou noc, aniž bych se aspoň jednou probudil a obnovil to.\""},{"k":"p","t":"„To není udržitelný,\" řekne Mer."},{"k":"p","t":"„To není udržitelný,\" souhlasíš, unaveně, a je to už čtvrtý den, kdy tahle věta padne u vašeho stolu."},{"k":"h2","t":"V. ALDETH MIZERÁK"},{"k":"p","t":"Pátý pokus vás zavede zpátky do města, do úzkého domu se zeleným sklem v okně, kde zvonek nezvoní, ale hřeje."},{"k":"p","t":"Aldeth Mizerák tě uvítá s výrazem člověka, který si pamatuje každého zákazníka a jejich problémy přesně, a když mu vysvětlíš, co potřebuješ, chvíli mlčí a pak vytáhne z police tři různé svitky."},{"k":"p","t":"„Strážné runy,\" řekne. „Zapíšou se do kamene nebo do dřeva, aktivují se dotykem nebo slovem, a fungují, dokud je někdo nesmaže nebo dokud nevyprší jejich vlastní čas. Nejsou levné, a nejsou nekonečné, ale fungují"},{"k":"p","t":"spolehlivěji než improvizovaný kouzla.\" Koupíš šest run — je to většina toho, co vám zbylo po opravách a po Uhlíkovi — a strávíte další dva dny tím, že je rozmisťujete po perimetru."},{"k":"p","t":"[Instalace run.] Šestý den v noci to poprvé zafunguje"},{"k":"p","t":"doopravdy — jedna z run se rozzáří a ohlásí přítomnost něčeho na severní straně pozemku, u lesa. Vyběhnete ven, připraveni na cokoli. Je to srnec."},{"k":"p","t":"„Runy neumí poznat rozdíl mezi člověkem a zvířetem o nic líp než ty zvonky,\" řekne Tina, hlas na pokraji trpělivosti."},{"k":"p","t":"„To se dá naladit,\" oponuje Aldeth, když se druhý den vrátíte s reklamací. „Ale bude to stát další peníze, a i tak vám řeknu rovnou: šest run nepokryje padesát metrů kolem"},{"k":"p","t":"nepravidelnýho pozemku. Les na jedný straně, cesta na druhý, studna, stáj — to není hladká, kruhová plocha. To je členitej terén, a runy fungujou nejlíp na rovných liniích, ne na křivkách kolem lesa a plotu.\""},{"k":"p","t":"„Kolik run bychom potřebovali na celej perimetr pořádně?\" zeptáš se."},{"k":"p","t":"Aldeth si to spočítá v hlavě, a jeho odpověď je číslo, které vás všechny umlčí na dobrou minutu."},{"k":"p","t":"„To je víc, než jsme vydělali za celej tenhle měsíc,\" řekne Tina nakonec."},{"k":"p","t":"„A i pak,\" dodá Aldeth, protože je to poctivý obchodník a neprodá vám něco, o čem ví, že to nebude fungovat, „to nebude neprůstřelný. Runy se dají obejít, jestli víte jak. Nejsou to zdi. Jsou to jenom hlasitý varování.\""},{"k":"h2","t":"VI. ÚLOMEK"},{"k":"p","t":"Vrátíte se domů poražení, unavení, a s pocitem, že jste vyzkoušeli všechno, co existuje, a nic z toho nestačí."},{"k":"p","t":"Ten večer sedíš sám u stolu, protože ostatní si už dávno lehli, a před tebou leží ten úlomek — to přetvořené zádržné sklo, které jste vzali kultistům, teď chladné a mrtvé, jenom kus skla s neobvyklou strukturou uvnitř."},{"k":"p","t":"Otáčíš ho v prstech, jako jsi to dělal tu noc, kdy jsi ho poprvé zkoumal, a přemýšlíš o tom, co ti tehdy prošlo hlavou a čemu jsi nevěnoval dost pozornosti, protože jsi měl na práci jiné, naléhavější věci."},{"k":"p","t":"Zádrž nedrží věc na místě silou. Zádrž drží věc v jednom bodě mezi tím, co bylo, a co ještě není. Sedíš s tím dlouho do noci, a pomalu, kousek po kousku, se ti v hlavě skládá věc, kterou jsi nečekal, že tě kdy napadne — protože je to tak zřejmá myšlenka, že se stydíš, že ti trvalo šest dní, než na ni přišel."},{"k":"p","t":"Nepotřebuješ zeď, co zastaví člověka silou. Nepotřebuješ poplach, co ho jenom ohlásí. Potřebuješ hranici, co ho na okamžik zastaví v čase — ne navěky, ne krutě, jenom dost dlouho na to, aby ses stihl probudit a přijít. Potřebuješ zádrž. Ne na děti. Na hranici. Ráno svoláš celou partu ke stolu dřív, než stihnou dopít první kávu, a je v tobě ten druh vzrušení, který jsi necítil od doby, kdy jsi poprvé pochopil, jak funguje rubrika."},{"k":"p","t":"„Já to mám,\" řekneš. „Vím, jak na to.\""},{"k":"p","t":"„Povídej,\" řekne Sandor, ale je v tom hlase opatrnost, protože poslední týden byl plný nápadů, co selhaly."},{"k":"p","t":"„Zádržné sklo nedrží věc na místě silou,\" začneš. „Drží ji v okamžiku, co se nikdy nedokončí. To je to, co dělalo Ostružné tak strašný, a je to taky to, co z toho může udělat něco užitečnýho, jestli to otočíme naruby.\" „Jak naruby?\" zeptá se Mer."},{"k":"p","t":"„Místo abychom zamkli dítě uvnitř momentu, kdy má umřít, zamkneme hranici uvnitř"},{"k":"p","t":"momentu, kdy se přes ni má přejít. Kdokoli, kdo nemá naše svolení, kdo překročí tu čáru — na okamžik ho to zadrží. Ne navždycky. Ne krutě. Jenom dost dlouho, abychom se probudili a přišli se podívat, co to je.\""},{"k":"p","t":"Ticho u stolu, ve kterém si to každý přebírá po svém."},{"k":"p","t":"„To by fungovalo na cokoli, co jde po zemi,\" řekne Tina pomalu. „I kdyby to bylo neviditelný, i kdyby to bylo tichý jako smrt. Fyzicky by to muselo tu čáru překročit.\""},{"k":"p","t":"„A nebolelo by to,\" dodá Mer. „Na rozdíl od bodců nebo pastí. Jenom by je to zastavilo.\" „A ty a Elie a Ula byste na to měli výjimku,\" řekneš, „a kdokoli, komu dáme heslo nebo předmět. Ossvin, Seska, štamgasti, koho chceme pustit.\""},{"k":"p","t":"Sandor se opře v židli a poprvé za celý týden se na jeho tváři objeví něco, co připomíná úsměv. „To by mohlo fungovat,\" řekne. „Jak to uděláš?\" „To nevím ještě jistě,\" přiznáš. „Ale vím, kde začít.\""},{"k":"h2","t":"VII. PRVNÍ POKUS"},{"k":"p","t":"Trvá vám další dva dny, než sestavíte první prototyp — malý skleněný kotouček, ne větší než tvoje dlaň, do kterého vsadíš zlomek toho, co jsi vytáhl z úlomku, propletený s vlastním kouzlem, které znáš líp než cokoli jiného na světě."},{"k":"p","t":"Nemáš na koho to otestovat kromě sebe sama, a to je problém, protože nechceš zjistit, jestli to funguje tak, že se sám zaseknout v čase na hodinu."},{"k":"p","t":"„Já to zkusím,\" nabídne se Sandor."},{"k":"p","t":"„Ty ses dobrovolně přihlásil, abych na tobě mohl testovat nedodělaný kouzlo?\" zeptáš se, napůl s obavou, napůl s pobavením."},{"k":"p","t":"„Já jsem přežil devatenáct let popravování a tři týdny cesty s tebou,\" odpoví Sandor suše. „Jestli mě něco zabije, tak to bude něco chytřejšího, než je tvoje první verze zádržnýho kotoučku.\""},{"k":"p","t":"Zakopeš kotouček na kraji dvora, natáhneš mezi dva kolíky neviditelnou linii, a Sandor se postaví na druhou stranu, připravený."},{"k":"p","t":"„Jdi,\" řekneš."},{"k":"p","t":"Udělá krok."},{"k":"p","t":"[Test první verze.] Nic se nestane."},{"k":"p","t":"Udělá druhý krok, přes to místo, kde má linie procházet."},{"k":"p","t":"Pořád nic."},{"k":"p","t":"„No,\" řekne Sandor, stojící bezpečně na tvé straně dvora, „buď je to moc slabý, nebo jsi zapomněl na něco důležitýho.\""},{"k":"p","t":"Podíváš se na kotouček. Vytáhneš ho ze země. Je studený, mrtvý, jako by nikdy nedostal to, co potřeboval, aby vůbec ožil."},{"k":"p","t":"„Zapomněl jsem na něco důležitýho,\" přiznáš. VIII. LADĚNÍ"},{"k":"p","t":"Druhá verze funguje moc dobře — v tom nejhorším slova smyslu."},{"k":"p","t":"Přidáš víc energie, propojíš to s druhým fragmentem, který ti zbyl, a když to tentokrát zkusíte, Sandor projde linii a ztuhne — doslova, na místě, s nohou napůl zvednutou, oči"},{"k":"p","t":"otevřené, ale nehybné, jako socha."},{"k":"p","t":"„KARI,\" zakřičí Tina, poplašená. „CO SES MU UDĚLAL?\""},{"k":"p","t":"Přiběhneš k němu, srdce ti buší, a zjistíš, že dýchá — pomalu, ale dýchá — jenom je úplně, dokonale zamrzlý, jako by čas kolem něj přestal existovat."},{"k":"p","t":"Trvá to čtvrt hodiny, než to samo odezní a Sandor se s trhnutím vrátí do pohybu,"},{"k":"p","t":"zavrávorá, a první věc, kterou udělá, je, že se pořádně nadechne, jako by se právě vynořil z hluboké vody."},{"k":"p","t":"„To,\" řekne, když se vzpamatuje natolik, aby mluvil, „bylo hodně nepříjemný.\""},{"k":"p","t":"„Promiň,\" řekneš, a myslíš to upřímně."},{"k":"p","t":"„Nepromiň se mi,\" odpoví Sandor. „Řekni mi, cos udělal jinak, ať to opravíš.\""},{"k":"p","t":"„Moc energie. Moc dlouhá vazba.\" Přemýšlíš nahlas, ruce založené. „Potřebuju to zeslabit, ale ne tak, aby to nefungovalo vůbec. Potřebuju to tak akorát — dost na to, aby to zastavilo, málo na to, aby to netrvalo déle, než"},{"k":"p","t":"potřebujeme.\""},{"k":"p","t":"„Kolik pokusů to bude potřebovat?\" zeptá se Mer, s tou trpělivou starostlivostí, kterou má u léčení ran."},{"k":"p","t":"„Nevím,\" přiznáš. „Ale mám dojem, že už jsem blízko.\""},{"k":"p","t":"Třetí verze je lepší. Čtvrtá ještě lepší. Pátá, testovaná na dobrovolné oběti v podobě Tiny, protože Sandor si vysloužil pauzu, zastaví ji na přesně tři vteřiny — dost dlouho, aby se dala slyšet, ne dost dlouho, aby to bylo kruté. „Tohle,\" řekne Tina, když se z toho vzpamatuje, „je vlastně docela příjemný. Jako když se na vteřinu zastaví čas a ty si to uvědomíš, ale nic tě nebolí.\""},{"k":"p","t":"„To je dobré znamení,\" řekneš."},{"k":"p","t":"„Je to skvělý znamení,\" opraví tě Tina. „Znamená to, že jsme to konečně trefili.\" IX. VÝROBA A INSTALACE"},{"k":"p","t":"Teď, když víš, jak to má fungovat, přijde ta část, která nepotřebuje geniální nápad — potřebuje jenom čas a trpělivost."},{"k":"p","t":"Vyrábíš kotoučky jeden po druhém, každý o trochu lepší než ten předchozí, protože se s každým učíš víc, a Sandor s Ulou je zakopávají po celém obvodu pozemku — v pravidelných rozestupech, tam, kde terén dovolí, hustěji tam, kde by se dalo snadno proklouznout."},{"k":"p","t":"Ula u toho pracuje s neobvyklým zaujetím, klečí v hlíně s lopatkou, měří vzdálenosti kroky, a když se jí zeptáš proč se do toho tak položila, odpoví ti bez zaváhání:"},{"k":"p","t":"„Protože tohle je první věc, který jsem se kdy podílela na stavění, místo abych utíkala nebo se schovávala. Chci, aby to bylo pořádně.\" Nic víc k tomu neřekneš. Ale je to jedna z těch vět, co si zapamatuješ."},{"k":"p","t":"Šest dní práce, šestnáct kotoučků, a jedna dlouhá, neviditelná čára kolem celého vašeho pozemku — kolem lesa, přes cestu (tam"},{"k":"p","t":"potřebuješ speciální variantu, co propustí vozy s předem daným znamením na oji), kolem"},{"k":"p","t":"studny, kolem stáje, uzavírající celých padesát metrů kolem domu do jednoho neviditelného, propojeného kruhu."},{"k":"p","t":"Poslední den, když zakopáváš poslední kotouček, ucítíš, jak se celá síť spojí — ne fyzicky, ne zvukem, jenom tím zvláštním vnitřním pocitem, který má nekromant, když ví, že kouzlo právě začalo žít vlastním životem. „Je to hotový,\" řekneš nahlas, spíš sobě než komukoli jinému."},{"k":"h2","t":"X. TEST"},{"k":"p","t":"Rozhodnete se to otestovat pořádně — ne na sobě, ale na někom, kdo o tom neví, protože jenom tak zjistíte, jestli to skutečně funguje na cizí, nepřipravené osobě."},{"k":"p","t":"Nemusíte dlouho čekat."},{"k":"p","t":"Tři dny po dokončení, v poledne, kdy zrovna není karavanní den a hospoda je zavřená, se na cestě objeví povědomá postava v klobouku o dvě čísla větším, než je rozumné, a s kohoutem na rameni, který vypadá stejně unaveně jako vždycky."},{"k":"p","t":"„VOLOTHAMP GEDDARM SE VRACÍ!\" zahřmí Volo, ještě než dojde na dohled. „Volo slyšel report o drakobijci, který zde—\""},{"k":"p","t":"Přejde neviditelnou linii."},{"k":"p","t":"Zamrzne — v půli kroku, ruka napůl zvednutá k gestikulaci, pusa pořád otevřená uprostřed slova, klobouk nachýlený tím směšným úhlem, který na něm ještě před vteřinou vypadal jako sebevědomí a teď vypadá jako komická socha. Melicamp, kohout na jeho rameni, se nezastaví — protože zvířata, jak jste zjistili při testování, projdou tou linií bez potíží, protože nemají tu specifickou lidskou touhu vstoupit tam, kam nepatří — seskočí, projde dál a rozhlédne se po dvoře s výrazem, jaký má drůbež, když čeká na svačinu."},{"k":"p","t":"Celá parta vyjde ven přesně tak, jak jsi doufal — probuzená, upozorněná, připravená, ještě dřív, než Volo stačil dojít až ke dveřím."},{"k":"p","t":"„Funguje to,\" vydechne Tina, s upřímným úžasem."},{"k":"p","t":"„Funguje to na Vola,\" opraví ji Sandor. „To je dobrej test. Kdyby to fungovalo jenom na nás, tak bysme si nebyli jistí. Ale funguje to na chlapa, co si myslí, že drak umí uvařit pivo.\" Tři vteřiny uplynou. Volo se s trhnutím uvolní, zavrávorá, dokončí to gesto, které začal, a rozhlédne se kolem s naprostým zmatením. „Co— \" zarazí se. „Co se to právě stalo?\" „To bylo kouzlo,\" řekneš, snažíš se, aby to znělo věrohodně a ne provinile. „Ochranné kouzlo kolem pozemku. Nic vám neublížilo.\""},{"k":"p","t":"Volo si to chvíli přebírá, a pak se mu na tváři rozlije výraz nefalšovaného nadšení."},{"k":"p","t":"„TAJEMNÁ MAGICKÁ BARIÉRA!\" zvolá, vytáhne notes rychleji, než stihneš cokoli namítnout. „To musí jít do příští edice! Poštovní stanice U Tří vran, chráněná starobylým kouzlem, jehož původ zůstává zahalen"},{"k":"p","t":"tajemstvím!\""},{"k":"p","t":"Nikdo z vás se ho už neobtěžuje opravovat. Naučili jste se to za tři dny, co ho znáte — s Volem se nedá vyhrát, dá se s ním jenom přežít. XI. ZAKOŘENĚNÍ"},{"k":"p","t":"Ten večer sedíte na zápraží, celá parta, a díváte se na tmu, která teď obklopuje váš domov jinak, než obklopovala týden zpátky — ne proto, že by byla méně tmavá, ale proto, že víte, že ta tma má hranici, a ta hranice je vaše."},{"k":"p","t":"„Poprvé od tý noci,\" řekne Mer tiše, „se cejtím doopravdy v bezpečí. Ne jenom doufám. Vím to.\""},{"k":"p","t":"„Já bych rád věděl, jestli by to zastavilo i to, co jsme viděli tu noc,\" řekne Sandor. „Ty postavy. Ten rituální předmět.\""},{"k":"p","t":"„Nevím jistě,\" přiznáš. „Ale vím, že by je to zastavilo aspoň na tři vteřiny, a tři vteřiny, kdy stojíš nehybně na místě a nemůžeš nic dělat, zatímco na tebe míří kuše — to je dost dlouho na to, aby rozhodlo o výsledku.\""},{"k":"p","t":"Ula sedí opodál, kolena u brady, a dívá se na tu neviditelnou linii, kterou sama pomáhala zakopat."},{"k":"p","t":"„Já vím, že to nezastaví všechno,\" řekne, aniž by se otočila. „Vím, že proti dost silnýmu nepříteli to bude jenom zdržení, ne řešení. Ale je to zdržení, který jsme si vybojovali sami. Nikdo nám ho nedal. A to je jiný pocit, než jaký jsem měla, když jsem jenom čekala, až mě někdo najde.\""},{"k":"p","t":"Nikdo na to nic nedodá, protože není co dodat. Dědek se pořád nevrátil. Nikdo neví, kde je, ani kdy přijde."},{"k":"p","t":"Ale poprvé od té noci si nikdo z vás nemyslí, že by ho potřeboval hned — ne proto, že by na něm nezáleželo, ale protože jste si, kousek po kousku, vlastníma rukama, vybudovali něco, co jste předtím čekali, že vám musí dát někdo jiný. Sova přeletí přes dvůr, vysoko, obyčejná noční sova, hledající obyčejnou noční kořist, a nikdo z vás se u toho nezatají dech."},{"k":"p","t":"To je taky vítězství, i když ho nikdo nahlas nepojmenuje."},{"k":"p","t":"Konec."}],"id":"perimetr","era":"Baldurova brána","d0":17,"d1":22},{"title":"Noc útoku","blocks":[{"k":"h2","t":"Noc útoku"},{"k":"p","t":"Třetí noc po otevření se na dvoře U Tří vran objevily sovy — nejdřív čtyři, pak osm, pak jedenáct, vždy naprosto tiché, nikdy nelovily, vždy hleděly k oknu, za kterým spala Elie. Ula si všimla jako první, že to není náhoda. Kaštan Mer poprvé od chvíle, co ho znáte, nezvinul do klubícka a strnul, hledí k jedné konkrétní sově."},{"k":"p","t":"Dědek byl v tu dobu pryč, z neznámého důvodu, a nikdo nevěděl kdy se vrátí."},{"k":"p","t":"Druhou noc přišel útok: čtyři postavy v pláštích, kult z frakce uvnitř víry v Bhaala tak kaciřské, že ji mainstreamoví bhaalisté nepřiznávají. Karibrk je zaskočil Ohnivou koulí přímo do středu rituálu — dva kultisté zemřeli okamžitě, třetí padl pod Sandorovou sekerou. Čtvrtý, prchající, byl na Karibrkův příkaz chycen Sandorem a zlomen, ale ponechán naživu."},{"k":"p","t":"Karibrk oživil jednoho z mrtvých kultistů jako záměrně děsivého nemrtvého, aby zlomil odpor zbylých dvou zajatců. Výslechem (Dorik) i mučením (bratr Kessil, veden Sandorem a pak Karibrkem) získala druzina klíčové informace: kult sídlí ve starém chrámu pod městem, vchod pod mauzoleem rodiny Thornwallů u hospody Zlomený kotel, druhý vchod odtokovou štolou u rybího trhu. Aktuální heslo (měsíčně se mění): „Číše pije naposled“."},{"k":"p","t":"Kult věří Proročství Vyhaslé číše: Elie unikla smrti, kterou jí Bhaal dlužil, Ula přišla o jméno bez zabití — spolu prý otevrou něco, co by jinak vyžadovalo tisíce obětí. Označovací předmět, který měli u sebe, byl přetvořený úlomek zádržného skla — Karibrk poznal technologii okamžitě, je to stejné řemeslo jako v Ostružně. Rituál byl dokončen na 60–70 % než ho Karibrk přerušil — na jedné z holek (nejisté které) zůstalo nestabilní echo stopy."},{"k":"p","t":"Karibrk Kessila po získání hesla zabil pomalu a záměrně krutě, už bez nutnosti — z vlastního hněvu, ne z nezbytnosti. Ula částečně viděla a celé to slyšela z okna; konfrontovala ho ráno přímo, bez slz, věcně. Karibrk se přiznal, že neví jistě, jestli by jí byl schopný ublížit, pokud by ho někdy takhle rozzuřila. Ula použila poprvé za dlouhou dobu jeho celé jméno, ne zkomoleninu — rozhovor skončil bez plného odpuštění, otevřený."},{"k":"p","t":"Ráno Karibrk přiznal celé skupině, že považoval domův za zabezpečený omylem — tlusté zdi na kult nestačí. Obrana perimetru se musí kompletně přehodnotit."}],"id":"noc-utoku","era":"Baldurova brána","d0":26,"d1":27},{"title":"Mauzoleum vyhaslého rodu Malcherů","blocks":[{"k":"h2","t":"Mauzoleum vyhaslého rodu Malcherů"},{"k":"p","t":"Heslo vymáčknuté ze zajatců znělo prostě: „Číše je prázdná.\" Odpověď: „Proto ji plníme.\" A adresa — mauzoleum vyhaslého rodu Malcherů, hřbitov Na spálence, Vnější město. Tina byla připravena jít dovnitř s pláštěm skladnice a provázkem se třemi uzly na zápěstí, ale znala jen heslo, ne vnitřní znamení. Na překladišti to stačilo. U ústí kanálů dole už ne."},{"k":"p","t":"Karibrk šel sám, jako ztracený opilý hobit, co hledá nevěstinec Sharessino pohlazení. U mauzolea seděli dva skladníci, Řehoř a mladší Voleg, čtvrtý den ve dvojité směně — protože tři kluci nepřišli a nikdo je nešel hledat. Pět stříbrných za směnu, o kterých oba věděli, že jsou placené za mlčení. Karibrk jim vyprávěl o tom, jak dělal kočího se čtyřmi koňmi, sto čtyřicet jízd, nikdy se nesměl podívat do kočáru — a když se jednou podíval, byl prázdný. Byl návnada."},{"k":"p","t":"Voleg na to odpověděl, dřív než ho Řehoř stihl zarazit: v bednách je hrobová hlína z okolních hřbitovů a lehčí bedny, které chrastí. Před čtrnácti dny jedna spadla — byly v ní dětské boty, vyčištěné a spárované provázkem. Termín na doručení: tři dny, pak všechno musí být dole. Skladníci sami dolů nikdy nechodí; bedny se staví u zdi ve sklepě a berou se v noci. Skrz podlahu je slyšet, jak dole někdo chodí."},{"k":"p","t":"Karibrk oba skladníky varoval a nabídl jim, ať odejdou dřív, než z nich kult udělá důkaz mlčenlivosti. Řehoř odešel s Volegem, ale nejdřív hodil Karibrkovi klíč od spodní zástrčky a řekl mu, že se neptal jako někdo, kdo bedny chce — ptal se jako někdo, kdo ví, k čemu jsou."},{"k":"p","t":"Uvnitř mauzolea nebyl poklad. Byly tam vyklizené životy — kabáty, nádobí, snubní prsteny, dřevěná kravička s odřeným nosem. Ve zvláštní truhličce tři kouzelné předměty: Kámen štěstí, Boty elfí chůze a vázaný Registr — sloupec čísel, sloupec jmen, poslední zapsané číslo 806, na straně 812 už předepsané číslo bez jména."},{"k":"p","t":"Karibrk hlínu prozkoumal jako nekromant a zjistil, že nejde o žádnou nekromantickou surovinu — hrobová prsť má jedinou moc, a to udělat z místa hřbitov. Navezená ve velkém objemu na místo, které hřbitovem nikdy nebylo, mu dá právo smrti. A dětské boty, vyčištěné a spárované, jsou symbolické pohřby: jeden pár = jedno rezervované místo v nově zakládaném hřbitově. Osm set šest jmen v registru je osm set šest čekajících hrobů."},{"k":"p","t":"Hlínu Karibrk vysypal do mlhy, registr si nechal a mauzoleum zapálil se vším, co v něm bylo — jako vzkaz, ne jako čin z nutnosti. Strop sklepa se propadl po čtvrthodině a odnesl s sebou podlahu; ústí starých kanálů do katakomb zůstalo pod třemi sáhy horkého kamene. Skladiště, cesta i tři dny termínu byly za tu jednu noc pryč."}],"id":"mauzoleum","era":"Baldurova brána","d0":28,"d1":29},{"title":"Rezonance","blocks":[{"k":"h2","t":"Rezonance"},{"k":"p","t":"Registr Karibrk svěřil Elminsterovi výměnou za slib, že se podělí o všechno, co z něj vyčte. Cestou domů U Tří vran čekali všichni vzhůru — Mer, Ula na schodech s husou Skořápkou přitisknutou k boku, Elie klidně spící vedle Uhlíka. Ula, které je padesát tři a vypadá na čtrnáct, se zeptala, jestli to bylo zlé, a když slyšela, že to skončilo dobře, řekla jen: „Ráda tě vidím celýho.\""},{"k":"p","t":"Za svítání seděl Elminster na prahu, jako by tam čekal celou noc. Odpověď na otázku, kterou Karibrkovi sám vnukl — proč se kult probudil zrovna teď — zněla ve třech částech. Palivo měl kult odjakživa: zoufalí lidé jsou ve Vnějším městě vždycky po ruce. Vzduch dostal teprve nedávno, v troskách a chaosu po pádu Baldurovy brány před rokem, kdy si nikdo nevšiml, co se pod městem nadechuje."},{"k":"p","t":"Jiskrou byly Elie a Ula pod jednou střechou. Každá zvlášť byla léta jen anomálie, které si nikdo nevšiml. Spolu, v jednom domě, v dosahu jedna druhé, jsou rezonance — signál slyšitelný přes plán daleko dál, než dokáže dosáhnout jedna anomálie sama. Registr časově sedí přesně na den, kdy družina přivedla Ulu domů k Elie. Elminster to nazval fyzikou, ne vinou: kámen hozený do rybníka nedělá vlny schválně."},{"k":"p","t":"Varoval, ať Elie a Ulu z domu netahají, dokud neřekne proč, a že perimetr U Tří vran drží víc, než družina tuší. Co kult potřebuje pro první rituál, slíbil povědět příště."}],"id":"rezonance","era":"Baldurova brána","d0":30,"d1":30},{"title":"Šutrostrom","blocks":[{"k":"h2","t":"Šutrostrom"},{"k":"p","t":"Strážce severní žíly se nastěhoval U Tří vran výměnou za pomoc se stříbrem a za slib domova, kde ho nikdo nebude honit s krumpáčem. Vybral si kout u okna, kde ráno padá první světlo. Karibrk ho požádal o dohled nad Elie a Ulou — ne stráž, jen blízkost — a on to vzal vážně a doslovně, protože rozumí mezím lépe než kdokoli, kdo je nikdy neporušil."},{"k":"p","t":"Toho večera dostal své první pivo. Ochutnal, prohlásil to za zvláštní, studené a šumící, a hned si řekl o druhé. Sto let nehybnosti u kamenné žíly se během jedné noci proměnilo v první pořádnou opici z kamene, jakou U Tří vran kdy viděly."},{"k":"p","t":"Nemá jméno. Sto let se ho nikdo neptal. Elie mu slíbila, že jedno dostane od holek, dřív než uplyne pár dní — a on řekl, že mu nikdo ještě neslíbil jméno, jenom rozbití nebo prodej."}],"id":"rocky","era":"Baldurova brána","d0":31,"d1":31},{"title":"Krám u Grizeldy a klidný večer","blocks":[{"k":"h2","t":"Krám u Grizeldy a klidný večer"},{"k":"p","t":"Karibrk vzal Elii do Dolního města sehnat pořádnou nekromantskou výbavu. V krámě bez cedule je čekala jednooká stařena, co prodávala i to, co se normálně neprodává — a nabídla mu formuli \"Hlas z prázdna\", vyvolání bez potřeby mrtvoly, výměnou za kousky vzpomínek při každém použití. Karibrk odmítl rovnou, bez váhání (\"nekupuju věci, který mi kradou vlastní hlavu\"), a stařena mu za to jméno slibu a upřímnost naučila jinou formuli zdarma — \"Věrná hlína a kost\", čistou a bez háčku. Koupil si i lebku na řetízku jako komponentní pomůcku."},{"k":"p","t":"Cestou zpátky se stavili u Ossvina pro dřevo na přístřešek pro Uhlíka — modřín, ať to vydrží. Elie dostala první opravdový úkol postavit něco sama. Na večeři ochutnala tradiční hobití jídlo (pečené kořenové placky s medem, dušené houby s tymiánem) a chtěla přidat."},{"k":"p","t":"Večer U Tří vran byl obyčejný a přesně proto vzácný: Sandor brousil sekeru, Tina četla mapu okolí, Mer hlídala, ať Ula něco sní, a Šutrostrom v koutě poprvé v životě zkusil vtip o vlastním jménu. Elie usnula s Uhlíkem v patách. Zítra přijde Elminster s odpovědí."}],"id":"grizelda","era":"Baldurova brána","d0":31,"d1":31},{"title":"Noc bez měsíce","blocks":[{"k":"h2","t":"Noc bez měsíce"},{"k":"p","t":"Pátý den skončil bezměsíčnou nocí přesně, jak Elminster předpověděl. Kult ale nešel po Elii ani po Ule — šel po Rockym. Nalezená prázdná stříbrná nádobka odhalila, že past byla určena pro \"bytost z dluhu\", ne pro dítě. Rocky zůstal doma podle dohody, schoval Elii i Ulu do bezpečí, a útok na okno jejich pokoje odrazila Mer ochranným kouzlem."},{"k":"p","t":"Karibrk s přisluhovačem, Sandorem a Tinou vyřídili tři kultisty u perimetru (Roztříštění, jedovatý postřik, mrazivý dotyk). Sandor v lese dostihl čtvrtého, kterého Karibrk po výslechu v návalu vzteku umlátil kamenem — jméno vůdce kultu padlo: **bratr Ilvos**. Kult má oko v blízkém okruhu domácnosti, které vyzradilo, kde holky spí."},{"k":"p","t":"Elie poprvé řekla Karibrkovi \"tati\". Ráno padlo rozhodnutí: žádné další čekání doma na útok — Karibrk, Sandor, Tina a Mer (s výhradou) vyrazí sami do katakomb, jakmile si odpočinou. Domov dostal pracovní jméno **Útočiště** a plán rozrůst se o pečlivě vybrané loajální hosty."}],"id":"noc-bez-mesice","era":"Baldurova brána","d0":30,"d1":30},{"title":"Než vyjdeme branou","blocks":[{"k":"h2","t":"Než vyjdeme branou"},{"k":"p","t":"Tři dny mezi nocí bez měsíce a odchodem do města patřily přípravám — a loučení, které nikdo nenazval loučením. Každý učil holky přežít po svém. Tina je učila mizet: chůze místo obličeje, vlasy a barva šatů se pamatují první, nikdy neutíkat rovně ani do prázdné ulice, a nakonec i tu nejhorší radu — když tě chytí, nebraň se hned, povol, a teprve až povolí on, běž. Sandor učil čtyři měkká místa, kde velikost nerozhoduje (oči, krk, koleno zezadu, nárt), dal Elii svůj poutní nůž s podmínkou, že ho nikdy nevytáhne, když může běžet, a přikázal jim to nejtěžší: kdyby bylo na vteřiny, nebrat nic, ani psa."},{"k":"p","t":"Mer nakreslila tři znaky — Kelemvorův, Ilmaterův, Tyrův — a naučila je, že za těmi dveřmi je nesmí nikdo odmítnout. A přidala větu, kterou řekla víc jim než sobě: kdyby se parta nevrátila, není to vina holek, a kdo jim to bude tvrdit, je buď hlupák, nebo nepřítel. Rocky nic neučil. Vykopal u stáje díru vystlanou dřevem, se dvěma vzduchovými rourami do stáje, a řekl, že nad ní bude stát a že aby se k nim někdo dostal, musel by nejdřív rozbít jeho. Pak dodal, že se s nikým neloučí, protože nikam nejde."},{"k":"q","t":"„Já nechci vědět, jak se utíká.\""},{"k":"p","t":"Zlom přišel u večeře druhého dne. Karibrk požádal Elii, ať mu píše, co se každý den stane — myslel tím \"vrátím se a přečtu si to\". Elie slyšela to druhé. A poprvé od Ostružné se zhroutila jako obyčejná devítiletá holka: že rok zpátky nevěděla, co je postel ani jak chutná med, a teď to ví a učí se, jak žít, až to zase nebude. Karibrk jí nelhal ani tehdy — řekl jí, že to fér není, že všechno naučené nejspíš zapomene, a že se vrátí, protože ho drží úpis, o kterém kult neví. Elie mu podruhé řekla tati."},{"k":"p","t":"V noci přišla Ula. Ptala se, jestli jí Karibrk řekne, ať se o Elii postará. Neřekl. Řekl \"nestarej se o ni, buď s ní\" — a zakázal jí obětovat se, protože mr
